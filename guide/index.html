 them on the vehicle doing them, and a run carrying one is not rebuilt.\n\nIf a vehicle that cannot work that day had loads, they are taken off and planned elsewhere, or the panel names those that are stuck and why.\n\n## Plan everything\n\nChoose **Plan everything** under **How to plan** when you need every job planned. Pick **How long to search**: **30 s**, **1 min**, **2 min** or **5 min**.\n\nIt weighs everything in pounds: empty miles at each vehicle's running cost, each hour over a driver's normal day as £150, each hour past the duty warning as £600, and a vehicle with no free driver as £150. It never sends a vehicle further empty than your limit, and a job no vehicle can reach within it is left out, naming the nearest.\n\nWhile it works you see the progress bar, how many combinations it has tried, and the best plan so far. **Stop - use the best so far** ends the search and lets you review the best plan found. **Cancel** throws it away. When it finishes, you review the plan exactly as above. Runs that bend a limit are marked, and a warning lists how many: \"To fit everything in: 3 runs over the driver's normal hours\".\n\nThe proposal shows road miles, so it should match the board after you accept. The exception is **Stop - use the best so far**, which uses estimates.\n\n## Good to know\n\n- **Nothing changes until you accept.** And you can undo straight afterwards.\n- **If the board changed while you were reviewing**, re-plan refuses with a message that the board changed. Close it and start again.\n- **Sent runs are never rebuilt.** A run on a driver's phone is left alone.\n- **Hours are a limit, not a block.** Estimated hours are a guide, so you can always accept a plan that goes over and fix it by hand.\n- **Aims are presets.** The three aims set how much weight is given to empty miles, balance and profit.\n- **It uses your drivers' own day length** and counts the drive back to the yard unless the run stays out.\n\n## When something goes wrong\n\n- **\"There are no unplanned jobs … to plan on this day\"**: choose **+ last 7 days** under **Jobs to plan** to pull in earlier jobs.\n- **\"Nothing could be planned with these settings\"**: open **not planned** to see why. Often every vehicle is too far away. Raise the empty-mile limit or tick **No limit**.\n- **Miles limit refused**: the empty-mile limit must be a number above zero.\n- **\"…had been planned by someone else meanwhile, so were left alone\"**: a colleague planned those jobs while you were reviewing.\n"}, {"id": "trailers-and-split-loads", "n": 9, "title": "Trailers and split loads", "md": "# 9. Trailers and split loads\n\n## What it's for\n\nIf you run trailers, you need to know which trailer is behind which vehicle, and where loaded trailers have been left waiting. The **Trailer board** shows that. A **split load** is one job done in two parts: one vehicle takes it as far as a handover place (usually the yard) and another vehicle, or the same one another day, finishes it.\n\n## Before you start\n\n- Add your trailers on **Fleet > Vehicles & trailers**.\n- Set your yard and swap points on **Customers > Places**.\n- The waiting-time colours (amber then red) use the days set in **Settings**.\n\n## The Trailer board\n\nOpen **Operations > Trailer board**. The top shows how many trailers you have, how many are with a vehicle, how many are **loaded & waiting**, any over the amber and red days, any that **can't legally go out**, and any **missing test or inspection dates**.\n\n- **Not with a vehicle** is a tray of trailers not coupled to anything, with where each is.\n- Below it, a card per vehicle shows its trailer. If the trailer is loaded, the customer and lane show.\n- **Loaded & waiting** on the right lists trailers dropped with their load on, waiting for a vehicle to collect them. They turn amber and then red the longer they wait.\n\nA vehicle pulls one trailer at a time.\n\n### Pairing a trailer with a vehicle\n\n1. Drag the trailer chip onto the vehicle you want. It changes straight away.\n2. If that vehicle already had a trailer, the message says which one came off in exchange.\n3. To unpair, drop the trailer on **Not with a vehicle**.\n4. Or click the trailer and choose **With vehicle**, or **Where it is** for one not coupled.\n\nA loaded trailer cannot be re-coupled: the app refuses and names the load. Use **Split load** on the Planning board to hand a load over properly.\n\nTo see a later day, pick it in the **Where the trailers are on** date box. You see the trailers as they will be on that day, with the swaps and split loads planned. You cannot drag on a later day. Go back to **Today** for that.\n\nUse **Find a vehicle or trailer…** to search. **Only vehicles with a trailer** hides the rest.\n\n## Splitting a load\n\n1. On the Planning board, find the job on its run and press ⇄ (**Split load**). Or open **Run details** and press **Split load…** beside the job. A job that has already arrived at delivery cannot be split.\n2. Choose **Which trailer is it on?** The vehicle's own trailer is offered first.\n3. Check **[vehicle] takes it to**. It is filled in with where the run finishes, normally the yard. Change it if the handover is somewhere else.\n4. Choose **Then**:\n   - **Someone takes it on from there**: the trailer is left at the place and the load waits under **Loads to move on**.\n   - **[vehicle] carries on with it**: set the date under **On** (a later day). The trailer stays on the vehicle overnight, and part 2 goes first on its run that day.\n5. Press **Split the load**.\n\nThe first driver collects the load as normal and takes it to the handover place. On the board, the job shows **Part 1 → Main yard**. If the load stays on the vehicle, it says **load stays on**. The driver's phone steps are reworded: **Arrived at Main yard** and **Trailer dropped**.\n\n### Picking up a waiting load\n\nA waiting load appears in the Unplanned list under **Loads to move on**, with the days it has waited.\n\n1. On the Planning board, click the vehicle that will take it. Press **Take on with DE24 MOH** on the load. Or drag the load onto a lane.\n2. Alternatively, on the Trailer board press **Pick up…** on the waiting trailer, choose the **Day** and **Vehicle** and press **Put it on the run**.\n3. The run gets a part 2 job: from the handover place to the delivery. It reads **Part 2 from Main yard**. If that vehicle already has a trailer on, it leaves it at the handover place and takes the loaded one, shown as \"Leaves …, takes …\".\n\nThe driver's steps for part 2 read **Arrived at Main yard**, **Trailer on – leaving**, **Arrived at delivery** and **Delivered**.\n\n### Changing your mind\n\n- **Join back up** (⇆ on a part) puts the job back as one, as long as part 1 has not been done.\n- Taking part 2 off its run puts the load back to waiting and gives the vehicle its own trailer back.\n- Taking part 1 off is refused while part 2 is planned.\n- A part can be moved to another run by dragging it. Trailers are re-coupled for you.\n- **Mark empty** on a waiting trailer clears it when its job has been cancelled.\n\n### Other trailer actions on a run\n\nIn **Run details**, **Calls partway through the day** can drop one trailer and take another at a place, such as a swap at the yard. The empty miles count in the run.\n\n## Good to know\n\n- **Money is shared out fairly.** Each part gets its share of the job's miles, hours and price by distance, adding back to the job exactly.\n- **Delivery counts as part 2.** The job is treated as delivered when part 2 is. The ticket belongs to the delivering part. If part 1 is done and no one is planned to take it on, the job is flagged as left at the place with nobody planned.\n- **Split loads and Optimise day.** A run carrying a part is never rebuilt by Optimise day or **Clear draft runs**.\n- **A split job cannot be moved by date.** Move each part on the Planning board.\n- **Waiting trailers are visible.** They are listed in the Unplanned list and on the Trailer board so they are not forgotten.\n\n## When something goes wrong\n\n- **\"No trailers set up yet - add them on Vehicles & trailers.\"**: add trailers first.\n- **A coupling refused naming a load**: the trailer is loaded. Hand the load over with a split load.\n- **\"Dragging changes trailers now - go back to Today to do that\"**: you are viewing a later day.\n- **Can't legally go out** on a trailer: its test or inspection date is out. See chapter 14.\n- **\"Still saving - try again in a second.\"**: wait and try the split or join again.\n"}, {"id": "sending-runs", "n": 10, "title": "Sending runs to drivers", "md": "# 10. Sending runs to drivers\n\n## What it's for\n\nWhen a run is planned, you send it to the driver's phone. The driver sees their jobs in order, taps a button at each step, and everything they tap comes back to the Planning board live. This chapter covers sending, what happens when you change a run afterwards, and what the driver sees. Chapter 11 covers the driver's side in full.\n\n## Before you start\n\n- The driver needs a phone app login. Give it on **HR > Drivers**: open the driver and choose **Give app access**. Chapter 4 covers invitations.\n- The run needs a driver and at least one job.\n- Add the driver's phone number on **Drivers**. The board shows it if a driver must be rung.\n\n## How to send\n\n### One run\n\n1. On the Planning board, check the run. Press **Send to driver** on its lane (in Compact, open the row first).\n2. The button changes to **Sent 07:42 ✓**.\n\n### Every run for the day\n\n1. Press **Send to drivers (n)** in the top bar. It appears when some runs have a driver but are not on their phone yet, or have changed since.\n2. A list shows each run: the driver, the vehicle, whether it is **new** or **changed since it was sent**, and the jobs in order with site instructions and run notes. This is what the driver will see.\n3. Check it, then press **Send them**. Press **Not yet** to go back.\n\nRuns with no driver or no jobs are not sent. Imported history is never sent.\n\n### Runs that cannot go\n\n- A run that cannot go out at all (a Red defect, no licence, an expired driver document) shows **Can't send - see the warning**. In the day's send list, it appears under **Not going**, with the reason.\n- A run on a vehicle that is off the road for another reason asks you why before it goes.\n- If a defect sounds worse than its colour and the workshop has not decided yet, the run is held out of **Send to drivers**. It is listed under **Waiting for the workshop** with a **Send anyway** button. A run's own **Send** asks you first. Once the workshop sets its colour, finds no fault or repairs it, the run goes with the others.\n\n## When you change a run after sending\n\nThe button changes to **Changed – send again**. Change what you need, then press it. The driver sees the new version. If a run is on a driver's phone and then cannot go ahead (for example the vehicle goes off the road), a red **Ring the driver now** box on the board lists the run with the driver's phone number. Ring them.\n\nA driver's progress (what they have already tapped) is not counted as a change. A job that is moved keeps its progress. Optimise day and **Clear draft runs** never touch a run that has been sent.\n\nSending also confirms the run.\n\n## Messaging a driver\n\nPress **Message driver** on a lane (or in the opened Compact row). Type what you want, for example \"Tip at the back gate today - the front is shut for resurfacing.\" It shows at the top of the driver's app until they tap **Got it**, and you see when they did.\n\n## What the driver sees\n\n- Only runs that have been sent. If nothing has been sent, they see \"Nothing sent to you for today yet.\"\n- **Do your walk-around check**, before the first job, until a check has been done on that vehicle today.\n- Their jobs in order, with site instructions, goods and your run notes.\n- One big button per step: **Arrived at collection**, **Loaded – leaving**, **Arrived at delivery**, **Delivered**. At delivery they can enter the delivery ticket number and who signed for it. If your settings ask for a ticket, the phone asks, with a way out for \"no ticket\". It warns but never blocks.\n- Photos at loading and delivery, if you have asked for them.\n- An **Undo** for a tap by mistake, for 30 minutes.\n- Any change from the office, such as **Something's gone wrong**, at the top, until they tap **Got it**. A vehicle that goes off the road after the run was sent shows a red card, and its steps are refused.\n\nOn your board, each step the driver taps appears as the job's status: **At collection**, **Loaded**, **At delivery**, **Done**. The job panel shows the times. If the vehicle has a tracker, the waiting time comes from the tracker, and the driver's own taps sit beside it.\n\n## Good to know\n\n- **The board is live both ways.** Taps appear on your board within a few seconds.\n- **Drivers see only their own runs,** and never see money.\n- **If the driver forgets to tap,** you can record progress from the job panel (chapter 6).\n- **A run sent is a run confirmed.** Once sent, Optimise day never rebuilds it.\n- **Driver changes after sending:** if you change the driver on a sent run, send it again so the new driver gets it.\n\n## When something goes wrong\n\n- **No Send button on a lane**: the run has no driver. Choose one first.\n- **\"Can't send - see the warning\"**: read the lane's warning. It names the cause.\n- **A driver says they cannot see their run**: check it shows **Sent** and that they have app access. Ask them to open the app.\n- **\"Sent\" but they have an old version**: it should say **Changed – send again**. Press it.\n- **Runs listed under Waiting for the workshop**: the defect has not been cleared by the workshop. See chapter 15.\n"}, {"id": "driver-app", "n": 11, "title": "The driver app", "md": "# 11. The driver app\n\n## What it's for\nThe driver app is the phone side of TransportInsight. It shows a driver the runs the office has sent them, gives them one big button for each step of a job, and sends everything back to the Planning board within seconds. It also takes their walk-around check, defect reports, fuel, incidents and time-off requests.\n\nA driver does not need an office login. They have their own driver-app login, and it only opens this app.\n\n## Before you start\n- The driver must exist under **HR > Drivers**, and you must have given them app access (see chapter 4, Your team).\n- The driver puts the app on their home screen. When they first open it, a card says **Put TransportInsight on your home screen**. On an Android phone they tap **Add it to my home screen**, or use the browser menu and choose **Install app** or **Add to Home screen**. On an iPhone they must use Safari: tap the share button, then **Add to Home Screen**. After that they open it from the home screen. It then looks like an app and keeps working with no signal.\n- The office must have sent the run to them (chapter 10). The app shows only sent runs.\n\n## How to start your day\nThe top of the screen shows your name and your company. The menu along the top has **Report a defect** and **Log fuel** to hand all day. Under **More** you find **Walk-around check**, **Report an incident** and **Time off**.\n\nOn today's page the start of your shift runs in order, with a tick as each step is done:\n1. **Clock in** (the button reads **Clock in - start my day**).\n2. **Walk-around check**. The button reads **Do your walk-around check**, followed by the registration, for example DE24 MOH.\n3. **Your day**, which is your runs.\n\nEach run card shows the vehicle's registration, any trailer, where the run **Start**s and where it **Finish**es. If the run has no finish place it says **Staying out tonight**. If it starts \"From where you finished last\", the vehicle is already out.\n\nA progress bar shows how many jobs are delivered, for example 2/5 delivered.\n\n## How to work through a job\nEach job card shows the customer, their reference, where it is **From** and **To**, any site instructions, and what is being carried. If the load is dangerous goods, the card says so. **Navigate** opens the address in your phone's maps.\n\nThe big button always shows the next step:\n1. **Arrived at collection**\n2. **Loaded – leaving**\n3. **Arrived at delivery**\n4. **Delivered**\n\nTap it at each stage. The job's status line reads Not started, At collection, Loaded, on the way, At delivery, then Delivered, and the times you tapped are shown on the card.\n\nAt collection, **Photo of the load** lets you take a loading photo. If your company wants a minimum number of loading photos, tapping **Loaded – leaving** first reminds you how many are needed. You can still carry on with **Loaded – leaving without one**. It never blocks you.\n\n### Delivering\nTapping **Delivered** opens the delivery form:\n1. Type the **Delivery ticket number**. It says \"(if there is one)\" when your company doesn't insist.\n2. Take delivery photos with **Delivery photos (the ticket, the tipped load...)**. After the first it reads **Another delivery photo**.\n3. Optionally type **Signed for by**.\n4. Optionally have the receiver sign on the phone in the signature box. If you drew a signature, the button reads **Save the signature and confirm delivered**. Otherwise it reads **Confirm delivered**.\n\nIf your company requires a ticket number and there is none, tap **No ticket – deliver without one**. If you aren't ready, tap **Not yet**.\n\nThe screen says **Delivered – thanks** (or **Done – thanks** for a part that isn't the final delivery).\n\n### Split loads\nA split load shows a line at the top of the job: **Part 1 of a split load – take it to** the handover place, or **Part 2 of a split load – pick up** the trailer there. The buttons change to suit. Part 1 ends with **Trailer dropped** or **Parked up – load stays on**. Part 2 starts with **Arrived at** the handover place, then **Trailer on – leaving**.\n\n### Stops between jobs\nA run can include calls such as dropping a trailer, picking one up, or a yard swap. They show in their place in the day as **First:** or **Then:** lines.\n\n### Mis-taps\nIf you tap the wrong step, an **Undo** button appears under the job, naming the step. It works for 30 minutes after the tap. Undoing **Delivered** removes the ticket you typed. If another phone has moved the job on since, Undo only takes back the step you were looking at.\n\n## How to do a walk-around check\n1. Tap **Do your walk-around check**, or **More > Walk-around check**.\n2. Under **Vehicle**, pick your vehicle. If you change it half-way, the app warns that the answers so far are cleared.\n3. Under **Trailer**, pick the trailer or **No trailer**.\n4. Answer every item **OK** or **Fault**. **Everything else is OK** answers all the unanswered ones in one tap; faults you've already marked stay.\n5. For a fault, type what's wrong in **What's wrong? (helps the workshop)**. You can add a photo of the fault. A fault shows the colour it goes to the office as: **Red - don't drive it**, **Amber - can drive, fix soon** or **Green - cosmetic only**. On items where a fault takes the vehicle off the road, the screen says **A fault here takes the vehicle off the road.**\n6. Enter the mileage when asked. If it is lower than the last reading, you'll be asked to check the number on the clock and tap **Yes, that's right** if it really is correct.\n7. Tap **Send check**. If something is unanswered, the button says **Still to answer:** followed by the item.\n\nThe result reads **Check sent - all OK**, **Check sent - faults reported** or **Vehicle taken off the road**.\n\nIf the words you type sound worse than the colour you chose, the phone asks. See chapter 15.\n\n## How to report a defect\nUse **Report a defect** at any time, for a vehicle or a trailer.\n1. Pick **Vehicle or trailer**.\n2. Under **How bad?** choose Green, Amber or Red. **Red takes it off the road straight away.**\n3. Type **What's wrong?**\n4. Add a photo if you can. It helps the workshop.\n5. Tap **Send to the office**.\n\n## How to log fuel\n1. Tap **Log fuel**, choose **Diesel** or **AdBlue**.\n2. Pick your vehicle.\n3. Type the **Litres (on the pump)**, for example 412.5.\n4. For diesel, type the **Miles on the clock** and tap **Yes, to full** or **No, part**.\n5. Tap **Save**.\n\nThe miles and \"filled to full\" let the office work out the vehicle's real MPG. If Save is greyed out, the line under it says what's still to fill in.\n\n## How to report an incident\n**More > Report an incident**. The screen first says **Anyone hurt? Call 999 first. Then tell us here.** Describe what happened and where, tick if a cyclist, pedestrian, motorcyclist or horse rider was involved, if someone was hurt, or if another vehicle, person or property was involved, add photos, and tap **Send to the office**.\n\n## How to ask for time off\n**More > Time off** shows your holiday taken or booked this year and your requests: **Waiting for a yes**, **Turned down** (with the office's note) and **Earlier this year**. Tap **Ask for time off**, choose the first and last day, All day, Morning or Afternoon for part days, add a note, and tap **Send to the office**. You can **Take back** a waiting request but not an approved one.\n\n## Other things on the screen\n- **Clocking in and out.** Your location is noted only when you clock in, clock out or start a job. Your phone asks first and you can say no; clocking still works. At the end of the day, **End of your shift** has **Clock out - finish my day**. If jobs are still open it asks you to be sure.\n- **Messages and things to sign.** Messages from the office, policies to read and a yearly declaration can appear at the top. A policy shows **I've read and understood it**.\n- **Change from the office.** If the office changes a job (**Change from the office**), it shows in red until you tap **Got it**.\n- **Defect colour changed.** If the workshop changes the colour of a defect you reported, you're told. A Red is always told: **is now Red - don't drive it**. Tap **Got it**.\n- **Coming up.** Chips show your next days with runs. Use the arrows at the top to browse days. A later day's jobs can't be started yet.\n- **What the office has from me today.** Shows everything the office has received from you.\n- **Workshop booking.** If a vehicle you drive is booked into the workshop in the next week, a note says so.\n\n## Good to know\n- **A Red vehicle can't be driven.** If a vehicle is taken off the road after the run was sent, the run shows **is off the road - don't drive it**, the step buttons are stopped, and a **Ring the office** button appears.\n- **It works with no signal.** The last copy of your day is kept on the phone. Taps, photos, checks, defects, fuel and clocking are saved on the phone with the time you tapped, and send by themselves when there is signal. A strip says **Not sent yet** while they wait. When they go, you're told **Nothing left waiting on this phone**.\n- **The time stays true.** A tap sent later keeps the time you made it.\n- **Signing out** with unsent items asks first. They stay on the phone and send next time you sign in.\n- **The phone never asks for money or costs.** Drivers don't see prices.\n\n## When something goes wrong\n- **Nothing sent to you for today yet.** The office hasn't sent your run. If the text says the planner has work planned but hasn't sent it, ring the office.\n- **A saved photo wasn't accepted / Your check didn't go through.** The office's system refused it and the reason is shown. Ring the office and tell them what it was and when, so they can put it in by hand, then tap **I've told the office - remove it**.\n- **Couldn't send, and this phone wouldn't store it.** Keep the app open and find signal.\n- **Type the ticket number first.** Your company requires a ticket. Type it, or tap **No ticket – deliver without one**.\n- **Check NOT saved - keep the app open.** The phone had no signal and no room to keep it. Stay on the screen until you have signal. If anything is dangerous, don't drive it and ring the office.\n"}, {"id": "mechanic-app", "n": 12, "title": "The mechanic app", "md": "# 12. The mechanic app\n\n## What it's for\nThe mechanic app puts the workshop's jobs on a mechanic's phone. They see the job cards the foreman has given them, clock on and off each job, add parts and notes, log faults they find, take photos, and sign off a booking's checklist. The foreman sees it all on the job card straight away.\n\nIt never shows money. No costs, prices or rates appear anywhere in it.\n\n## Before you start\n- The mechanic must be set up under **Workshop > Mechanics**, and given app access from there with **Give app access**. A mechanic uses the same kind of phone login as a driver.\n- If someone is both a driver and a mechanic, one login does both. The top of the screen shows a switch: **My day** | **Workshop**. The app remembers which one you last used.\n- If your company uses outside firms only (no own workshop), the Mechanics screen is hidden and this app isn't used.\n- Put the app on the home screen the same way as the driver app (see chapter 11).\n\n## The screen\nThe header shows the mechanic's name and the company, then a menu: **My jobs**, **My van** (only if stock has been put on your van) and **Time off**.\n\nThe jobs list has these headings:\n- **On your day today**: jobs the foreman has put on your day, in order, with the planned time. If there are none: **Nothing on your day today.**\n- **Done today**\n- **Also yours (n) - not on today**: your other open jobs, folded away.\n- **Other open jobs**: anyone's open jobs.\n- **Booked in**: bookings for you and unassigned ones (see below).\n\nEach job shows its vehicle (a registration plate, or a trailer chip), the card number such as JC-0001, its status, the title, and whether it's **Our vehicle**, **Our trailer** or an outside customer's. Status words are **New**, **Waiting to start**, **In progress** and **Waiting for parts**. A job off the road shows **off the road**. If a colleague is already on it, their name shows. Tap **Open the job** to see it all; **Close the job** shuts it.\n\n## How to clock on a job\n1. Find the job and tap **Clock in on JC-0001**. For a job at a customer's site the button reads **Clock in on JC-0001 - setting off**, which starts the clock as travel.\n2. When you get there, tap **Arrived on site**. Directions to the site postcode are shown while travelling.\n3. When you stop, tap **Clock out**.\n4. The screen asks **where's it at now?** with three buttons: **Waiting for parts**, **Still in progress**, **Done**.\n\nYou can only be on one job at a time. If you are already on one, the other job's button says **Switch to JC-0002**; tap it again within a few seconds (**Tap again to stop JC-0001 and start JC-0002**). This is so a stray tap can't switch you.\n\nA banner **Now on** shows what you're on, with the time since you started.\n\n**Other work**: for things with no job card, choose one under \"Other work - no job card needed\": Yard / sweeping up, Tools and kit, Parts run, Helping someone, Training, Moving vehicles, Break, or Something else. Add a note and tap **Start**. Whatever you were on stops by itself.\n\nThe clock card at the top has **Clock in - start my day** and **Clock out - finish my day**. Your location is noted only at the moment you clock in, out or start a job.\n\n### Forgotten clock-outs\nIf you forgot to clock out, the screen says \"You clocked in ... and didn't clock out\" and asks **When you stopped**. Fill it in to finish that day. You can't start or switch a job while an earlier day's clock is still running.\n\n## How to add parts\n1. Open the job and find **Parts on it**.\n2. Type the part's name or number. Pick it from the list. A new name is added to the parts list without a price.\n3. Check the amount under **How many**. If you have stock on more than one shelf, choose **Taken from**; blank means your own van.\n4. Tap **Add the part**.\n\nTo remove one you added yourself, tap **Take off**, then **Yes, take it off**. You can only take off your own.\n\nWhen you mark a job Done with no parts on it, the app asks **No parts on it - did you fit any?**\n\n## How to add a note\nIn **What you found and did**, type for example \"replaced bulb, checked wiring - all OK\" and tap **Save note**. Your name, the date and time are put in front of it.\n\n## How to log another fault you found\n1. On the job, tap **Found another fault**.\n2. Choose **This vehicle** or a trailer under **On the vehicle or a trailer**.\n3. Describe it under **What did you find**.\n4. Pick the colour: **Red - don't drive it**, **Amber - can drive, fix soon** or **Green - cosmetic only**.\n5. Tick **I'm fixing it on this job** if you are.\n6. Tap **Save the fault**.\n\nIf your words sound worse than the colour you picked, the app asks, the same as on the driver's phone (chapter 15). A Red with no signal is saved on the phone, and the screen tells you to tell the foreman now.\n\nFaults you logged show on the card as **Logged by you**, and ones you found show **Found by you** until the foreman has dealt with them.\n\n## How to say a job is waiting for parts\nTap **Where's this job at?** (always on the card, not only after clocking out), choose **Waiting for parts**, type **Which part, and how many** (for example \"1 x 315/80 drive tyre\"), and tap **Mark waiting for it**. The foreman sees it on the job so they can order it. When the parts arrive, tap **Parts here - back in progress**.\n\n## How to finish a job\nTap **Finish this job…** and confirm with **Yes - finish the job**. If the sheet has failed items the app reminds you first.\n\n## Photos\n**Take a photo** on the job adds a picture to the job card.\n\n## Bookings (MOTs, services, inspections)\nUnder **Booked in** you see work booked for you, or for nobody yet. You can:\n- Tap **+ Book work in**, pick the vehicle or trailer, what it's for, the day (and **Until** if more than a day), an optional time, and what needs doing, then **Book it in**. It is booked on you, in the workshop. The office sees it at once, and a vehicle comes off the Planning board for those days.\n- Tap **It's in** when the vehicle arrives.\n- Work through the checklist. Each item can be ticked, or marked as a fault with how bad it is and a note (**What's wrong?**). **Tick the rest** does the remaining ones. Add **Notes**.\n- Type the mileage. If it is lower than the last reading, you're asked to confirm with **Yes, that's right** or **No, let me change it**.\n- Tap **Checklist complete - sign it off**.\n- **Make a job card (parts, faults, time)** turns a booking into a job card.\n\nA booking in the past reads **Past - did it happen?** Only the office cancels a booking.\n\n## My van\nIf your company keeps stock on vans, **My van** lists the parts on yours and how many. Fitting a part on a job takes it off. If one is short, tap **Ask for more**. It goes on an order for the foreman to send. If more were fitted than the van had, it shows **none left**.\n\n## Time off\n**Time off** works the same as on the driver app (chapter 11): your allowance, your requests, and **Ask for time off**.\n\n## Good to know\n- **One job at a time.** That keeps your hours honest. A refusal names the job you're still on.\n- **No signal.** Clocking, parts, notes, faults and photos are saved on the phone with the time you tapped and sent when you're back in signal. The app tells you when something couldn't be kept; then keep the app open until it sends.\n- **A Red fault must be told.** Even with no signal the fault is saved, but ring the foreman.\n- **The foreman sees everything live.** Clock times appear on the Workshop board.\n\n## When something goes wrong\n- **Not accepted.** A line you added was refused (for example a part more than the card allows). The reason is shown; fix it or tell the foreman.\n- **Another job is still running from an earlier day.** Clock it out with the real time first.\n- **No signal and the phone couldn't save it.** Keep the app open until it sends.\n"}, {"id": "vehicles-and-trailers", "n": 13, "title": "Vehicles and trailers, trackers, Fuel & MPG", "md": "# 13. Vehicles and trailers, trackers, Fuel & MPG\n\n## What it's for\n**Fleet > Vehicles & trailers** is everything on your O-licence in one place: each vehicle and trailer, what it costs to run, its test and inspection dates, and whether it is on the road. **Fleet > Trackers** adds where your vehicles really were, from their trackers rather than the driver's taps, and the real fuel figures from the vehicle itself.\n\n## Before you start\n- Vehicles can be added by hand or created by your history import (chapter 3). Ones an import made are marked **needs details**. Fill them in so jobs cost properly.\n- For trackers you need your tracker company's login or an export file.\n\n## How to add a vehicle\n1. Go to **Fleet > Vehicles & trailers** and press **Add vehicle**.\n2. Fill in **Registration**, **Fleet number**, the role and **Owned / hired**. Registrations show as plates.\n3. Open **More details - usual driver and run, groups, what it can do** if you need them (below).\n4. Fill in **Costing figures** and **Compliance** (below).\n5. Press save. The toast says **Vehicle added**.\n\nSearch the list with **Search registration, type…**. Tick **Needs details only** to see ones to complete. The list shows each vehicle's usual driver and pattern, MOT due and **Inspection due**, and a status such as **Available**, **Out of test**, **Inactive** or **Off the road**.\n\n## How to add a trailer\nPress **Add trailer**. Fill in **Trailer registration / number**, **DVSA trailer ID** (the C number on the ministry plate, for example C123456, which is what DVSA's MOT record knows it by), **Trailer type**, **Normally coupled to** (the standing pairing shown on the Trailer board, or **Detached**), **Height (metres)**, MOT and inspection dates, and **What it can do**.\n\nTo fill in every trailer's C number at once, press **Trailer IDs from a spreadsheet**. Copy two columns from Excel (the trailer's number as it is on TransportInsight, then the C number), paste them, and press **Save n trailer IDs**. It tells you any numbers it couldn't find.\n\n## The costing figures\nThese feed every quote and job cost:\n- **MPG (typed in)**: used when there's no tracker or fuel-receipt figure, or always if you choose so below.\n- **Fixed cost per day (£)**: finance or lease, insurance, road tax, a share of the yard. Left blank, every day the vehicle works is costed with £0 of it, so profit reads too high. The list flags **no fixed cost** and says so.\n- **Maintenance (pence per mile)** and **Tyres (pence per mile)**.\n- **Idle fuel (litres per hour)**.\n- **Height (metres)**.\n\n## The compliance dates\n**MOT due**, **Inspection due** and **Tacho calibration due** (\"every 2 years - on the plaque by the tachograph\"). The **Odometer reads in** setting is **Miles** or **Kilometres**. Untick **Active** to remove a vehicle from Planning. Untick **Needs details** once you've checked an imported one.\n\nIf your company has an operator licence set up, you also choose the **Operating centre**, and untick **Needs an O-licence (over 3.5 tonnes)** for vans and cars of 3.5 tonnes or under.\n\n## On the planning board\nUnder **More details** is **On the planning board**: **Usual driver** (put on this vehicle's new runs; blank means whoever drove it last) and **Usual run pattern** (for example tramping: no yard at the end, and the next day starts from the last drop). **Board defaults** at the top of the list sets these for many vehicles in one go: **Fill the blanks from history**, or **Redo them all**, or set one **Usual run pattern for every vehicle**. You can also choose which patterns go back to the yard each night and which stay out overnight.\n\n## How to see MPG for quotes\nOpen a vehicle and find the **MPG for quotes** panel. It shows the figure being used and where it came from: **Fuel receipts**, **Typed in**, **Fleet average** or **Standard figure**. Under **Which MPG to use**, **Best available** uses the best source it has; **Always what I type** uses your typed MPG.\n\nTo record a fill by hand, press **Add a fuel fill**, enter the date, litres, **Miles on the clock** (needed for MPG), optional **Cost (£, optional)**, choose **Diesel**, **AdBlue** or **Red diesel**, tick **Filled to full**, and press **Save the fill**. The table lists **Date**, **Litres**, **Miles on clock**, **Full?** and **Cost**. A fill that is lower than the one before, or a huge jump, is marked **Left out - lower than the one before, or a huge jump**, and doesn't count. A fill typed by mistake can be taken off with **Take off**.\n\nDrivers also log fuel from their phone (chapter 11).\n\n## Running costs\n**Running costs** shows what each vehicle costs to run (fuel, AdBlue, maintenance, tyres) against the rest of the fleet.\n\n## How to take a vehicle off the road\n1. Open the vehicle and press **Take off the road (VOR)**.\n2. Type a reason such as \"brake fault\". Leave the start time blank for now, or set when it began.\n3. Press **Mark VOR**. The toast says **Marked off the road**.\n4. When it's fixed, press **Put back on the road**.\n\nDetails are in chapter 14. A vehicle off the road can't be planned.\n\n## How to connect a tracker\nGo to **Fleet > Trackers** and press **Connect a tracker**.\n1. Under **Which tracker system?** choose yours.\n2. If the app fetches it (Volvo Connect is the one set up this way), type the login and press **Sign in and connect**. The app tries the login straight away and nothing changes if it doesn't work. The password is kept encrypted and is never shown again, not even to you. When it works, you're told how many vehicles it can see, and it fetches the last two weeks.\n3. If your tracker company sends the data to you, press **Make the sending key**. You get an **Address to send to** and a **Sending key**. Give them to your tracker company, or put them in their data forwarding or webhook settings. **Copy it now**: for safety it isn't shown again. Lost it? Make a new one, but the old one stops working at once.\n4. **Check what they send** lets you paste a sample to see how it's read. Fields are matched by name and you can change any that are wrong, including the speed and odometer units.\n5. **Upload a file** takes an export from your tracker system (GPS points, or a stop report with arrived, left and where). Columns are matched by name and you can correct them before anything is saved.\n\nFetching happens every few minutes while TransportInsight is open on a login that can see Fleet.\n\n### Links & boxes\nThis tab lists each link (**Last heard**), a switch to turn it off (**Switched off**), and the **Tracker boxes**. A box is matched to a vehicle by registration or fleet number. If one isn't matched, choose its vehicle in **Vehicle for box…**. Once matched, its days are worked out. **How it's worked out** has **At a job's site within (miles)** and **Keep the raw GPS points (days)**. What the points show (stops, site visits, miles) is kept for good; only the raw points are cleared. **Work the last 60 days out again** redoes them after you add new places.\n\n### What the trackers saw\nPick a day. For each vehicle you see its miles, first and last move, every stop and the job it served. For each job you see **At collection (tracker)** and **At delivery (tracker)** beside the **Driver's taps**. If a driver tapped well after the tracker saw the arrival, it says so. Waiting time for demurrage uses the tracker's times where it saw that end.\n\n### Fuel & MPG\nThe **Fuel & MPG** tab lists each vehicle: miles and litres burned over 7 and 30 days, real MPG, **Costings use**, **Idling (7 days)** and **Last heard**. This is from the vehicle's own engine figures, so no fuel cards are needed. Until the first fetch it says **No engine figures yet**.\n\n## Good to know\n- The engine odometer is used for a day's miles when it agrees with the GPS.\n- Tracker boxes that aren't matched keep their points for 31 days, so matching later still works.\n- **Your tracker's days are never overwritten by driver taps.** They're shown side by side.\n\n## When something goes wrong\n- **Wrong login.** Nothing is saved and you're told. Check the username and password with your tracker company.\n- **A box isn't matched.** Type its registration in the vehicle box on **Links & boxes**.\n- **Nothing from the trackers on this day.** Pick another day, or check **Links & boxes**: a box that isn't sending shows as not heard.\n- **Not fetched:** the line names how many vehicles it couldn't find by registration.\n"}, {"id": "compliance", "n": 14, "title": "Compliance & VOR, the MOT planner, DVSA, operator licence, tachograph, working time", "md": "# 14. Compliance & VOR, the MOT planner, DVSA, operator licence, tachograph, working time\n\n## What it's for\n**Fleet > Compliance & VOR** is where you stay on top of dates and legal records: MOTs, inspections, tacho calibration, vehicles off the road (VOR), the MOT plan, the tachograph and drivers' working time. It warns you early and never leaves you guessing which vehicle is the problem.\n\n## Before you start\n- Enter MOT, inspection and tacho calibration dates on each vehicle (chapter 13). Vehicles with no date are counted under **Dates missing**.\n- How many days ahead things are flagged is set in **Settings**, under **Fleet & compliance**. The page says \"MOTs and inspections due within n days are flagged\".\n- Set up your operator licence under **Settings > Operator licence**.\n\n## The Compliance & VOR page\nTabs: **Needs attention**, **Off the road**, **Everything**, **MOT plan** and **Tachograph**. Search by registration. Summary figures at the top count what is past its date, due soon, off the road, and dates missing.\n\nEach row shows the registration, and its **MOT**, **Inspection** and **Tacho calibration** dates with days left. Click a date to change it in place (the toast says **Date saved**). Overdue ones come first. **Nothing needs attention - every MOT and inspection is in date.** appears when all is well.\n\nTrailers are in the list as well, marked as trailers.\n\n### Booking in\nFor a due MOT or inspection, press **Book in**. This opens the booking form (see chapter 18) so the day, the test centre or workshop, and the mechanics are set in one go, and the vehicle comes off the Planning board for those days.\n\n### Check with DVSA\n- **Check with DVSA** on a vehicle asks DVSA's record and shows **DVSA: MOT expires** next to your date, with a **Use DVSA's date** button if they differ. If the record looks like a different vehicle it says **Wrong vehicle?**.\n- **Check all MOT dates with DVSA** does every vehicle, and every trailer that has its DVSA trailer ID (C number) on file. It shows progress (**Checking with DVSA… 12 of 40**) and then lists every corrected date with the old one. If everything matches: **Every MOT date already matched.**\n\nOnly the MOT date is changed. Nothing else is overwritten.\n\n### Download for Excel\n**Download for Excel** makes one file with the MOT plan, test days, MOT and inspection dates, off the road list, defect reports, and drivers' walk-around checks. You pick the sheets and months.\n\n## Vehicles off the road (VOR)\n**Off the road** lists vehicles and trailers that can't work.\n1. To take one off, press **Take off the road…**, type the reason (for example \"brake fault\"), set **Since when** (blank means now), and confirm.\n2. To put it back, press **Back on the road**. The screen tells you if there are open defects on it. Confirm with **Yes, back on the road**.\n\nA vehicle off the road shows **Can't be planned** and the app won't let it be planned. Taking a vehicle off the road is also how a Red defect or a job card marked \"off the road until this is done\" shows up here. The history of each spell is kept.\n\n## The MOT planner\nOpen **Compliance & VOR > MOT plan**. It works out which vehicles and trailers should go for their MOT on which test day.\n\n### Set the rules\nPress **Change MOT planner rules…**:\n- **Days you test on**: more than one if you test back to back.\n- **Every n weeks**, **Starting the week of**: a week you test in, the others follow on from it.\n- **Bookings each test day**: how many your test centre takes from you on a day.\n- **Put a vehicle and its trailer on the same day when that works for both**, and **A vehicle and its trailer tested together count as one booking**.\n- **Most working days off the road to gain a month**: tested after it runs out, the next MOT is a month later, but the vehicle can't work in between. 0 means always test before it runs out.\n- **Usual test centre**.\n\n### Read the plan\nThe planner shows an agenda by month. Each test day has a row with how many are used against how many fit. Each vehicle or trailer is a chip:\n- dashed: the plan's choice\n- orange: you put it there\n- green with a tick: booked\n\nPick **Next n months** to look further ahead. A one-line summary says how many are on the plan, booked, and gaining a month.\n\nFor each chip the app says what the date will become, using the testing rules it applies:\n- Within two months before it runs out: **keeps its month**; the new MOT runs to the month end.\n- More than two months before: the new MOT only runs a year from the test month, so months are **lost**.\n- After it has run out: a year from the test month, so a month is **gained**, but it can't work in between (the planner counts the working days off the road).\n\n### Move things\n- Drag a chip to another day. Drag the grip on a pair to move both.\n- Drag to **let the plan pick** to put it back on automatic, or to **leave off** to take it off the plan.\n- Click a chip for the details: **Put it on this day**, **Let the plan pick the day**, tick **Booked with the test centre**, the test centre and a note (**Save test centre and note**), and **Trailer going in with it**. Changing a trailer's partner here is for the MOT plan only; the Trailer board stays as it is.\n- **Book it in…** makes the full booking: day, test centre, mechanics and off the Planning board.\n- **Set it not running on the Planning board that day** stops work being planned on it.\n- Click a day to **Change this test day**: change how many it takes, or tick **No testing this day**. **Add a test day** adds an extra one-off day.\n- **Start again…** has **Let the plan pick every day again (booked ones stay)**, **Every trailer back with its Trailer board vehicle** and **Every changed test day back to normal**.\n- **Tested? Check with DVSA** appears when a test date has passed, so you can confirm the new date.\n\nSuggestions to swap trailers (same expiry month) show with **Do this swap**. A vehicle with no day free is listed under **No room on a test day**, naming the days that are full.\n\nEverything is worked out fresh each time. Your decisions are kept: a day you set, a booking, and anything left off.\n\n## Operator licence\n**Settings > Operator licence** holds each licence: number, **Kind**, **Vehicles authorised**, **Trailers authorised**, **Traffic area**, **Continuation date** (the 5-yearly date; you're reminded 2 months before) and **Transport manager**. Add each operating centre with **Add an operating centre**, with what it's authorised for.\n\nOn Compliance a strip shows the licence, how many vehicles and trailers you have against what you're authorised for, and any vehicles with no operating centre. It also lists **Tell the Traffic Commissioner (VOL) - within a month of adding a vehicle**. Add the vehicle on the vehicle operator licensing (VOL) website, then press **Done - told them** on the row.\n\nA vehicle or trailer made active beyond the authorised numbers is refused (it can still be saved as not active). With vehicles needing a licence and none on file, you get a warning on Home and Compliance, never a block.\n\n## Tachograph\n**Compliance & VOR > Tachograph** has four parts: **Working time**, **Infringements**, **Downloads** and **Import reports**.\n\n### Downloads\nThe page reminds you: download each driver's card at least every 28 days and each vehicle unit at least every 90 days, and keep the files for at least a year.\n1. Press **Choose tachograph files** (.DDD, .C1B, .V1B, as many as you like).\n2. The app matches each file to the driver or vehicle from its name. Where it isn't clear, choose **Driver's card** or **Vehicle unit** and pick the driver or vehicle.\n3. Check the date downloaded, and save.\n\nThe lists show **Last download** and **Next due** for every driver card and vehicle unit. If your analysis company downloaded it for you, press **Mark as downloaded today**. Past downloads list under **Latest downloads** with **The file**.\n\n### Import reports\n**Import reports** takes your analysis company's reports: **Drivers' days** (date, driver, driving, other work, availability, breaks) and **Infringements** (date, driver, rule broken, severity). Past imports are listed under **Past tacho imports**.\n\n### Working time\n**Working time** is worked out from the tachograph only. Clocking in and out and holidays never count as the legal record. For each driver it shows **Average a week**, **Worst week**, **This week**, **Can still work this week** and **How it stands**. Click a driver for **Each week**, shown as bars with a line at 48 hours and a thicker one at 60, and **Days over a limit**.\n\nThe limits the app applies, from the Road Transport (Working Time) Regulations 2005, regs 4, 7 and 9:\n- 48 hours a week on average, over the reference period shown on the page.\n- 60 hours in any one week.\n- No more than 10 hours in any 24 with night work (midnight to 4am), unless a workforce agreement allows more.\n- No more than 6 hours' work without a break, and 30 minutes in all when the day's work is over 6 hours, 45 over 9, in breaks of at least 15 minutes.\n\nThe period is the law's own (from 1 December, 1 April, 1 August) unless your settings say you have a workforce agreement or written notice. Holiday, sickness and family leave from the Holiday calendar count in the average as the regulations set (8 hours for each day off). Break and night-work checks use each day's totals, so they show as possible breaches to check on the tacho record.\n\n### Infringements\nThe list shows each infringement with **Severity** and whether it's **Dealt with**. To deal with one:\n1. Pick the infringement (one driver at a time).\n2. Choose **Sign off - you first**. Write what was discussed and the action taken, and sign as the manager.\n3. Choose **Next - hand to the driver**. The driver types their full name and signs.\n4. Press **Driver signs - save the record**. Once saved it can't be changed. It can be printed from the list (**Signed record (PDF)**).\n\nIf you dealt with it another way, tick **Dealt with another way (e.g. a printout signed on paper and kept)**, note it, and press **Mark as dealt with**. Working-time breaches the app finds itself show as \"Worked out from the tacho days\".\n\n## Good to know\n- A vehicle off the road, or a driver whose licence, CPC or tacho card has run out, can't be planned at all. A missing date is only a warning on a run.\n- A warning appears but never blocks, except for these hard rules.\n- Dates changed here show on the Planning board straight away.\n\n## When something goes wrong\n- **Can't put it back on the road.** A Red defect that is still open keeps it off. Only the repair clears it (chapter 15).\n- **Wrong vehicle?** from DVSA: the registration may be mistyped. Fix it on the vehicle, then check again.\n- **A test date can't go on that day.** The planner names the days that are full or closed; pick another or change the test day.\n"}, {"id": "defects", "n": 15, "title": "Defects and the traffic lights", "md": "# 15. Defects and the traffic lights\n\n## What it's for\nEvery fault found on a walk-around check, reported by a driver, or found by a mechanic ends up on **Workshop > Defect reports**. Each has a traffic-light colour that says whether the vehicle can run. The page shows the worst first, so a Red never sits unseen.\n\n## The three colours\nThe colours are the same on every screen and on the phones:\n- **Red - don't drive it.** A dangerous fault. The vehicle comes off the road at once, can't be planned, and only the repair puts it back.\n- **Amber - can drive, fix soon.** A major fault.\n- **Green - cosmetic only.** An advisory.\n\nThe fault colour guide is based on DVSA's *Categorisation of Vehicle Defects*. Red is the \"I\" (immediate prohibition) faults, and Amber is the worst of the \"D\" (delayed prohibition) faults.\n\n## Before you start\n- Your walk-around checklist is edited in **Settings**. Changes apply to new checks only.\n- Checks are legal records: once sent they can't be changed.\n\n## The Defect reports page\nTabs: **Defects** and **Walk-around checks**. The defects are grouped: **Red - don't drive it**, **Amber - fix soon**, **Green - cosmetic**, **On a job card**, and **Dealt with / left for now**. A line says how many dangerous defects are not put right, the same count as the FORS page.\n\nFilter by words, registration or driver in **Registration, words or driver…**, by **Any severity**, by **Vehicles and trailers**, tick **Only ones off the road**, or **Show ones already sorted out**.\n\nPick a defect on the left. On the right you see what was reported, by whom and when, a photo if there is one, **Where it stands now**, and its **History**. Flags show **trailer**, **off the road** and **repeat?** (the same fault reported before).\n\n**Find any check or defect** searches everything ever recorded. **Download 90 days (for the DVSA)** makes one Excel file of every defect, every walk-around check and every run without one.\n\n## How to deal with a defect\nOpen the defect, then choose one of:\n1. **Raise a job card**. The card opens beside it with the vehicle, the defect and the first words as the title. A vehicle taken off the road for it goes back on the road when the card is done.\n2. **Leave for now**. It stays on the list as left for now. You need a note first.\n3. **No fault found**. You must say why in the note box first (who looked, what they found), then press **No fault found** again. For a defect the driver called Red or Amber that sounded worse, the box asks who looked and why it isn't a Red or an Amber.\n4. **Same as that one - close this**. If it is a repeat of an open defect, this closes the report as a repeat.\n\n## How to change a colour\n1. Open the defect and press **Change colour**.\n2. Pick the new colour (**Make it Red**, and so on).\n3. Type **why**. It is required and kept on the record for DVSA, for example \"looked at it - tread 3mm, cut is cosmetic\".\n4. Confirm. The colour moves up or down, and **the driver who reported it is told on their phone**.\n\nWhat the colour does:\n- **To Red** takes the vehicle off the road at once.\n- **Off Red** puts it back on the road, but only when this defect started that spell and no other Red is open on the vehicle.\n- A defect already dealt with keeps its colour.\n- The colour the driver first picked always stays on the record beside any change.\n\nThe driver is always told when a defect goes Red. Telling them about other changes is a setting in **Settings > Driver app**.\n\n## Amber on the road\nIf a vehicle is off the road because of an Amber fault, a workshop login clears it once from its job card with **Still roadworthy - can run until done**, typing the reason. The reason is kept on the card. The planner isn't asked for each run. This is refused while a Red defect is open on the vehicle.\n\n## The fault colour guide\nPress **Fault colour guide** to see DVSA's Red and Amber faults as your company keeps them. Each row has **Fault**, **Colour**, **Words the driver might use** and **DVSA says** (the condition). Press **+ Add a fault** to add your own with the words and a note **What to tell the driver (when it's this bad)**, or **Change** to edit. You can hide a fault with \"Stop asking\"; faults are never deleted.\n\n### How the question works\nWhen a driver or mechanic types a description, the phone compares the words with the guide. If the words sound **worse** than the colour they chose, it asks:\n\n**This sounds like it could be a Red: ...** with DVSA's condition, and two buttons: **Make it Red** or **No - keep it Amber**.\n\nIt never asks the other way: it won't suggest a less serious colour. The driver may also raise a colour on a walk-around check with **It's worse - make it Red**, never lower it.\n\nIf a driver kept their colour, the Defect reports page flags it as \"driver kept Amber\" and lists it next in line after the Reds. The report shows the guide's colour and the question's answer next to the driver's own colour.\n\nA defect that sounds worse than reported keeps a run warning on the vehicle while it's open, until the workshop sets its colour, repairs it, or marks it as no fault or a repeat. Sending the day's runs holds those runs out, and the screen lists them with a **Send anyway** button; each run's own **Send** asks you to confirm.\n\n## Walk-around checks tab\nPick a day, or **From** and **Just the one day**. Each check shows vehicle, driver, number of faults, and **All OK** or the faults, with every answer open. A check sent less than a minute after it was started is flagged **under 1 min**, as too quick for a real walk-around. Vehicles that worked that day with no check are listed so you can chase them.\n\n## Good to know\n- A Red defect is a hard stop: the vehicle can't be planned and the driver's steps are stopped on a run already sent. Only the repair clears it. Off-road shows on **Compliance & VOR**.\n- A defect can't be on two open job cards.\n- Missing legal dates on an imported vehicle are only a warning on a run.\n\n## When something goes wrong\n- **Say why first.** The note is required for **No fault found** and **Leave for now**, and the reason is required to change a colour.\n- **Won't go back on the road.** Another Red is still open on it, or a job card is still open. Check **Where it stands now** and the job card.\n- **A driver says a Red isn't showing.** If their phone had no signal the report is saved on it and sent later. The phone tells them to ring the office.\n"}, {"id": "fors", "n": 16, "title": "FORS", "md": "# 16. FORS\n\n## What it's for\nFORS is the Fleet Operator Recognition Scheme. **Fleet > FORS** helps you get and keep accreditation. It shows what an auditor would find, requirement by requirement, from what TransportInsight already records, and builds the evidence they ask for in one download.\n\nIt warns, it never blocks.\n\n## Before you start\n- Tell the page which level you're at: at the top, **Where you are with FORS:** has **Not in FORS**, **Working towards Bronze**, **Bronze**, **Silver** and **Gold**.\n- Set **Licences checked every** (months) and the declaration interval.\n- Keep using the rest of the app. The page is built from your walk-around checks, defects, MOTs, inspections, fuel, drivers' dates and your operator licence.\n\n## Tabs\n**Readiness**, **Drivers**, **Policies**, **Incidents** and **Fuel & CO2**.\n\n## Readiness\nEach requirement has a status:\n- **In order**\n- **Needs a look**\n- **Fix before the audit**\n- **Check yourself** (for things the app can't judge)\n\nCounts show at the top. Each line says what the app found and names the drivers or vehicles behind anything that isn't right. **Go there** takes you to where it is fixed. The requirements are:\n- Licence checked at least every n months\n- No driver on the road with a licence problem (9 or more points, wrong categories, or not valid)\n- Licence, CPC and tacho cards in date\n- Fit-to-drive and eyesight declaration every n months\n- Drivers have read and signed the policies\n- A walk-around check every day a vehicle works (the last 30 days: 95 per cent or more is in order, 80 to 95 needs a look, below that fix before the audit)\n- Defects reported, looked at and put right (a dangerous one not put right is red; ones over 2 weeks not looked at is amber)\n- MOTs and safety inspections in date, and every vehicle and trailer has its next inspection date\n- Incidents and collisions logged, looked into and closed\n- Fuel use and CO2 measured (Silver)\n- Operator licence up to date\n- Insurance and permits, and driver training records: shown as **Check yourself**, \"not tracked in TransportInsight yet\". Keep the paperwork ready.\n\nNothing recorded is never shown as in order. No licence checks on file reads as needs a look, not green.\n\n## Evidence pack\nPress **Evidence pack (zip)**. It saves the last 12 months as spreadsheets in one zip: readiness, driver licence checks, driver dates and status, declarations, policy sign-offs, walk-around checks, defects, MOT and inspection dates, workshop work done, incidents, fuel and CO2 by month, tyres, and a contents note. You're told **Evidence pack downloaded** or where it was saved.\n\n## How to record a driver's licence check\n1. Open the **Drivers** tab. It lists each driver with **Last licence check**, **Next due**, **Points**, **Consent**, **Declaration** and **Policies**.\n2. Press **Record…** on the driver.\n3. Under **Record a licence check**, enter the **DVLA check code** (from the driver, and it lasts 21 days) or tick **Seen in person**. Enter **Penalty points**, **Endorsements (codes)** and **Licence valid until**. Tick **Licence valid (not disqualified or revoked)** and **Holds the categories their work needs**.\n4. Press **Save the check**. The toast says **Licence check recorded**.\n\nA driver who gives consent for checks is recorded under **Consent and declaration**: tick **Consent to checks signed today** (the toast says **Consent recorded (3 years)**). For a paper fit-to-drive declaration tick **Fit-to-drive declaration (paper) today**. Drivers can also make the declaration and sign policies on their own phone: \"Your yearly declaration\", with **I'm fit to drive - nothing (illness, medicine) affects my driving** and **My eyesight meets the standard for driving (with glasses if I need them)**, then **Sign my declaration**.\n\nThe drawer's **History** lists every past check, consent and declaration.\n\n## How to add a policy\n1. Open **Policies** and press **Add a policy**.\n2. Type the title and paste the text. Drivers read it on their phone.\n3. Save. Each policy shows its version and how many have signed. **Who's signed** lists each driver and says **Everyone has signed.** when they have.\n\nTo change a policy, press **Edit**. A small edit keeps the version. Tick the box for a real change and it becomes a new version, and everyone signs again.\n\nOn the phone, a driver sees the policy under **To sign** and taps **I've read and understood it**.\n\n## How to log an incident\nOpen **Incidents** and press **Log an incident**. Fill in what happened, when, the vehicle and driver, whether a cyclist, pedestrian, motorcyclist or horse rider was involved, whether anyone was hurt, and whether another vehicle, person or property was involved. Press **Log it**.\n\nDrivers can report them from their phone too, with photos. The list shows each one with vehicle, driver, status and flags. Open an incident to record **What caused it**, **What's been done so it doesn't happen again**, and the **Insurer reference** and **Police reference**, then **Save and close it**. **Open again** reopens it. Anything still open shows on Readiness.\n\n## Fuel & CO2\nThe **Fuel & CO2** tab shows CO2 for the last 12 months: **Month**, **Fuel (litres)**, **CO2 (kg)**, **Miles** and **g a mile**, then **By vehicle - last 12 months**. It is worked out from the fuel you've recorded using the UK Government GHG conversion factors (DESNZ, 2025), kg CO2e per litre. Miles are the distance actually driven: the tracker's or odometer's, and where a vehicle has neither, its job miles are used and marked **(rough)**. Recent fuel needs to be recorded (import your fuel card, or drivers log it on their phones); with none in the last 6 weeks the page says so.\n\n## Good to know\n- Everything on the page comes from records made elsewhere in the app. If a number looks wrong, fix it at its source (**Go there**).\n- The walk-around and defect rows link to the same count shown on **Defect reports**.\n- Insurance and driver training are not recorded in the app yet.\n\n## When something goes wrong\n- **A requirement stays amber with no names.** Open the line's **Go there** link; the missing item is usually a date not entered.\n- **No policies added yet.** Add your driver handbook and policies, or the policy line stays red.\n- **A licence check won't save.** Enter the check code or tick **Seen in person**, and the licence-valid date.\n"}, {"id": "job-cards", "n": 17, "title": "Job cards, clocking, parts and outside firms", "md": "# 17. Job cards, clocking, parts and outside firms\n\n## What it's for\n\nA job card is the record of one piece of workshop work: a brake fault on DE24 MOH, a service, a tyre change, a breakdown. It holds who is doing it, the time they clock, the parts used, where it is being done and what it all cost. The same card is used whether your own mechanics do the work or an outside garage, tyre firm or breakdown firm does it, so you only ever look in one place.\n\nThis chapter also covers the mechanics themselves, parts on a card, outside firms, and the loads a vehicle's time off the road can hit.\n\n## Before you start\n\n- Add your mechanics on **Workshop > Mechanics** (below). A card can be raised without one, but nobody can clock on to it.\n- If you use outside firms, you add them as you go (see \"Giving a job to an outside firm\"). You do not need a list first.\n- Set what you charge outside customers on the **Workshop rates** tab (below). Work on your own vehicles is not billed; its cost is the mechanics' pay and the parts.\n- If your company has no workshop of its own, go to **Job cards > Set-up** and choose **We use outside firms only**. The menu then shows **Repairs** instead of **Job cards**, and Mechanics, the Workshop board and workshop invoicing are hidden. Nothing is lost if you switch back.\n\n## The Job cards screen\n\nOpen **Workshop > Job cards**. Across the top are the tabs **Open**, **Done**, **Invoices**, **Parts list** and **Workshop rates**. A search box finds a registration, job or customer. The summary beside it shows how many are open, how many mechanics are clocked in now and how many were done this week. If drivers have reported faults nobody has dealt with yet, a **defects to sort out** note links you to **Defect reports**.\n\nOn **Open**, the cards sit in columns by where they are at:\n\n- **New** (nobody has started or been given it)\n- **Waiting to start** (a mechanic has been named)\n- **In progress**\n- **Waiting for parts**\n\nDrag a card to another column to move it on, or click it to open it. A card for a vehicle that is off the road says so. A card with a part that has no price says **Part needs a price**. A card whose parts have all arrived says **Parts in - ready to start again**.\n\n**Done** lists finished and cancelled cards with who did them, the real cost and whether they have been invoiced.\n\n## How to raise a job card\n\n1. Press **New job card** (top right).\n2. Choose **Our vehicle**, **Our trailer** or **Outside customer**, then pick the vehicle or trailer. For an outside customer, pick the customer, then their vehicle, or choose **+ A vehicle not on here yet** and type its registration and what it is (for example DAF CF tipper).\n3. Under **What's the job**, type what needs doing (for example Brake fault NSR) and choose the **Kind of work**: Repair, Breakdown, Tyres, Inspection, Service, MOT prep or Other. Add **Details** if you want.\n4. If the vehicle already has open defects, they are listed under **Defects it fixes**. Tick the ones this job will put right. If there is already an open card for the vehicle, a box tells you so, with a button to add the defect to that card instead of making a second one.\n5. Under **Who's doing it** choose **Our mechanics** or **An outside firm**. With our own mechanics you can pick the **Mechanic**; a card with a mechanic starts as **Waiting to start**.\n6. Tick **Off the road until this is done** if the vehicle must not run meanwhile.\n7. Tick **Done at the roadside / on site (not at their garage)** if the work is out on site, and give the **Site postcode** and **Site / address**.\n8. Press **Raise job card**. If something is missing, the button says what, for example \"Pick the vehicle or trailer first\".\n\nYou can also raise a card straight from a fault: on **Workshop > Defect reports**, press **Raise a job card**. Or from a booking (chapter 18).\n\n## Working a card\n\nClick a card to open it. The top shows the card number and title, the plate, the kind of work and who raised it and when.\n\nThe row of buttons under the title - **New**, **Waiting to start**, **In progress**, **Waiting for parts**, **Done** - is where it is at. Press one to move it. **Cancel the job** is beside them. Once a card is on an invoice it cannot be changed.\n\nUnder that are sections:\n\n- **The job**: what, kind of work, mechanic and details. Typing saves when you click away.\n- **Defects it fixes**: the faults this card puts right. **Take off this card** sends a defect back to **Defect reports**. **Add to this card** puts another on.\n- **Inspection / checklist**: shown when the card came from a booking with a checklist, with each item, who signed it off and the mileage.\n- **Parts**, **Tyres**, **Photos** (**Add a photo**).\n- **Who's doing it**, **Who's on it** (the time), **Where**, **Money**, **History**.\n\n### Off the road\n\nIf the card keeps the vehicle off the road, a box says **Off the road** and **Back on the road when this is done**. If someone put it off the road by hand, it says so and stays off until someone puts it back (**Put it back on the road now?** then **Yes, put it back on the road**). On a card with no Red fault, **Take it off the road until this is done** is the other way round.\n\nIf the vehicle has a Red fault on the card you will see **Red fault on this card - it stays off the road until the repair is done.** For an Amber fault, **Still roadworthy - can run until done** lets a workshop login clear it to run. It asks for a reason (for example \"it's safe to run\"), which is kept on the card, then **Clear it to run**.\n\n### Marking it done\n\nPress **Done**. If nothing has been recorded - no time, no parts, no firm - the card says **Nothing is recorded on this card yet** and asks you to write what was done before **Mark it done**. If the card fixes more than one defect, or a Red one, you are asked first and shown the list, with the reminder to use **Take off this card** for any that has not been dealt with.\n\n## Clocking time\n\nMechanics clock on from their phones (chapter 12), and you can do it for them in the **Who's on it** section.\n\n1. Pick the mechanic under **Mechanic to clock in**. A mechanic already on another card shows as \"(on JC-0003)\" and cannot be picked.\n2. Press **Clock in**. For a job out on site it says **Clock in (sets off)**: the time starts as travel until you press **Arrived on site**.\n3. When they stop, press **Clock out**. The card then asks **Clocked out - where's it at now?** with **Waiting for parts**, **Still in progress** or **Done**.\n4. If someone forgot to clock out and it is more than 12 hours on, the button reads **Clock out - when did they finish?** and asks for the real time.\n\nTo add time they forgot, press **Add time they forgot to clock**, choose the mechanic, **Work** or **Travel**, the times and a note, then **Add the time**. The time cannot overlap another job of theirs; the message names the clash. To remove a line press **Take off** and give a reason.\n\n## Parts on a card\n\nIn **Parts**, start typing a part's name, number or what it is called. Pick it from the list, set the quantity and the **Price each (£)**, then press **Add part**. A part not on your list becomes one the first time it is used.\n\n- No price yet? Leave it blank. It shows **needs a price** until someone sets it. A part is never treated as free.\n- Press **Set price** on the line, and the price is kept on the parts list for next time.\n- **Take off** removes a line and asks for a reason.\n\nChapter 18 covers the **Parts & stock** page.\n\n## Where and Money\n\n**Where** says **In the workshop** or **Out on site**. For site work, give the postcode and address. If your yard has a postcode, the card shows how far out it is. Press **Save**.\n\n**Money** shows the **Real cost**: the mechanics' time at their pay rates plus the parts at cost. If a mechanic has no pay rate it says **no pay rate** and the time is not counted until a rate is set on **Mechanics**. Pay rates are only shown to people with Pay access.\n\nFor an outside customer's vehicle it also shows **To bill [customer] (before VAT)**: labour and travel at the rates for that customer, and parts plus the markup. Press **Different rates for this job** to change **Labour £/h**, **Travel £/h** and **Parts markup %** for this card alone, then **Save rates for this job**. Once the card is done the rates are fixed; reopen the card to change them.\n\n## Mechanics\n\nOpen **Workshop > Mechanics**. It lists who works in the workshop, what an hour of their time costs and what they are on now.\n\n1. Press **Add mechanic**.\n2. If the person is already a driver or office login, pick them under **Already on here?** so they are one person, not two. Otherwise leave **no, someone new**.\n3. Fill in name, phone, email, **Pay (£ per hour)** and notes. Press **Add mechanic**.\n\nTo change pay, open the mechanic and use **£ per hour** with a date: **Save new rate**. Older work keeps the old rate. To give them the phone app, press **Give app access**, make a code and send it (**Copy code** or **Copy a ready-made text**). The code is only shown once.\n\n## Giving a job to an outside firm\n\nSmall firms with no workshop use garages, tyre firms and breakdown firms. The card works the same way.\n\n1. On a new card, choose **An outside firm** under **Who's doing it**. Or open an existing card and press **An outside firm is doing it…**.\n2. Pick the firm, or choose **+ A firm not on here yet** and type its name.\n3. The status words change to **Not rung yet**, **Booked with the firm** and **Firm on it**. Booking with a firm fills in the time you rang them; you can change it.\n4. Fill in **Rung them** and **They turned up** (**At the roadside / on site** or **Or the vehicle got to them**). The card works out how long they took to turn up and how long the vehicle was off the road.\n5. Type **Their price (£, before VAT)** and **Their invoice number**, or import their bill in Actual costs and match it on the card under **Their bills on this job**. A matched bill is used instead of the typed price.\n\nIf your own mechanics end up doing it, press **Our own mechanics are doing it after all**.\n\n### Outside firms\n\n**Workshop > Outside firms** shows, for the last 3, 6, 12 months or 2 years, how many jobs each firm did, what you spent, how quickly they turned up, how long vehicles were off the road and how many loads were hit. Prices, turn-up times and time off the road are compared like for like (the same kind of work) once a firm and your others have each done at least 3. The app then says things like a firm being dearer or slower than your others, with **What to do**. **Their jobs** lists each job and opens the card.\n\n## Loads it hit\n\nWhen a vehicle is off the road with loads already planned on it, those loads have to go elsewhere. On a card for a vehicle, **Loads it hit** lists them and what happened to each: **Still on it**, **Moved to** another vehicle or day, **Given to** a subcontractor, **Cancelled** or **Back in Unplanned**.\n\nWhen you cancel or give out a load that was on an off-road vehicle, the app asks: \"DE24 MOH is off the road. Is that why this load is being cancelled?\" Answer **Yes - because of that** or **No - something else** (or **Back**). A yes counts the lost revenue, or the extra cost of giving the load out, against the breakdown. If it was not asked at the time, **Because of this?** with **Yes** and **No** appears beside the load on the card.\n\n## Good to know\n\n- **A mechanic can only be on one card at a time.** The message names the card they are on.\n- **A card that keeps a vehicle off the road cannot go Done with nothing on it.** That is why it asks what was done. The reason is kept on the card.\n- **A Red fault keeps the vehicle off the road** until the repair is done. A workshop login can clear an Amber one.\n- **Time put in afterwards cannot overlap** other time for the same mechanic.\n- **Once a card is on an invoice** it is locked.\n\n## When something goes wrong\n\n- **\"Nothing is recorded on this card yet.\"** Add time or parts, or write what was done, then press **Mark it done**.\n- **\"No pay rate\" on the Money box.** Open **Mechanics**, open the mechanic and save a rate. Without Pay access, ask whoever does the wages.\n- **A part shows \"needs a price\".** Type the price on the line and press **Set price**, or use the **To price** tab on **Parts & stock**.\n- **A mechanic is greyed out when clocking in.** They are clocked on to another card. Clock them out there first.\n- **\"Give your yard a postcode on Places\"** appears under **Where**. Add the yard's postcode so the distance can be worked out.\n"}, {"id": "workshop-bookings-and-stock", "n": 18, "title": "Bookings, the Workshop board, Parts & stock, purchase orders and workshop invoicing", "md": "# 18. Bookings, the Workshop board, Parts & stock, purchase orders and workshop invoicing\n\n## What it's for\n\nThis chapter is the planning and paperwork side of the workshop. **Bookings** puts a vehicle into the diary for an MOT, service, inspection or repair, and takes it off the Planning board for those days by itself. The **Workshop board** shows each mechanic's day. **Parts & stock** keeps every part, its price and what is on the shelf. **Purchase orders** tracks what you have ordered from suppliers. **Workshop invoicing** bills outside customers for workshop work, kept completely apart from haulage invoices.\n\n## Before you start\n\n- Mechanics should be added on **Workshop > Mechanics** (chapter 17).\n- For booking a vehicle to a test centre or outside firm, add the firm on a job card or the **Outside firms** page first.\n- Parts and suppliers need nothing set up in advance: a part joins the list the first time it is used.\n\n## Bookings\n\nOpen **Workshop > Bookings**. It shows a week at a time, a row for each vehicle or trailer booked in. A booking takes the vehicle off the Planning board for those days.\n\nAt the top: **Previous week**, a date box, **Next week** and **This week**; a **Mechanic** filter (**Every mechanic**); a search box (**Search registration, work…**); and **Show cancelled**.\n\nAbove the week is a box headed **Due in the next 30 days, not booked in**. Each chip shows a plate and \"MOT due 14 Dec\" or \"Inspection ran out\". Press a chip to start a booking for that vehicle. **All 12** shows the lot.\n\n### How to book a vehicle in\n\n1. Press **Book in** (on this page, on **Job cards** or on the **Workshop board**).\n2. Under **What's it for**, choose **MOT**, **MOT prep**, **Service**, **Inspection**, **Repair**, **Tyres** or **Other**.\n3. Pick the vehicle or trailer. If its MOT or inspection date is near, the box shows it (\"MOT due 14 Dec\", or \"ran out\").\n4. For a repair, tyres or other work, say **What needs doing** (for example Two new drive tyres).\n5. Give the first day and, if it runs longer, the last. Tick **Same day** if it is one
