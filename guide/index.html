omething goes wrong\n\n- **A row is refused.** The check lists its row number, what it is and the reason. Fix the file and check again.\n- **\"Stopped - what was saved stays; import the file again to carry on.\"** You pressed **Stop**. Import the same file again: lines already saved are skipped.\n- **Real MPG says \"no fuel imported\" or \"no jobs run\".** One half of the sum is missing: import the fuel, or check the vehicle has jobs in the period.\n- **A vehicle is marked check details.** It was added from a file. Open it on **Fleet > Vehicles & trailers** and fill it in.\n- **The report is blank for a period.** Look at the badges under the dates. A **not imported for this period** badge shows what is missing.\n"}, {"id": "insights", "n": 26, "title": "Insights", "md": "# 26. Insights\n\n## What it's for\n\n**Insights** finds where your work makes money and where it loses it, says why, and says what to do about it. It reads the last six months of finished jobs, what they really cost, the tracker data, the invoices and the workshop, and compares each customer, lane, driver and vehicle with like-for-like work. Each finding comes with the pounds attached and how sure the app is. It is built so you do not need to be a data analyst: the findings are written in plain English, and the numbers behind them are there if you want them.\n\n## Before you start\n\n- You need the **Insights** section on your login (chapter 4).\n- It works with what you have. Jobs with their rates are enough to begin with. It gets sharper as you add real costs (**Actual costs**, chapter 25), a tracker, invoices with payments, and workshop job cards. A check that cannot look yet says what it needs.\n- Under **Settings > Company**, tick the kinds of work you do (**What kind of work do you do?**). Insights then shows the checks that suit your work first. It never hides anything.\n\n## The screen\n\nOpen **Insights > Insights**. The tabs across the top are **Findings**, **Map**, **Fleet costs**, **Parts & stock**, **Compare weeks**, **What if** and **Explore**. It opens on **Findings**.\n\n## Findings\n\nThe first time, the page says **Insights hasn't looked at your work yet**. Press **Work it out now**. It takes about half a minute and shows **Working it out…**. After that it keeps the last result. If the result is from before today, it works it out again by itself.\n\nThe strip at the top shows how many jobs it read, the dates, and when it was worked out. It judges **finished days only**: today's work counts from tomorrow. **Work it out again** refreshes it. It can be redone every half hour, or straight away when new work comes in. Until then the button says **Again from** a time.\n\n### Reading the figures\n\n- **Findings**: how many, and how many have strong evidence, plus the biggest one in pounds a quarter.\n- **Real margin**: your real profit margin, set against what your job costings said. This only shows when at least half the costs on the jobs are real ones. Otherwise it reads **Margin (costed)** and tells you to import actual costs for the real one.\n- **Empty running**: the share of miles driven without a load.\n- **Worked out from**: how much of the costs were actual, and how much of the work the tracker saw.\n\nYellow boxes at the top are notices about your data, for example jobs that look like day hire but are not marked, or costs that are all estimates. A **See them** button lists the jobs.\n\n### Basic and Advanced\n\nThe **Basic | Advanced** switch changes how much you see. Your choice is remembered on this computer.\n\n- **Basic** shows up to eight of the strongest findings, each with its first reason and **What to do**.\n- **Advanced** shows all of them, including the **Worth watching** ones, with the evidence under each, plus **Single records to check** and an **All checks** view.\n\nIf there are more than Basic shows, a button says how many more are in Advanced.\n\n### For you, Everything and All checks\n\n- **For you** shows the findings that suit the kinds of work you ticked in Settings.\n- **Everything** shows all of them.\n- **All checks** (in Advanced) lists every check Insights runs, with whether it found something, found nothing, or could not look yet.\n\nIf you have not ticked any kind of work, a note links to **Settings** to set it.\n\nUnder the tabs, buttons filter by subject: **All**, **Money**, **Customers**, **Lanes**, **Drivers**, **Fleet**, **Cash**, **Time on site** and **Day hire**, each with a count.\n\n### One finding\n\nEach finding is a card with a label (**Strong evidence**, **Likely** or **Worth watching**), who or what it is about, a headline, a reason in a line, **What to do**, and on the right the money it is worth, such as **£1,200 a quarter**. **good news** shows instead where a finding is in your favour. Click a card to open it.\n\nThe finding page shows:\n\n- **Why**: a set of bars showing what is behind it, one reason per line with the pounds each reason is worth. **Together it cost you** adds them up for the whole period, and says what that is a quarter.\n- **How sure we are**: the evidence in a sentence or two.\n- **What to do**: the suggested action.\n- **The records behind it**: the jobs, fuel lines, bills or days it is based on. Click a heading to sort. Click a job to open it.\n- **The numbers behind it**: for anyone who wants the detail.\n\n**← All findings** goes back.\n\n### What was checked\n\nAt the foot of the page, **What was checked** lists everything it looked at, because looking and finding nothing counts too. If there is not enough finished work to compare (fewer than twenty jobs), the page says **Not enough finished work to compare yet**. Insights compares your work with itself, so it needs a few weeks of jobs.\n\n## What each check looks at\n\nEvery check is listed under **All checks** with its question and what data it needs. Here they are in plain words.\n\n**Money and prices**\n\n- **Profit a mile by customer, lane and driver**: who makes less than like-for-like work, and is it the rate, empty running, waiting or costs.\n- **Lane prices**: lanes priced below what your other work of that distance pays, and what to quote.\n- **Rates that haven't kept up**: a customer whose rate a mile has stood still while your cost a mile rose.\n- **The business as a whole**: is the work paying overall, and what a vehicle-day costs against what it brings in.\n- **Where the profit comes from**: the few customers that carry your profit, and any that lose money outright.\n- **Short jobs and a minimum charge**: whether short jobs earn less an hour, and what minimum would fix it.\n- **Day hire**: hires with no rate, customers' day rates against each other, and whether a hire day pays better than a haulage day.\n- **Subcontract or own vehicle**: on lanes done both ways, which is cheaper.\n- **Cancelled loads**: customers who cancel much more than the rest.\n- **Work drying up**: customers whose work has dropped beyond how all your work changed.\n\n**Customers and cash**\n\n- **Paying on time**: who pays late as a habit, and how much of your money that ties up.\n- **Invoicing speed**: how long after the work you invoice each customer.\n\n**Time**\n\n- **Waiting at sites**: where vehicles wait longest, from the tracker, not the driver's taps.\n- **Waiting you didn't charge for**: customers who kept vehicles waiting well beyond the quote with no waiting charge.\n- **Driver time**: whose days run longer than the work needs, on the road or stood still.\n- **Vehicles standing idle**: vehicles idle on weekdays, and the fixed cost earning nothing.\n- **Busy days and quiet days**: whether you subcontract on some days while vehicles stand idle on others.\n- **Backload chances**: where vehicles finish and drive home empty, and what you already collect near there.\n\n**Fuel**\n\n- **Fuel economy, vehicle against vehicle**: which vehicles burn more than others of their kind, and whether it is the vehicle or the drivers.\n- **The MPG in your costings**: whether your quotes use the MPG each vehicle really does.\n- **Idling**: vehicles standing with the engine running, and what it costs.\n- **Fuel bought dear**: fuel suppliers or sites that charge more a litre than elsewhere the same week.\n\n**Workshop and parts**\n\n- **Repairs and tyres a mile**: vehicles that cost more than others of their type.\n- **Repairs that didn't hold**: vehicles back in the workshop within 30 days for the same thing.\n- **Parts spend jumping**: a kind of part that cost far more this month than usual.\n- **Part prices creeping up**: a supplier charging more than they used to.\n- **Parts a mile, vehicle by vehicle**: vehicles going through parts far faster than similar ones.\n- **Which tyre to try**: whether one tyre brand lasts longer than another.\n- **Parts fitted again too soon**: a part going back on a vehicle far sooner than it should.\n- **Stock minimums**: stocked parts that keep running out, or tie up money they never need.\n\n**Single records**\n\n- **Single records that don't fit**: a fuel line, rate, bill, reading or payment far out of line with the rest. Usually a typing slip.\n\nA check that shows **Can't look yet** says what it needs, for example \"A tracker (Fleet > Trackers) and jobs on runs on the Planning board\", or \"Fuel bought and miles run\".\n\n## The other tabs\n\n- **Map**: where your work makes and loses money, where vehicles wait, and where they drive home empty from.\n- **Fleet costs**: what each vehicle is costing you (fuel, AdBlue, maintenance, tyres) and its real MPG against the rest of the fleet.\n- **Parts & stock**: the parts picture across the workshop.\n- **Compare weeks**: one week against another, or against your typical week: what changed, why, and what to do.\n- **What if**: move the levers and see what happens to the money, on your own last six months' figures.\n\n## Explore\n\n**Explore** is the numbers, filtered however you like. It starts with **Advice**: findings across the whole fleet from the newest work on file, with buttons for each subject. It is not changed by the filters below it.\n\nUnder **Your numbers**, choose **30 days**, **90 days** or **12 months**, or pick **From** and **to** dates, and narrow by **Vehicle**, **Customer**, **Driver** or **Fleet group**. You get **Jobs**, **Revenue**, **Profit (as costed)**, **Route Success Score** and **Weak backload**, a **Weekly | Monthly** chart of revenue, cost and profit (with **Show as a table**), leaders for vehicles, customers and drivers, vehicles and drivers against the fleet's own average, **If diesel goes up** (the extra cost on these jobs of a few pence more a litre), and **Backload**.\n\n**Questions about this data** is a list of reports that follow your filters. Click one to open it. **Jobs worth a look** lists individual jobs that stand out.\n\nNote that **Explore** uses each job's costing estimate, the same sums as Route Builder. **Findings** and **Compare weeks** use real costs where you have them. So their profit and margin can differ, usually lower in Findings.\n\n## Good to know\n\n- **Every finding says how sure it is.** **Worth watching** is a hint, not a fact.\n- **Like for like.** Vehicles are compared with vehicles of the same type, and lanes with lanes of the same length, so the findings are not fooled by a long job looking cheaper per mile.\n- **Nothing is changed.** Insights only reads. Acting on a finding is up to you, on the screen it points you to.\n- **Real costs make it exact.** Without fuel and payroll imports, profit is the costed estimate.\n- **Day hire comes only from the tag.** Insights treats work as day hire only when jobs are priced **Day hire** (chapter 5). It does not guess.\n- **Only finished days.** Today is judged tomorrow.\n\n## When something goes wrong\n\n- **\"Not enough finished work to compare yet.\"** Fewer than twenty finished jobs. Come back in a few weeks, or import history (chapter 3).\n- **\"Nothing stands out.\"** Everything checked is in line with the rest of your work. **What was checked** shows what it looked at.\n- **A check says \"Can't look yet\".** Read the **Needs:** line under it and add that data.\n- **The Work it out again button says \"Again from 14:30\".** Nothing new has come in since the last run. It becomes available at that time, or at once when new work arrives.\n- **A report says \"couldn't work out\".** On **Explore**, a report that fails says so on its own row. The others still show.\n"}, {"id": "looking-after-it", "n": 27, "title": "Settings, Bulk changes, Activity log, your data and Help & support", "md": "# 27. Settings, Bulk changes, Activity log, your data and Help & support\n\n## What it's for\n\nThis chapter covers the parts of TransportInsight that look after the system itself. **Settings** is where every company-wide choice lives. **Bulk changes** changes many records at once, with undo. The **Activity log** is the record of who signed in and who changed what. Then there is how to get your data out, and how to get help.\n\n## Before you start\n\n- **Settings**, **Bulk changes** and the **Activity log** are for company admins only. If you are not an admin, you see **Only a company admin can change Settings and Team & logins.** Ask an admin. (Chapter 4 covers admins and the sections each login sees.)\n- **Help & support** is open to everyone.\n\n## Settings\n\nOpen **Data > Settings**. Every setting is on one page, in tabs: **Company**, **Planning**, **Fleet & compliance**, **Operator licence**, **Workshop**, **Drivers & phone app**, **Money**, **Security** and **Personal data**. Changes apply straight away, for everyone. Each tab saves its own settings. On the tabs with number boxes, press **Save** at the bottom.\n\n### Company\n\n- **How big is your firm?** Choose a size. **Just me** gives a simpler menu with no team, recruitment, holiday or bulk-change screens. Nothing is removed. Pick another size and it all comes back.\n- **What kind of work do you do?** Tick as many as fit. Insights shows the checks that suit your work first (chapter 26). Some kinds switch on extra features: for example one-man bands can be their own driver, and international work adds consignment notes. Press **Save**.\n- **Invoices**: your company details, numbering and how they look (chapter 23).\n\n### Planning\n\n- **Warn when a driver's day is over** (hours), and **Highlight jobs starting within** (miles of where the run finishes). The highlight distance is what the Planning board's pink \"perfect fit\" uses (chapter 7).\n- **Planners can see drivers' infringements and sign-offs**. When off, only Fleet and HR logins see them. Planners still cannot sign anything off.\n- **Day hire**: **We do day hire (a vehicle and driver for the day at a day rate)**. Switch it off if you do not do day hire. \"Day hire\" is then taken out of the charge types and customers' day rates are hidden. Jobs already on day hire stay as they are.\n- **Something's gone wrong**: a table of what the board's **Something's gone wrong** button offers. For each, tick **Offer it**, choose a suggested charge (a percentage or a fixed £) and whether to charge extra time. The planner can still change the figure on the day. Press **Save these**.\n- **Run patterns**: add or rename patterns. Tick **Back to the yard at night** for ones that return to the yard. A pattern that does not return (tramping) leaves the run's end empty, and the next day starts from the last drop.\n\n### Fleet & compliance\n\n- **Compliance**: **Warn about MOTs and inspections due within** (days), **Optimise Day keeps a vehicle free for** (days before its MOT), and **Suggest a service centre within** (miles of a run).\n- **Loads waiting in a trailer**: **Amber after** and **Red after** (days).\n- **MOT plan settings** (chapter 14), **Vehicle roles** (with **Pulls a trailer**), **Trailer types**, **Capabilities**, **Fleet groups** and **Tracker** settings.\n\n**Capabilities** are what a vehicle, trailer or driver can do (for example ADR or a tail-lift). Tick them on each record, and on jobs that need them. The Planning board warns when a run lacks something its job needs.\n\n**Fleet groups** are kinds of grouping, such as General or Day hire. A vehicle is in one group of each kind. The kind ticked **Planning board sections** splits the board into tabs.\n\n### Operator licence\n\nYour operator licence details (chapter 14), and **Tachograph and working time**:\n\n- **Download each driver's card at least every** (days, the law says 28 at most) and **Download each vehicle unit at least every** (days, the law says 90 at most).\n- **Which reference period applies to your drivers?** Three choices: **Rolling 17 weeks** (only if you have told your drivers in writing), **Fixed periods from our agreement** (a collective or workforce agreement), or **Neither** (the law's own periods apply, regulation 4(3)(c) of the Working Time Regulations). The screen says that if you are not sure, it is the third.\n- **Night work limit**, and **Average working time over** (weeks).\n\n### Workshop\n\n**Workshop jobs made for you** (**MOT prep** days and **Inspections** made weeks ahead, 0 means off), **Workshop rates - for outside work**, and the **bookings checklist** (chapter 18).\n\n### Drivers & phone app\n\n- **Loading photos asked for** and **Delivery photos asked for** (per job). A driver is nudged on the phone, never blocked. The photos count in **Catch up** and invoicing.\n- **Ask for the delivery ticket number on \"Delivered\"**. Drivers can still deliver without one.\n- **Tell the driver on their phone when the workshop changes the colour of a defect they reported**. A change to Red is always told.\n- **Photos stored** shows how much of the free 1 GB you have used.\n- **Walk-around checklist**: the items drivers check on their phone, for **The vehicle** and **The trailer**. For each tick-or-fault item you choose what a fault means: **Green - cosmetic only**, **Amber - can drive, fix soon** or **Red - don't drive it (off the road)**. Add new items with the box at the foot. Changes apply to checks from now on; checks already sent keep what the list said then.\n- Holiday settings (chapter 21).\n\n### Money\n\n**Extra charge types**. Demurrage stays, because it is worked out from waiting time when you press **Add demurrage** on a job. Fuel prices, distance bands and margin targets are on **Costs & rates**, and surcharges are set per customer.\n\n### Security\n\n- **Two-step sign-in**: make it compulsory for **Nobody - each person's choice**, **Company admins** or **Every office login**. Each person sets up their code under **Your login & security** at the bottom of the menu. It applies from each person's next click. Phone app logins are not affected.\n- **TransportInsight support**: **Let TransportInsight support look at our company when helping us**. They can only look, not change, unless you press **Allow** for 1, 4, 8, 24 or 72 hours. **Stop now** ends it early. **Recent support visits** lists who looked, when and why.\n- A note pointing to **Team & logins** and the **Activity log**.\n\n### Personal data\n\nHow long personal data is kept, a list of **People who have left** with **Anonymise now**, and **What we hold about someone** (see \"Getting your data out\" below). Chapter 20 covers leavers.\n\n### Settings lists: \"In use\"\n\nItems in lists (vehicle roles, capabilities, charge types and so on) are never deleted, because records use them. Untick **In use** to hide an item everywhere it would be offered. Press **Add** after typing a new item.\n\n## Bulk changes\n\n**Bulk changes** is for company admins only. Open **Operations > Bulk changes**. The tabs are **Jobs**, **Looks like day hire?**, **Drivers**, **Vehicles**, **Trailers** and **Customers**. (**Looks like day hire?** is hidden if you have turned day hire off.)\n\n### Changing jobs\n\n1. Choose the dates (**Last week**, **This week**, **Next week**, or **From** and **to**), a **Customer**, a search (account code, site, postcode, order ref, job number, vehicle) and **Planned or not**, **Not planned yet** or **On a run**.\n2. Tick the jobs. The box at the top ticks every job shown. A padlock means the job is on an issued invoice: credit it first.\n3. In the panel **Change n ticked jobs**, fill in only what you want to change:\n   - **Loading site** and **Tipping site**: type to pick a saved site, or type a new name, address and postcode. Tick **Change the route too (postcode and miles) - not for day hire** if the place itself has moved.\n   - **Add needs** and **Take needs off**.\n   - **Order ref**. Blank means leave it.\n   - **Rate**: choose how they are priced and the amount. **Day hire** lets you pick **Full day** or **Half day**, a price, and how it shows on the invoice. Leave the price blank to keep the money on each job. **Free of charge** makes the jobs £0 and keeps them off invoices.\n4. Press **Change n jobs**. A line summarises what it did, and any job left alone is named.\n\nA site change that is just the name and address leaves the route and costs alone. A route change re-routes and re-works fuel, tyre and maintenance costs by the new miles.\n\n### Undoing a bulk change\n\nUnder **Recent bulk changes**, each one has **Undo**. It puts the jobs back. A job that has since been invoiced is left and named.\n\n### Looks like day hire?\n\nThis tab lists days that look like day hire, customer by customer, for you to say yes to. Day hire is never guessed. Press **Make these day hire** for one pattern, or **Make all n days day hire** for a customer. Each job keeps the money it has. A box shows **Undo** straight after.\n\n### Changing drivers, vehicles, trailers and customers\n\n1. Search and tick the records. **Only ones in use** is ticked by default.\n2. Under **Change**, choose **What to change**. The middle column shows each record's current value.\n3. Enter the new value. For driver pay, choose a **New pay scheme** and **Starting from** a date. For needs and groups you add or take off.\n4. Press **Change n drivers…**. The app asks **Yes, change them**.\n\nOnly fields listed under **What to change** can be changed. If a value is not accepted, the message names the field.\n\n## The Activity log\n\nOpen **Data > Activity log**. It shows who signed in, from which place and device, wrong passwords tried on your logins, and who changed pay, invoices and payments, access, clocking and settings, each in plain words. Nobody can edit or delete it, not even admins.\n\n- Choose **Last 7 days**, **Last 30 days**, **Last 90 days**, **Last year** or **Pick dates…**.\n- Filter by **What** (for example **Sign-in**, **Pay**, **Invoices**, **Access**, **Clocking** or **Settings**) and **Who**.\n- The figures are **Sign-ins**, **Places signed in from**, **Wrong passwords** and **Changes**.\n- Each line shows **When**, **Who**, **What happened** and **From**. Wrong passwords are marked **Wrong password**.\n- **Download (CSV - opens in Excel)** saves the lines on screen as a spreadsheet.\n\nIt shows the latest 300. Narrow the dates, or pick one kind or one person, to see further back.\n\n## Getting your data out\n\nYour data is yours. There are several ways to get it out:\n\n- Most lists and reports have a download. For example **Download (CSV - opens in Excel)** on **Actual costs** and the **Activity log**, **Download list (Excel)** on **Invoices**, and the **Sage export** (chapter 23).\n- **Download PDFs** on **Invoices** makes a zip of invoice PDFs.\n- **Settings > Personal data > What we hold about someone** makes one spreadsheet of everything held about a person, for a subject access request. When someone asks for a copy of their personal data you have one month to answer. Choose the person and press **Download their data**. Read it through before you send it, and take out anything about other people.\n- For a copy of everything the company holds, ask TransportInsight support through **Help & support**. They make one zip of spreadsheets, never including passwords or codes. They must give a reason, and you can see it on your **Activity log**.\n\n## Help & support\n\nOpen **Data > Help & support**.\n\n1. Choose what it is about: **Password / can't sign in**, **Two-step sign-in (locked out)**, **Storage / limits**, **Billing / my account**, **Something isn't working**, **An idea or request** or **Something else**.\n2. Describe what is happening and what you were doing. For example: \"The invoice for Northgate Aggregates won't issue - it says...\".\n3. Press **Send to support**.\n\nUnder **Your company's requests** you see each request with its status: **With support**, **Waiting on you** or **Sorted**. Support's reply appears under it.\n\nIf a colleague cannot sign in, you do not have to wait for support. An admin can make them a reset code or switch off their two-step sign-in on **Team & logins**.\n\n### If you cannot sign in at all\n\nOn the sign-in page:\n\n- **Forgotten your password?** asks for your email and sends you a one-time reset code. It is for office logins. Phone-app logins ask their office for a reset code.\n- **I have the code**: type the code (12 letters and numbers like ABCD-EFGH-JKLM; the dashes do not matter) and then a new password of at least 8 characters. A code works once, for 2 days.\n- **Can't sign in?** lets you send a request to support without being signed in. Choose **I've forgotten my password**, **I'm locked out of two-step** or **Something else**.\n\n## Good to know\n\n- **Settings apply to everyone straight away.** Think before changing a warning limit on a busy day.\n- **Bulk changes can be undone** from the same page, Jobs on issued invoices are locked and skipped.\n- **Support only looks when you let them.** **Support can look, not change** is the default, and you can switch it off.\n- **The log cannot be tampered with.** The database records each change itself.\n\n## When something goes wrong\n\n- **\"Only a company admin can change Settings and Team & logins.\"** Ask an admin.\n- **\"You haven't got access to (a section) - ask a company admin (Team & logins) if you need it.\"** Your login does not have that section ticked.\n- **\"Too many wrong passwords - wait 15 minutes, or use 'Forgotten your password?' to set a new one.\"**\n- **\"Too many wrong codes - wait 15 minutes. Lost your phone? Use a spare code, or ask a company admin.\"**\n- **\"Your session has expired. Please sign in again.\"**\n- **\"Tick some jobs first.\"** and **\"Choose something to change.\"** on **Bulk changes**.\n- **\"That bulk change has already been undone.\"**\n- **\"Couldn't find the postcode ... Please check it.\"** on a bulk site change.\n- **A refusal on Settings names the setting by its label.** Correct the figure and press **Save** again.\n"}, {"id": "appendix", "n": 28, "title": "Messages and words", "md": "# Appendix: messages and words\n\n## Part 1: messages you might see\n\nThese are the common refusals, as the app words them. Where the message names a job, vehicle, date or amount, this appendix shows a made-up one (Demo Haulage Ltd, DE24 MOH, Danny Driver, Northgate Aggregates). The app is built to say what blocked something and by whom, never just \"error\". Use the message first. This list tells you what to do about it.\n\n### Signing in and who can see what\n\n| Message | What to do |\n| --- | --- |\n| **Your session has expired. Please sign in again.** | You were away too long, or your access was changed. Sign in again. |\n| **Too many wrong passwords - wait 15 minutes, or use 'Forgotten your password?' to set a new one.** | Wait, or use **Forgotten your password?** on the sign-in page (chapter 27). |\n| **Too many wrong codes - wait 15 minutes. Lost your phone? Use a spare code, or ask a company admin.** | Your two-step code was typed wrongly too often. An admin can switch it off on **Team & logins**. |\n| **You haven't got access to Money - ask a company admin (Team & logins) if you need it.** | Your login does not have that section ticked. Ask an admin (chapter 4). |\n| **Only a company admin can change Settings and Team & logins.** | Ask an admin. **Settings**, **Bulk changes**, **Tidy up duplicates** and the **Activity log** are admin-only. |\n| **That sign-up code isn't right, has been used, or has run out - check it, or ask TransportInsight for a new one.** | Check the code, or ask for another. |\n\n### Saving a record\n\n| Message | What to do |\n| --- | --- |\n| **A vehicle with that registration is already on file.** (Similar wording for trailers, customer codes and pay scheme names. Other duplicates say **That already exists - ...**.) | You are adding something that is already there. Search for it instead. |\n| **Someone with that name is already on file. Add a label (e.g. 'Night') to tell them apart.** | Two people with the same name need a label. |\n| **That record is in use elsewhere, so it can't be removed.** | Records that have history cannot be deleted. Untick **In use** where there is one (chapter 27). |\n| **A linked record (vehicle, driver, customer...) couldn't be found.** | It was removed while you were editing. Refresh and choose again. |\n| **That overlaps with an existing entry for the same dates or times.** | For example holiday over an existing holiday. Change the dates. |\n| **Someone else was saving the same thing at that moment - please try again.** | Press the button again. |\n| **Please fill in (field).** | A required box is empty. |\n| **One of the values isn't in the right format.** | Check dates, numbers and money boxes. Money is typed in pounds, like 250 or 1,250.50. |\n| **Something went wrong saving that. Please try again.** | Try once more. If it keeps happening, tell support through **Help & support**. |\n\n### The Planning board\n\n| Message | What to do |\n| --- | --- |\n| **That run has been removed - refresh the board.** / **That run no longer exists - refresh the board.** | A colleague removed it. Refresh. |\n| **The run changed while you were moving it - refresh the board.** | Two people changed the same run. Refresh and move it again. |\n| **DE24 MOH is set not running on Mon 12 Oct - set it running again first (on its row).** | On the vehicle's lane, press **Set running** (chapter 7). |\n| **That vehicle and driver already have a run that day (a colleague may have just made it) - refresh the board, or pick a different driver for a second run.** | Refresh. For a double shift, choose another driver. |\n| **That job is subcontracted - the subcontractor does it, so it isn't planned on your fleet.** | Take the load back from the subcontractor first (chapter 6). |\n| **That job is split into two parts - move the part you want, or Join it back up first.** | See chapter 9. |\n| **That job has been cancelled or removed.** | Reinstate it on the job, if it should be planned. |\n| **That job is on an issued invoice, so it's locked. A company admin can unlock it to correct it (and raise a credit note if the money changes).** | Ask an admin. |\n\n### Jobs and waiting time\n\n| Message | What to do |\n| --- | --- |\n| **That time hasn't happened yet - check the time.** | The time typed is in the future. |\n| **That job's times were given already - step it back to change them.** | Times can only be stepped back, not overwritten. |\n| **This customer isn't set up for waiting time - tick it on their Customers page first.** | Open the customer and tick it. |\n| **This customer has no demurrage rate yet - add their £ per hour on the Customers page.** | Add the rate, then try again. |\n| **Enter an amount greater than zero.** | A charge needs a real amount. |\n\n### Invoicing (chapter 23)\n\n| Message | What to do |\n| --- | --- |\n| **That invoice has been issued - it can't be changed. Void it or credit it instead.** | Use **Credit…** (or **Void**, if there are no payments, credits or exports). |\n| **Before your first invoice: are you VAT registered? Answer it on Invoicing > Invoice settings (yes needs your VAT number; no means no VAT is added).** | Answer on **Invoice settings**. |\n| **Job 289065 is already on an invoice or backing sheet - take it off there first.** | Find the other sheet and press **Take off**. |\n| **These need a reason before they can go on: ...** | Tick the jobs and type a reason. |\n| **These are marked as not to be invoiced - clear that on the job first: ...** | Open the job and remove the mark. |\n| **Their self-bill is £1,200.00; this backing sheet comes to £1,350.00 ... Take off jobs they haven't included, or correct rates, until the two match.** | Adjust until the totals agree. |\n| **For (line): credit between £0.01 and £x (what's left of it).** | Your credit is more than what is left, or nothing. |\n| **That's more than the £x still owed on INV-0001. If they really paid more, tick 'They paid more than the invoice'.** | Check the amount, or tick the box. |\n| **That payment has already gone to Sage in an export - take it off in Sage, and record any correction here as a new payment or a credit note.** | Do not delete it here. |\n| **That invoice has already gone to your accounts package - credit it instead, so the credit goes across too.** | Credit it. |\n| **Nothing new to export in that period - every issued invoice, credit note and payment has gone across already.** | Try **Everything not sent**. |\n| **Fix these first: ...** | The Sage export lists what is missing, for example a customer with no account code. |\n| **Number 1042 has been used already (the last was 1050) - pick a higher one.** | Choose a higher starting number on **Invoice settings**. |\n| **Job card JC-0007 isn't done yet.** / **...is already on an invoice.** | A workshop invoice only takes finished cards that are not billed. |\n\n### Credit control (chapter 24)\n\n| Message | What to do |\n| --- | --- |\n| **That customer doesn't owe anything on an issued invoice.** | Nothing to record a remittance against. |\n| **INV-0001 only has £x left to pay.** | One of your split amounts is too big. |\n| **That's £x more than the invoices chosen (they owe £y in all) - adjust the amounts.** | The split must add up to the amount received. |\n| **A payment of this money looks already recorded: ...** | Check, then tick **It's a second payment** if the customer really did pay twice. |\n\n### Bulk changes (chapter 27)\n\n| Message | What to do |\n| --- | --- |\n| **Tick some jobs first.** | Tick at least one job. |\n| **Choose something to change.** | Fill in a site, need, order ref or rate. |\n| **Give the rate (£).** | A rate type other than **Free of charge** needs an amount. |\n| **Couldn't find the postcode ... Please check it.** | Check the postcode typed for the new site. |\n| **To change the route, the loading site needs a postcode.** | Add one, or untick **Change the route too**. |\n| **That bulk change has already been undone.** | Nothing more to do. |\n\n### Catch up (chapter 22)\n\n| Message | What to do |\n| --- | --- |\n| **n fixed. n couldn't be:** (with a list) | Each line names the job and why. Open it from the list. |\n| **Not saved yet - press Enter or \"Delivered + ticket\"** | You typed a ticket that also marks the job delivered. Press **Enter**. |\n\n## Part 2: glossary\n\n**Account code**: the short code for a customer, which you also pass to Sage. Searches throughout the app find a customer by it.\n\n**Ageing**: how old a debt is. On **Credit control**: not due yet, 1-30, 31-60 and over 60 days overdue.\n\n**AdBlue**: the urea solution diesel engines use. Kept apart from diesel in Actual costs.\n\n**Amber**: a defect colour. The vehicle can be driven, but needs fixing soon. The other colours are Red (do not drive it) and Green (cosmetic only).\n\n**Backing sheet**: a draft invoice. The list of jobs and amounts you check before issuing it. Also the job-by-job page printed after the invoice.\n\n**Backload**: a load for the return trip, so the vehicle is not driving home empty.\n\n**Bulk changes**: changing many jobs, drivers, vehicles, trailers or customers at once. Admins only, with undo for jobs.\n\n**Capability**: something a vehicle, trailer or driver can do, such as ADR or a tail-lift. Jobs can need them.\n\n**Catch up**: the daily list of yesterday's jobs that would hold up invoicing (chapter 22).\n\n**Compact | Detailed | Map**: the three views of the Planning board.\n\n**Credit note**: a document that takes money off an invoice, in part or in full.\n\n**Day hire**: a vehicle and driver for a day (or half a day) at one price, covering any number of jobs.\n\n**Day profit**: the profit of a run worked out as one vehicle and one driver for the day, including empty miles and the driver's pay.\n\n**Day score**: a mark out of 100 for a day's run: hours, empty running and money.\n\n**Defect**: a fault reported on a vehicle or trailer. A Red one takes it off the road.\n\n**Demurrage**: a charge for waiting longer than agreed at a site. Worked out from waiting time and the customer's rate.\n\n**Draft**: a run not yet confirmed (chapter 7). Also a backing sheet not yet issued.\n\n**Drop**: a delivery or tipping point. Also dragging a job onto a vehicle's lane.\n\n**Duty**: the driver's estimated hours for the day, each job's own time plus driving empty.\n\n**Empty miles**: miles the vehicle runs without a load, between jobs and back to the yard.\n\n**FOC (free of charge)**: a job priced at £0 that never goes on an invoice.\n\n**Fleet group**: a kind of grouping for vehicles, such as General or Day hire.\n\n**Haulage | Workshop**: the two kinds of invoice, kept apart, with their own numbers.\n\n**Held back**: a job left off a backing sheet because of a problem, such as no rate.\n\n**Lane**: one vehicle's row on the Planning board. Also, in Insights, a regular route.\n\n**Leg**: one job's place on a run.\n\n**Nights out (tramping)**: a vehicle that stays out overnight and starts the next day from where it was left.\n\n**O-licence**: the operator's licence. It lets you run vehicles for hire or reward.\n\n**Optimise day**: the tool that suggests a plan for the day's unplanned jobs (chapter 8).\n\n**POD (proof of delivery)**: the delivery ticket, signature and photos that show a load arrived.\n\n**PO number**: the customer's purchase order number, which some need on every invoice.\n\n**Provisional**: a vehicle, driver or customer added by an import that you have not yet checked. Marked **check details**.\n\n**Remittance**: a customer's payment advice covering several invoices.\n\n**Reference period**: the span a driver's working time is averaged over (chapter 14 and 27).\n\n**Run**: one vehicle, one driver and an ordered list of jobs, for one day.\n\n**Run pattern**: a run's type, such as Day or Out, deciding if it returns to the yard.\n\n**Self-billing**: a customer who sends you the invoice, which you match.\n\n**Split load**: one job carried in two parts by two runs, handed over at a place (chapter 9).\n\n**Sage 50**: the accounts package your invoices, credit notes and payments go to.\n\n**Subcontract**: giving a load to an outside haulier.\n\n**Tacho**: the tachograph. Download of driver cards and vehicle units is tracked on **Compliance**.\n\n**Tramping**: see nights out.\n\n**Two-step sign-in**: a 6-digit code from a phone app, typed after the password.\n\n**VOR (vehicle off road)**: a vehicle that cannot work until it is repaired or passed.\n\n**WTD (Working Time Directive)**: the rules on drivers' working hours, applied as the Road Transport (Working Time) Regulations 2005.\n\n**Void**: to cancel an issued invoice that has no payments, credits or Sage export. Its jobs return to waiting to be invoiced.\n"}]</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const BOOK = JSON.parse(document.getElementById('book').textContent);
const PARTS = [[1, 'Getting going'], [5, "The day's work"], [11, 'Phones'], [13, 'Fleet and compliance'], [17, 'Workshop'], [19, 'People'],
  [22, 'Money'], [26, 'Knowing your business'], [27, 'Looking after it']];
const view = document.getElementById('view'), list = document.getElementById('list'), q = document.getElementById('q');
const toc = document.getElementById('toc'), menu = document.getElementById('menu');
const md = (t) => { try { return marked.parse(t) } catch { return '<pre>' + t.replace(/</g, '&lt;') + '</pre>' } };

function renderList() {
  let html = '', partI = 0;
  BOOK.forEach((c) => {
    while (partI < PARTS.length && c.n >= PARTS[partI][0] && c.n < 28) { html += (partI ? '</ol>' : '') + `<div class="part">Part ${partI + 1} · ${PARTS[partI][1]}</div><ol>`; partI++ }
    if (c.n === 28) html += '</ol><div class="part">At the back</div><ol>';
    html += `<li><a href="#${c.id}" data-id="${c.id}"><span class="n">${c.n === 28 ? 'A' : c.n}</span><span>${c.title}</span></a></li>`;
  });
  list.innerHTML = html + '</ol>';
}

function show(id) {
  const i = Math.max(0, BOOK.findIndex((c) => c.id === id));
  const c = BOOK[i], prev = BOOK[i - 1], next = BOOK[i + 1];
  view.innerHTML = `<article>${md(c.md)}</article><div class="pager">${prev ? `<a href="#${prev.id}">← ${prev.title}</a>` : '<span></span>'}${next ? `<a href="#${next.id}">${next.title} →</a>` : ''}</div>`;
  view.querySelectorAll('article table').forEach((t) => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t) });
  list.querySelectorAll('a').forEach((a) => a.setAttribute('aria-current', a.dataset.id === c.id ? 'page' : 'false'));
  toc.classList.remove('open'); menu.setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}

function search(term) {
  const t = term.trim().toLowerCase();
  if (t.length < 2) { show(location.hash.slice(1)); return }
  const esc = (s) => s.replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  const hits = [];
  BOOK.forEach((c) => {
    const plain = c.md.replace(/[#*_`>|]/g, '');
    let at = plain.toLowerCase().indexOf(t), n = 0;
    while (at >= 0 && n < 3) {
      const s = Math.max(0, at - 70), e = Math.min(plain.length, at + t.length + 90);
      const bit = esc(plain.slice(s, e)).replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), (m) => `<mark>${m}</mark>`);
      hits.push(`<a class="hit" href="#${c.id}"><b>${c.n === 28 ? 'Appendix' : c.n + '.'} ${c.title}</b><small>${s ? '…' : ''}${bit}…</small></a>`);
      at = plain.toLowerCase().indexOf(t, at + t.length); n++;
    }
  });
  view.innerHTML = `<div class="results"><h1>${hits.length ? `Found in ${hits.length} place${hits.length === 1 ? '' : 's'}` : 'Nothing found'}</h1>${hits.join('') || '<p>Try a shorter word, or the name of a screen, like "Planning board".</p>'}</div>`;
}

renderList();
show(location.hash.slice(1) || BOOK[0].id);
window.addEventListener('hashchange', () => { q.value = ''; show(location.hash.slice(1)) });
q.addEventListener('input', () => search(q.value));
menu.addEventListener('click', () => { const o = toc.classList.toggle('open'); menu.setAttribute('aria-expanded', String(o)) });
</script>

</body>
