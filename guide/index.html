<script id="book" type="application/json">[{"id": "welcome", "n": 1, "title": "Welcome", "md": "# 1. Welcome\n\n## What it's for\n\nTransportInsight is where a haulage office plans the day, prices loads, sends runs to drivers' phones, keeps the fleet legal, runs the workshop, invoices customers and finds out where the money is made and lost. Everything is costed the same way, so the price you quote, the cost on the Planning board and the profit you see afterwards all come from the same figures.\n\nThis chapter shows you around: how to sign in, how the menu is laid out, what Home tells you each morning, how to have a look round without signing up, and why two people in the same office may see different screens.\n\n## Before you start\n\nYou need a login. There are three ways to get one:\n\n- **Create a company** - on the sign-in screen, for the person setting the company up. You give the company name, your name, your email and a password of at least 8 characters (the most common, easy-to-guess ones like \"password1\" or \"12345678\" are refused). You become the company admin.\n- **Join a company** - for everyone else. Your admin makes you an invite code (see chapter 4), and you enter it with your email and a password.\n- **Look around a sample company** - no sign-up at all (see below).\n\nDrivers and mechanics use the phone app. They join the same way, with a code from the office.\n\n## How to...\n\n### Sign in and out\n\n1. Open TransportInsight and stay on the **Sign in** tab.\n2. Type your email and password, then press **Sign in**.\n3. If your company uses two-step sign-in, you are asked for a 6-digit code from the app on your phone. Chapter 4 covers this.\n4. If you belong to more than one company you see **Choose a company** - press the one you want.\n5. To leave, press **Sign out** at the bottom of the menu.\n\nIf you have forgotten your password, press **Forgotten your password?** and a reset code is emailed to you. Already have a code (from your email, from your admin or from TransportInsight support)? Press **I have a reset code**, type it in, then choose a new password. The code works once, for 2 days.\n\n### Find your way round the menu\n\nThe menu runs down the left. It is grouped by the job being done:\n\n| Group | What's in it |\n|---|---|\n| **Today** | **Home** |\n| **Operations** | **Route Builder**, **Jobs**, **Catch up**, **Bulk changes**, **Planning board**, **Trailer board** |\n| **Fleet** | **Vehicles & trailers**, **Compliance & VOR**, **FORS**, **Trackers** |\n| **HR** | **Staff files**, **Recruitment**, **Drivers**, **Pay schemes**, **Team & logins**, **Holiday calendar**, **Hours clocked** |\n| **Customers** | **Customers**, **Price list**, **Places**, **Subcontractors** |\n| **Workshop** | **Bookings**, **Job cards**, **Workshop board**, **Parts & stock**, **Mechanics**, **Outside firms**, **Defect reports** |\n| **Money** | **Invoicing**, **Credit control**, **Costs & rates**, **Actual costs**, **Purchase orders** |\n| **Insights** | **Insights** |\n| **Data** | **Imports**, **Tidy up duplicates**, **Activity log**, **Settings**, **Help & support** |\n\nA few things to know about the menu:\n\n- Press a group's name to fold it away, and press it again to open it. Use the small arrows at the top of the menu to hide the whole menu for more room; press them again to bring it back. On a narrow window the menu always hides itself and slides out when you press the menu button.\n- At the bottom of the menu you will find a **Theme** box (system, dark or light), **Your login & security** (for two-step sign-in) and **Sign out**.\n- You may not see every item. See \"Who sees what\" below.\n- If your company has no workshop of its own and uses outside garages, **Job cards** is called **Repairs** and the **Workshop board** and **Mechanics** are hidden.\n- If you picked \"Just me - I drive too\" as your firm size (chapter 2), you get a simpler menu with no team, recruitment, holiday or bulk-change screens. Nothing is deleted - pick another size and they all come back.\n\n### Ask a page what it's for\n\nEvery page title has a small **?** beside it. Press it and a panel opens with three parts: what the page is for, how to use it, and a few things worth knowing. Press **Close** to put it away. It is the quickest way to refresh your memory on a screen you don't use often.\n\n### Read Home each morning\n\n**Home** is your morning at a glance. The cards you see depend on your login, and they come in the order that suits your job - a planner sees the day's board first, accounts see the money first, the workshop foreman sees the workshop first. The cards you may meet:\n\n- **Getting set up** - the set-up guide for a new company (chapter 2). It disappears once the must-do steps are done, or when you press **Hide this guide**. Press **Set-up guide** at the top of Home to bring it back.\n- **Jobs this week**, **Revenue this week**, **Overdue invoices** and **Fleet** - the headline figures. Revenue and profit are only shown to logins with Money access.\n- **Today's board** - runs out today, jobs planned, runs not yet sent to a phone and jobs still to plan. Press **Open the Planning board** to get going.\n- **Loads on vehicles that can't run** - jobs planned on a vehicle that has since gone off the road. Move them, or put the vehicle back on the road.\n- **Money waiting** - what is ready to invoice, backing sheets to issue, jobs held back and what is overdue.\n- **Credit control - who to chase** - customers with overdue invoices, worst first.\n- **Workshop today** - defects to look at, vehicles off the road, jobs waiting for parts, and MOTs or inspections due in 30 days that are not booked.\n- **Compliance - needs attention** and **Yesterday's work - gaps to close** - MOTs, inspections and the like, then jobs from yesterday with no rate, no delivery ticket and so on. Press **Sort them out** to go to **Catch up**.\n- **Insights** - your three biggest findings.\n- **Off today** - who is booked off, and holiday requests waiting for you.\n\nThe buttons at the top of Home are **Import history** (if you can use Imports) and **Quote a load**, which opens Route Builder.\n\nAnything amber or red needs sorting today. Press a card heading to go straight to the page behind it.\n\n### Have a look round the sample company\n\nOn the sign-in screen, press **Look around a sample company**. You get a made-up haulier, Demo Haulage Ltd, with six months of work. There is no sign-up and nothing is saved, so you can press anything. A bar across the top says \"You're looking around a sample company\". Press **Leave the sample** when you are done, or **Start your free trial** to create your own company.\n\nIn the sample, each page's **?** panel also offers a short tour with a **Next:** button that walks you through the main pages in order, and says how each one helps a business like yours. If you try to save something, the sample tells you nothing is saved.\n\n### Who sees what\n\nA company admin sees everything. Everyone else is given sections, ticked one by one (chapter 4 shows how). The sections are **Operations**, **Fleet**, **HR**, **Pay**, **Customers**, **Workshop**, **Money**, **Insights** and **Imports**. A separate set of screens - **Settings**, **Team & logins**, **Tidy up duplicates**, **Activity log** and **Bulk changes** - is for company admins only.\n\nSo a planner given Operations, Customers and Fleet sees the Planning board and the fleet, but not Invoicing or pay. A page they are not allowed to see is not in their menu, and if they type its address they see \"You haven't got access\", naming the section they would need.\n\n## Good to know\n\n- **Changes show on everyone's screen within a few seconds.** Two planners can work on the same board; a small **Live** badge, with colleagues' initials beside it, tells you who else is looking at that board.\n- **Phone logins are different.** A driver's or mechanic's phone login opens the phone app only. It cannot open the office screens, whatever its owner knows.\n- **Nothing here is ever really deleted where records depend on it.** Lists such as vehicle roles are hidden with an **In use** tick box, never removed, so old jobs keep their meaning.\n- **Your admin controls access.** If you are removed from the company, your access stops on your next click.\n\n## When something goes wrong\n\n- **\"You haven't got access\"** - the page belongs to a section your login doesn't have. Ask your company admin to tick it for you on **Team & logins**.\n- **\"Can't sign in?\"** - ask a company admin first: they can make you a reset code, or switch off your two-step sign-in if you have lost your phone. If nobody can, use **Other sign-in help** on the sign-in screen, choose what is wrong and press **Send to TransportInsight support**.\n- **\"TransportInsight has been updated - Reload\"** - a banner that appears after an update. Press **Reload** so your screen matches the new version. If a page ever goes blank you will see **Reload** and **Go to Home** buttons instead of an empty window.\n- **Asking for help.** Press **Help & support** (bottom of the Data group), choose what it is about, say what was happening and what you were doing, and press **Send to support**. The reply appears on the same page under **Your company's requests**, marked \"With support\", \"Waiting on you\" or \"Sorted\".\n"}, {"id": "setting-up", "n": 2, "title": "Setting up your company", "md": "# 2. Setting up your company\n\n## What it's for\n\nA new company starts with sensible defaults - a walk-around checklist, distance bands and the usual lists - but it knows nothing about your yard, your vehicles, what your drivers are paid or what diesel costs you today. Those are the figures every quote, every job and every profit number is worked out from. This chapter walks you through putting them in, in the order that works best.\n\n## Before you start\n\nYou need to be a company admin - the person who created the company is one automatically. Have to hand:\n\n- your company details (legal name, address, VAT number if you have one, bank details);\n- your yard's postcode;\n- a list of your vehicles with typical running costs;\n- how each driver is paid;\n- today's diesel price.\n\nIf your old system can export vehicles, drivers or customers as a spreadsheet, you can bring them in rather than typing them (chapter 3).\n\n## How to...\n\n### Work through the set-up guide\n\nOn **Home** a card called **Getting set up** shows how many steps are done (\"4 of 11 done\"). Every step ticks itself off from your own data - nothing is ticked by hand, so it never says \"done\" when it isn't. The next step to do is marked with **Do this next**; the others have **Set up**. Press a step's name or its button and you go straight to the right page. A finished step offers **Change**. Where a step can be done from a spreadsheet, there is also an **Import a spreadsheet** button.\n\nThe very first thing it asks is **How big is your firm?** - *Just me - I drive too*, *Small* (2 to 10 vehicles), *Medium* (11 to 50) or *Large* (over 50). Then it asks **What kind of work do you do?** Nothing else appears until you have answered both, because the rest of the list fits your answers. The steps, in order, are:\n\n1. **Your company details** - address, VAT answer and bank details (below).\n2. **What kind of work you do - start here**.\n3. **Your yard**.\n4. **Your vehicles** (or **Your vehicle** for a one-man band).\n5. **How you pay your drivers**.\n6. **Your drivers** (for a one-man band, **You as the driver**).\n7. **Your mechanics and their pay** - only if you have your own workshop.\n8. **Today's fuel price**.\n9. **Your customers**.\n10. **Your work** - bring in past jobs, or add today's.\n11. **Invite your office team** - not shown to a one-man band.\n12. **Drivers on the phone app** - not shown to a one-man band.\n13. **Connect your trackers** - optional.\n\nPress **Hide this guide** to put it away. It comes back from the **Set-up guide** button at the top of Home until every must-do step is done.\n\n### Say how big you are and what work you do\n\n1. Go to **Settings > Company**.\n2. Under **What kind of work do you do?**, pick your firm size under **How big is your firm?**. It saves as soon as you press it.\n3. Under **The work**, tick every kind of work that fits and press **Save**.\n\nYour answer changes what Insights puts first (\"For you\") and which set-up steps you are shown. It never hides anything - every Insights check is still there under **Everything** and **All checks**. A box on **Settings > Planning** also lets you say whether you do day hire; untick it and \"Day hire\" disappears from the charge types and customers' day rates.\n\n### Put in your company details, VAT and invoice numbering\n\nThese are printed on every invoice. Go to **Settings > Company** (the **Invoices** section further down) or **Invoicing > Invoice settings** - it is the same form.\n\n1. Fill in **Legal name**, **Company number**, **Email**, **Phone** and **Address**.\n2. Under **Are you VAT registered?**, press **Yes - add VAT to invoices** or **No - no VAT**. You must answer; until you do, no invoice can be issued. If you said yes, type your **VAT number** (nothing can be issued without it) and check the **VAT rate %**.\n3. Set **Payment terms (days)**. A customer's own terms win over this one.\n4. Type your **Bank details** (printed under \"Payment\") and a **Footer** such as your terms of business.\n5. Under **How you invoice**, set **Your week ends on** (weekly invoices follow it) and **Start invoicing from**. Work before that date is treated as invoiced elsewhere - useful if you are bringing in history.\n6. Set **Invoice numbers start with** and **Next invoice number** so you carry on from your current numbering. Do the same for credit notes. Workshop invoices have their own prefix and numbers so they never mix with haulage invoices.\n7. Set the **Sage sales nominal code** (usually 4000) and the **PDF colour**.\n8. Press **Save settings**.\n\n### Save your yard and other places\n\n1. Go to **Customers > Places** and press **Add place**.\n2. Give it a **Name**, choose the **Type** (yard, depot and so on), and type its **Postcode**. The postcode is looked up automatically for distances.\n3. Tick **Default start for new runs** and **Default end for new runs** on your yard. New runs then start and end there, and empty miles to the first job are counted from it.\n4. Press **Save**.\n\nCustomer sites can be saved here too. **Find sites in your jobs** lists the places your jobs load and tip at that aren't saved yet, most used first - tick the ones to keep and press **Save n sites**.\n\n### Add your vehicles and give them running costs\n\n1. Go to **Fleet > Vehicles & trailers** and press **Add vehicle**, or bring them in from a spreadsheet (chapter 3).\n2. Fill in the **Registration**, **Role** and the rest.\n3. Under **Costing figures**, put in **MPG (typed in)**, **Fixed cost per day (£)** (finance, insurance, road tax), **Maintenance (pence per mile)** and **Tyres (pence per mile)**.\n4. Under **Compliance**, put in **MOT due**, **Inspection due** and **Tacho calibration due**.\n5. Press **Save**.\n\nA vehicle with no running costs at all is not counted as set up, because every job on it would be costed on fuel alone and the profit would look far too good. Vehicles an import made for you are marked **Needs details** - fill them in, then untick that box.\n\n### Set up how drivers are paid, then add drivers\n\nDriver pay is usually your biggest cost after fuel, so nothing is made up for you.\n\n1. Go to **HR > Pay schemes** and press **New pay scheme**.\n2. Give it a **Scheme name**, then press **+ Add pay line** for each part: a day rate, an hourly rate, overtime, a nights-out allowance and so on. Each line has a **Type**, an amount, **Applies on** (which days) and, for hourly bands, **From hour** and **To hour**.\n3. Tick **Shared - other drivers can be put on this scheme** if more than one driver is paid this way.\n4. Press **Save**. A worked example at the bottom (**Day**, **Hours worked**, **Miles**, **Jobs**, **Nights out**) shows what the scheme pays for a day you describe, so you can check it.\n5. Go to **HR > Drivers** and press **Add driver**. Fill in the **Full name**, choose the **Pay scheme** and **New pay applies from**, and add the **Standard working hours per day** and the **Licence expiry**, **Driver CPC expiry** and **Tacho card expiry** dates.\n\nPay changes are kept as history, so old jobs keep the pay that applied at the time.\n\n### Put in today's fuel price\n\n1. Go to **Money > Costs & rates**. The **Fuel prices** tab is first.\n2. Press **Add fuel price**.\n3. Type the **Pence per litre** (for example 133.9), the **From** date and, if you like, a supplier and notes. Leave **To (optional)** blank - it runs until the next price replaces it.\n4. Press **Save**.\n\nRoute Builder averages the diesel prices active in a job's week. Adding a new price ends the previous one the day before. With no price on file, quotes assume £1.33 a litre - so enter yours.\n\n### Check the other Costs & rates tabs\n\n- **Distance bands** - \"how far, how fast, how thirsty\". A job's miles pick its band, and each band has an average speed, an MPG adjustment and default waiting and idling hours. Edit the rows, press **Add band** for another, then **Save bands**. You can keep several costing profiles (**Copy as new profile**, **Make default**).\n- **Targets & backload** - **Target margin (%)** and **Target profit per load (£)** are what every quote is judged against. The backload settings (**Within (miles)**, **Looking back (days)**, and the job counts that count as \"Strong\" or \"Possible\") drive the return-load signal on quotes.\n\n### Add customers\n\nGo to **Customers > Customers** and press **Add customer**, or import a list (chapter 3). Give the **Customer name**, **Code** (the account code - searches match on it), **Payment terms (days)**, and how you invoice them (**Invoice them**, **Invoice style**, **Standing PO number**, **Needs a PO on every invoice**). Day-hire customers get their own **Day rate (£)** and **Half-day rate (£)**.\n\n## Good to know\n\n- **Costs are live.** If you change a vehicle's costs or its MPG, jobs are costed again. Jobs already saved keep the figures they were quoted on.\n- **Lists are never deleted.** Vehicle roles, trailer types, run patterns, extra charge types, capabilities and fleet groups live on **Settings**. An **In use** tick box hides an item without breaking old records, and a few (such as Demurrage) can't be hidden.\n- **Settings tabs.** **Settings** has tabs: **Company**, **Planning**, **Fleet & compliance**, **Operator licence**, **Workshop**, **Drivers & phone app**, **Money**, **Security** and **Personal data**. Each tab saves its own settings, and changes apply straight away for everyone.\n- **Warning days.** On **Settings > Fleet & compliance**, \"Warn about MOTs and inspections due within\" sets how far ahead the app warns you.\n- **Phone-app thresholds.** On **Settings > Drivers & phone app** you set how many loading and delivery photos are asked for per job, and whether the driver is asked for a delivery ticket number. Drivers can always deliver without one - the app warns, it never blocks.\n\n## When something goes wrong\n\n- **\"Invoices can't be issued until you say\"** - you haven't answered **Are you VAT registered?**. Answer it in the invoice settings.\n- **\"Needed on every invoice - nothing can be issued without it\"** - you said yes to VAT but left the **VAT number** blank.\n- **Profit looks far too high.** The vehicle or driver probably has no costs or no pay scheme. The set-up guide names how many vehicles have no running costs and how many drivers aren't on a pay scheme.\n- **A step won't tick.** Open its detail line on the guide: it says what is still missing, such as \"Still needs your address, bank details\".\n- **A refusal that names a setting by its screen label** - for example \"Warn about MOTs and inspections due within\" - means the number you typed is out of range. Change it and save again.\n"}, {"id": "bringing-history-in", "n": 3, "title": "Bringing your history in", "md": "# 3. Bringing your history in\n\n## What it's for\n\nIf you have been running on another system or a spreadsheet, you don't need to type it all again. **Imports** brings in your past jobs, this week's loads, and your customers, subcontractors, vehicles and drivers. Six months of history lights up Insights straight away, and the Planning board is filled with what your vehicles did.\n\nEvery imported job is costed the same way as a new quote. Nothing is thrown away: a row you would expect to be refused usually comes in and is flagged instead.\n\n## Before you start\n\n- Do the basics from chapter 2 first if you can: your yard, your fuel price and some pay schemes. The import uses them to cost the jobs.\n- Export from your old system as a spreadsheet, **.csv** or **.xlsx**. One row per job (or per leg). Any column order and any headings will do - you match them up in the next step.\n- Dates are best as 31/12/2026.\n- You need the **Imports** section on your login (company admins always have it).\n\n## How to...\n\n### Import past jobs, or this week's loads\n\nGo to **Data > Imports**. The steps run across the top: **Choose file**, **Match columns**, **Check**, **Import**.\n\n1. **Choose file.** Press **Choose a file...** or drop the file onto the box. The app reads it and shows how many rows and columns it found.\n2. **Match columns.** The table headed **Which column holds what?** has three columns: **In TransportInsight**, **Column in your file** and **First values**. The app matches the headings it recognises. Fields marked with a star are needed; if one is missing, **Check the file** stays greyed out and a note says \"Still needed:\" and names them. Pick the right column from each drop-down, or leave an optional one as **Not in this file**. Open **See the first rows of your file** if you want to look at the raw data.\n   - If your file has a work-type column, a box called **A row is subcontracted when its work type contains** appears. Rows whose work type contains that word are treated as subcontracted: their \"registration\" is the subcontractor and the job is costed at the subcontractor's price.\n   - Under **Save this layout**, give the layout a name (for example \"Mandata export\") and press **Save layout**. Next time a file with the same columns arrives, it is recognised straight away (\"Recognised layout\"). You can also pick a saved layout from **Or use a saved layout**.\n3. Press **Check the file**. Every row is checked, but nothing is saved yet.\n4. **Check.** The top figures say how many **Rows in file** there are, how many **Will be imported**, how many are **Already imported** (skipped, never doubled) and how many are **Skipped (problems)**. Below them:\n   - **What we found** lists things worth knowing, such as rows with no rate. Press **Save rows to check (Excel)** to take the list away and fix the file.\n   - **Postcodes we couldn't find** usually shows a typo in your old system, such as a zero for the letter O. Rows with miles still import. If the postcode service couldn't be reached, a note says so; you can still import or check again in a minute.\n   - **New records we'll add** lists vehicles, drivers, customers and subcontractors the file mentions that aren't on your system yet. They are made for you and marked **Needs details**.\n   - **Drivers who might already be on file** appears when a name is close to a driver you already have. Choose **Same as...** to use the existing driver, or leave **Add as a new driver**. Nothing is merged unless you choose it.\n   - **Costs used for these jobs** is where you set what the file doesn't say: a **Pay scheme** for any new drivers, the cost figures for new vehicles (**MPG**, **Fixed cost (£ per day)**, **Maintenance (pence per mile)**, **Tyres (pence per mile)**), a **Diesel price (£ per litre)** if none is on file for those dates, and driving hours when the file has none. Without vehicle costs the profit on imported jobs looks far too high, so the app warns you.\n   - **Invoicing** asks **Already invoiced?** - none of it, invoiced in your old system up to a date (**Invoiced up to and including**), or all of it. Choose carefully: if you billed any of it elsewhere and say \"none of it\", those jobs would be invoiced twice. Already-invoiced jobs still count in Insights and on the board; they just never show as waiting to be invoiced.\n   - **Planning board** has a tick box, **Put these jobs on the Planning board**. Each vehicle, driver and day becomes a run. A day you have already planned by hand is left alone.\n   - **Duplicate check** shows what the app compares to spot a job it already has. You can change the tick boxes (for example the source job number, date, registration, driver, customer, postcodes), then press **Check again** to update the count.\n5. When you are happy, press the button that says how many jobs it will bring in, such as **Import 14,109 jobs**.\n6. **Import.** A progress screen shows what is happening. **Stop import** is there if you need it: jobs already saved stay, and importing the file again carries on where it left off.\n7. The result screen shows **Jobs imported**, **Already there**, **Skipped (problems)** and **Runs on the Planning board**. Press **View the imported jobs**, or **Import another file**.\n\nA load with no vehicle yet comes in as a job to plan. A load on a vehicle goes on that vehicle's run - a draft from today on.\n\n### Import customers, subcontractors, vehicles or drivers\n\nOn the first **Imports** screen there are two cards under the file box.\n\n- **Customers and subcontractors** - **Import customers...** and **Import subcontractors...**. These bring in addresses, emails, phone numbers, VAT numbers and payment terms.\n- **Vehicles and drivers** - **Import vehicles...** and **Import drivers...**. Vehicles bring registrations, MOT and inspection dates; drivers bring names, licence, CPC and tacho card dates.\n\nEach opens a panel:\n\n1. Press **Choose the file...** and pick your spreadsheet.\n2. Check the column matching under **Which column is which**.\n3. Read **What will happen**: a table of what is new, what is filled in and what is skipped.\n4. By default only missing details are filled in. Tick **Replace details already on file with the file's** if you want the file to win.\n5. Press the **Import n...** button. The result says how many were added, filled in and skipped, and names skipped rows with the reason.\n\nA customer already on file is found by its account code (or name), a subcontractor by its name, a vehicle by its registration and a driver by their name. Pay for drivers is set afterwards, on the driver or with Bulk changes.\n\n### Look at past imports, and undo one\n\nUnder the file box, **Past imports** lists every import: **When**, **File**, **Status** (Imported, Running, Stopped part-way, Failed, Undone), **Rows added**, **Already there**, **Skipped**, **Dates** and **By**.\n\n1. Press a row to open it. It shows the totals and **Rows that were skipped**, each with its row number and reason.\n2. Press **View its jobs** to see what it brought in.\n3. To take it back out, press **Undo this import**, then **Yes - take out n jobs**.\n\nUndoing removes that import's jobs and the runs it made, and frees them so you can import the file again. Vehicles, drivers, customers and suppliers the import added stay. It refuses only if a job was since planned by hand onto another run, or invoiced - the message says which.\n\nTwo helpers appear in an open import:\n\n- **Put each day in its best order** - files often list jobs by job number rather than the order they were done. This puts each imported day in the order with the fewest empty miles. Days you have changed on the board are left alone. Skip it if your file had collection times.\n- **Put them on the board** - if some jobs from the import aren't on the Planning board (for example because it was stopped part-way), this puts them on.\n\n### Merge duplicates with Tidy up duplicates\n\nWhen an import can't match a name, registration or customer code exactly, it makes a new record. \"SMITH J\" arrives next to \"John Smith\"; a registration is typed with a typo. **Data > Tidy up duplicates** (company admins only) merges the extra record into the real one.\n\n1. Pick the tab: **Drivers**, **Vehicles** or **Customers**.\n2. **Possible duplicates** lists likely pairs: the record made by an import, how many jobs it has, the real one, and how alike they are (for example \"92% alike\"). Press **Check & merge...**. If the suggestion is the wrong way round, press **Merge the other way...**.\n3. To pick your own pair, use **Merge two yourself**: choose **The duplicate (goes)** and **The real driver (stays)**, then **Check...**.\n4. A panel says what will move across - jobs, runs and so on - and anything **kept under the old name** because it must not be rewritten (for example signed checks). It also says which spelling future imports will match straight to the real record.\n5. Press **Merge them...**, then **Yes, merge them**. **This can't be undone.**\n\n**Merged so far** lists every merge, with the date and who did it.\n\n## Good to know\n\n- **Importing the same file twice never doubles anything.** A job is recognised by the source job number when you have mapped it; otherwise by the other fields in the **Duplicate check**. Two identical rows in the same file are kept as two jobs - the same run really can be done twice in a day.\n- **Nothing valuable is thrown away.** A job with no rate comes in flagged \"no rate\". Rows with no postcodes (day hire, yard moves, surcharges) come in as jobs with no route. Subcontracted rows come in with the subcontractor and their price.\n- **Unallocated loads come in as jobs to plan.** A blank, \"UNALLOCATED\" or \"TBC\" registration means the job is not on a vehicle yet; it is costed on your fleet-average vehicle until you plan it.\n- **A cancelled row cancels the earlier job.** If your file has a Cancelled column, a cancelled row cancels the job from an earlier import (taking it off its run), unless it has been started or invoiced.\n- **Nights out are worked out for you** from the whole file, so a driver who stays out has the next day start from where they finished.\n- **A new company's drivers need pay.** If a new driver has no pay scheme, their jobs carry no driver cost until you set one on **Drivers**.\n- **Merging keeps the legal record intact.** Walk-around checks and similar records stay under the old name.\n\n## When something goes wrong\n\n- **\"Still needed:\" beside Check the file** - you haven't matched a starred field. Pick a column for it.\n- **\"Couldn't reach the postcode service just now\"** - postcodes weren't checked. Import anyway, or press **Check again** in a minute.\n- **Nothing new to import** - every row is already there or has a problem. Look at **What we found** and **Already imported**.\n- **Rows listed under \"Rows that were skipped\"** - each one names its row number and the reason (a bad date, a rate over the limit, a registration far too long, and so on). Fix them in the file and import again; rows already in are not doubled.\n- **Can't merge yet:** - a panel lists the reasons by name, for example the same vehicle on the same day, overlapping holidays or off-road spells, two coupled trailers, issued invoices, or a login attached to one of the records. Sort those out, then try again.\n- **Undo refuses** - a job from the import was planned by hand onto another run, or invoiced. The message names it.\n"}, {"id": "your-team", "n": 4, "title": "Your team", "md": "# 4. Your team\n\n## What it's for\n\nEveryone signs in as themselves. **Team & logins** is where a company admin invites colleagues, decides which parts of the app each office person can see, switches two-step sign-in on for the company, and gives drivers and mechanics their phone-app logins. Whatever one person does shows on everyone else's screen within a few seconds.\n\n## Before you start\n\n- You must be a **company admin** to invite people or change access. Others can open the page and see who is there, but not change it.\n- Have each person's name and email ready.\n- Drivers and mechanics should already exist as records (**HR > Drivers**, **Workshop > Mechanics**) if they are to get the phone app.\n\n## How to...\n\n### Invite an office colleague\n\n1. Go to **HR > Team & logins** and press **Invite a colleague**.\n2. Type **Their name**. If they are already here - say, a driver who will also plan - use the same name and the login is added to that same person.\n3. Type **Their email**. If they already use TransportInsight with this email, they join with that password.\n4. Either tick **Make them a company admin (sees everything, can invite people and change access)**, or choose **What they can see** (below).\n5. Press **Make invite code**. Until you have given them a name, an email and something they can see, a note says what is **Still to fill in**.\n6. A code appears. Press **Copy code**, or **Copy a ready-made message** to paste into an email, text or WhatsApp. The code works once, until the date shown. It is only shown now - if it is lost, make a new one.\n7. Your colleague opens the app, chooses **Join a company** on the sign-in screen, enters the code, their email and a password of at least 8 characters that isn't one of the common, easy-to-guess ones.\n\nUntil they join, they appear under **Invited - not joined yet**, with who invited them and when the code expires. Press **Cancel invite** to withdraw it.\n\n### Choose what each person can see\n\nThe sections are:\n\n| Section | Covers |\n|---|---|\n| **Operations** | Route Builder, Jobs, Catch up, Bulk changes, Planning and Trailer boards |\n| **Fleet** | Vehicles & trailers, Compliance & VOR, Trackers |\n| **HR** | Staff files, Drivers, Holiday calendar, Hours clocked |\n| **Pay** | Pay schemes, what drivers and mechanics are paid, the £ on hours clocked |\n| **Customers** | Customers, Places, Subcontractors |\n| **Workshop** | Bookings, Job cards / Repairs, Workshop board, Mechanics, Outside firms, Defect reports |\n| **Money** | Invoicing, Credit control, Costs & rates, Actual costs |\n| **Insights** | Insights - findings, map, what if, explore |\n| **Imports** | Imports |\n\nTick the sections one by one, or press a quick pick first and adjust the ticks afterwards:\n\n- **Manager** - everything except Settings and Team & logins.\n- **Transport manager** - Operations, Fleet, Customers and HR; no pay or money.\n- **Planner** - Operations, Customers and Fleet; no pay, money or Insights.\n- **Workshop** - Workshop and Fleet.\n- **Accounts** - Money, Pay, Customers, Insights and Imports.\n- **HR** - HR and Pay.\n\nHover over a pick to see what it includes. A new invite starts with nothing ticked, so nobody gets Money or Pay by accident.\n\nTo change someone already on the team, find them under **People with a login** and tick or untick under **Can see**. Each tick saves at once and their screens change on their next click. **Settings**, **Team & logins**, **Tidy up duplicates**, **Activity log** and **Bulk changes** are never ticked - they belong to company admins only.\n\nPay is its own section, separate from HR. Give it to HR and accounts, not to planners or the workshop. Planners always see the £ on jobs and runs they plan; only company-wide totals are kept from logins without Money.\n\n### Make someone an admin, or take access away\n\nOn each person's row (not your own), a company admin sees:\n\n- **Make admin** or **Make office user** - promotes or demotes. You can't demote the last admin.\n- **Reset code** - for someone who has forgotten their password. A one-time code appears, working once for 2 days, with **Copy the message** to pass it on. No email is needed.\n- **Switch two-step off** (then **Yes, switch two-step off**) - for someone who has lost their phone and spare codes.\n- **Remove access** (then **Yes, remove access**) - their access stops on their next click.\n- **Give office access** - for a phone-app-only person who should also use the office screens.\n\nEach person is labelled **Company admin**, **Office user**, **Driver app only**, **Mechanic app only** or **Phone app (driver + mechanic)**, and **Two-step on** where it is set up.\n\n### Give a driver the phone app\n\n1. Go to **HR > Drivers** and open the driver.\n2. In the **Driver app** section, type their email and press **Give app access**.\n3. A code appears. Press **Copy code** or **Copy a ready-made text** and send it by text or WhatsApp. It works once.\n4. The driver opens the app, chooses **Join a company** and enters the code.\n\nThe **Driver app** column on the Drivers list then shows **Invite sent**, and **On the app** once they have joined. If you make a new code, it cancels the old one (the button reads **Make a new code**).\n\nA driver's phone login opens the phone app only - their runs, steps, tickets and walk-around checks - and cannot open any office screen. Chapter 11 covers what they see.\n\n### Give a mechanic the phone app\n\nGo to **Workshop > Mechanics**, open the mechanic and press **Give app access** in the same way. Send them the code; they choose **Join a company** and enter it. A person who is both a driver and a mechanic has one login and switches between **My day** and **Workshop** inside the app. Chapter 12 covers the mechanic app.\n\n### Set up two-step sign-in for yourself\n\nTwo-step sign-in asks for a 6-digit code from an app on your phone after your password, so a password alone can't get anyone in.\n\n1. Press **Your login & security** at the bottom of the menu.\n2. Press **Set up two-step sign-in** and follow the steps on screen - add the account to an authenticator app on your phone.\n3. Type the **Code from the app** and press **Switch it on**.\n4. You are shown spare codes. Press **Copy them** or write them down, then **I've saved them**. They are for the day you lose your phone.\n\nTo turn it off or move it to a new phone, open **Your login & security** again, type a code from the app, and press **Switch two-step sign-in off**.\n\n### Make two-step compulsory\n\nOn **Team & logins** (or **Settings > Security**), the **Two-step sign-in** card has a **Compulsory for** box:\n\n- **Nobody - each person's choice**\n- **Company admins**\n- **Every office login**\n\nChoose one. It applies from each person's next click: anyone affected who hasn't set it up can't do anything else until they have. Phone-app logins (drivers and mechanics) aren't affected.\n\n### Decide whether TransportInsight support can look at your company\n\nOn **Settings > Security**, the **TransportInsight support** card controls support access.\n\n1. **Let TransportInsight support look at our company when helping us** is a tick box. With it on, support can read - not change - when you have asked for help.\n2. To let them make changes, choose a number of hours under **Let support make changes for** (1, 4, 8, 24 or 72) and press **Allow**. Press **Stop now** to end it early.\n3. **Recent support visits** lists each visit: when, who, what and why. Visits are also on the **Activity log**.\n\n## Good to know\n\n- **One person, many roles.** A driver who also plans, or a mechanic who also does the books, is still one person with one login. Use the same name when you invite them.\n- **Removal is immediate.** Access is checked on every click, so removing someone works at once - they don't stay in until their sign-in expires.\n- **Phone logins are walled off.** Drivers and mechanics can never reach office screens, even by typing an address. Give **Give office access** only to someone who really needs it.\n- **A one-man band has no team.** If you chose \"Just me - I drive too\", Team & logins is out of the menu, and the set-up guide doesn't ask you to invite anyone.\n- **Everything is logged.** Sign-ins and changes to pay, invoices, access, clocking and settings appear on the **Activity log**. Nobody can edit or delete it.\n\n## When something goes wrong\n\n- **\"Only a company admin can invite people or change who has access.\"** - ask an admin.\n- **Still to fill in: their name, their email, what they can see** - the invite button stays off until all three are done.\n- **Someone can't sign in.** Make them a **Reset code**. If it is two-step that has locked them out, use **Switch two-step off** on their row. They can also use **Forgotten your password?** on the sign-in screen, or **Other sign-in help**.\n- **\"You haven't got access\"** for a colleague - tick the missing section under **Can see**.\n- **The invite code was lost.** Make a new one; the old code stops working.\n- **Phone-app person can't see office screens** - that is by design. Press **Give office access** on their row if they need them.\n"}, {"id": "pricing-a-load", "n": 5, "title": "Pricing a load", "md": "# 5. Pricing a load\n\n## What it's for\n\nBefore you say yes to a load, you want to know what it will really cost you and what you will keep. **Route Builder** works out the road miles, every cost, the profit and the rate you would need to hit your targets. It recalculates as you type, so you can try different rates, vehicles and drivers in seconds. When the customer says yes, one button saves the quote as a job.\n\nThis chapter also covers the **Price list** (your standard prices, and each customer's own), the different ways a job can be priced (per tonne, per mile, day hire and so on) and how day hire works.\n\n## Before you start\n\n- Your **Costs & rates** should be filled in (fuel price, distance bands, your target margin and profit). Chapter 2 covers this. Every quote follows them.\n- Your vehicles should have their running costs, and your drivers a pay scheme. A vehicle marked **needs details** or a driver with **no pay scheme** will give a quote that looks better than the truth.\n- The customer should exist on the **Customers** page, or you can add one from the quote itself.\n\n## How to price a load\n\n1. Open **Operations > Route Builder**.\n2. Check the **Date** at the top. Pick the **Customer**, or choose **+ New customer…** to add one without leaving the page.\n3. Under **Where**, type the **Collection postcode** and the **Delivery postcode**. You can type a postcode, or start typing the name of a saved place. The road route is looked up as soon as both postcodes are complete, and the miles appear in the **Miles** box. The small line beside it tells you whether they are road miles or a straight-line estimate.\n4. If you want to, type a **site name** under each postcode. Start typing and the app offers your saved sites. The ⇅ button swaps collection and delivery.\n5. Under **Who does it**, pick the **Vehicle**:\n   - **Fleet average** if you don't know yet. The quote uses the average of your fleet. This is the honest way to price a load before it has a vehicle.\n   - A named vehicle, which shows its miles per gallon. One that is off the road says **OFF ROAD**.\n   - **Subcontract this load…** if you will give it to another haulier. Then choose the **Subcontractor** and type **Their price (£)**.\n6. Pick the **Driver**: **Fleet average** (the average of what each of your drivers would be paid for this job), a named driver, or **Type the driver cost…** if you want to enter a figure yourself. For a night away, set **Nights out**.\n7. Under **Rate**, type **Rate you'd charge (£)**. The answer on the right updates straight away.\n8. Read the answer. The big figure is **Profit** (or **Cost to run** until you enter a rate), with the margin. Beside it you will see **Total cost**, **Miles** with the driver's time, and a **Route score** out of 100.\n9. When the customer agrees, press **Save as job** at the bottom. The job appears on the **Jobs** page, ready for Planning.\n\n### Reading the answer\n\n- **Where the money goes** shows each cost as a bar and a list: fuel, driver, the vehicle's fixed daily cost, maintenance, tyres, idle fuel and (for a subcontracted load) the subcontractor. Open **How the driver cost is made up** to see each line of the driver's pay.\n- **For a 15% margin** and **For £50 profit** (your own targets) show the rate that would give you that. Press **Use this rate** to put it in the Rate box. It says **In use** when you are already at it. If the customer has a minimum, **Customer's minimum** appears too.\n- **Ways to make it pay better** lists changes with the pounds each would make. Nothing is changed for you.\n- **Backload** says whether there is likely to be return work near the delivery point: strong, possible, weak or unknown. It looks at jobs you have done starting near there.\n\n### Changing the assumptions\n\nOpen **Costing assumptions** to change how the cost is worked out:\n\n- **Costing profile**, if you have more than one.\n- **Driving time**: **Band speed**, **Map drive time** or **Type it**.\n- **Loading / waiting (h)** and **Engine idling (h)**.\n- **Adjust MPG for the distance band**.\n- **Diesel (£ per litre)**, if you want to try a different price.\n- **Vehicle's daily fixed cost**: **All on this load**, **Shared across loads** (then say how many loads share the day) or **Leave it out**.\n- **Backload**: leave it on Automatic, or set it yourself.\n\nOpen **Job details** to add the collection and delivery addresses, the customer's order or PO number, site instructions, what the job needs (a tail-lift, for example), the height clearance and notes. These are saved with the job.\n\n### Sending the quote to the customer\n\nPress **Copy quote**, then paste it into an email. It says who it is for, the date, collection, delivery, distance, their reference and the rate plus VAT. It never contains your costs or margin.\n\n### Quoting something you have quoted before\n\n**Recent quotes** at the bottom lists your last eight. Press **Load** to bring one back into the form. On any job, **Quote again** (in the job panel) opens Route Builder with its postcodes, customer and rate filled in.\n\n## Other ways a job can be priced\n\nUnder **Rate** you can change **Priced** from a fixed price to:\n\n| Choice | What you type | Total |\n|---|---|---|\n| **Fixed price** | **Price (£)** | The price |\n| **Per tonne** | **£ per tonne** and **Tonnes** | Rate times tonnes |\n| **Per unit** | **£ per unit** and **Units** | Rate times units |\n| **Per mile** | **£ per mile** (and **Miles**, or leave it blank to use the job's own miles) | Rate times miles |\n| **Per hour** | **£ per hour** and **Hours** | Rate times hours |\n| **Day hire** | The day rate, and **Full day** or **Half day** | One price for the hire |\n| **Free of charge (FOC)** | Nothing | £0 |\n\nThe total shows underneath as you type. A per-tonne job with no weight yet shows **Total once the weight is in**, and it appears as \"no rate\" on **Catch up** until you enter the weight from the ticket.\n\nA **Free of charge** job never goes on a backing sheet or invoice.\n\n### Day hire\n\nDay hire is a charge type like any other. One price covers a full or half day, and it can cover any number of jobs that vehicle does that day. If you do not do day hire, you can switch it off in **Settings** and it stops appearing.\n\n- On **Add jobs**, pick **Day hire** as the charge type. Postcodes are optional. You can put the sites on later. Choose **Jobs on each hire** (how many loads the vehicle does that day) and, when it is more than one, **On the invoice**: **On one job (rest not charged)**, **Split across the jobs**, or the customer's usual way.\n- Each customer can have their own day and half-day rates on their **Customers** page. When you pick day hire for that customer, the price fills in for you.\n- On an existing hire, open any of its jobs. The **Day hire** section lists every job on the hire and each one's share. **Add another job to this hire** adds a job to it. If the customer has overtime terms, type **Hours worked** and press **Add overtime**.\n\n## The Price list\n\nUse the **Price list** to write down what you normally charge, so that adding jobs is quicker and consistent.\n\n1. Open **Customers > Price list** for your standard prices.\n2. Press **Add a price**. Under **What it's for**, type it in your own words (for example \"Skip exchange\" or \"Muck-away\"). Add **Size or material** if it matters.\n3. Choose **How it's priced** and type the **Price (£)**. For per-tonne, per-mile and per-hour prices you can add a **Minimum charge (£, optional)**: a job that works out at less is charged this.\n4. If you know what it costs you, type **What it costs you (£, optional)**. The list then shows your margin.\n5. To make it the price for one particular run, fill in both ends under **A run (optional)**. It is then offered with the customer's usual jobs.\n6. Under **Waiting time (optional)**, set **Free minutes** and **Then (£ an hour)**.\n7. Choose the date it **Starts**, then press **Add price**.\n\nA customer's own prices are on their **Customers** page under **Their prices**. Where they have one for the same thing, theirs is used instead of the standard price. When you add a job for that customer, their prices and usual jobs appear as buttons under **Their usual jobs and prices - click to fill in**.\n\nTo change a price, press **Change**, set the new price and the date **New price starts**. To raise or lower everything, press **Put prices up (or down) by %**. To stop offering a price, press **Stop** and confirm with **Stop offering it - sure?**. **Show old prices** shows the history.\n\n## Good to know\n\n- **The quote and the saved job use the same sums.** When you press **Save as job**, the app works the figures out again. It never trusts the numbers on the screen.\n- **A quote is costed on today's figures.** A quote you save keeps the figures it was costed on. A job that is on a run on the Planning board is costed as its share of that vehicle's day, and that is worked out again when the vehicle's costs, miles per gallon, the fuel price or the run change. The job panel says so under **How it was costed**.\n- **Price changes never touch booked jobs.** A new price starts from the date you give. Jobs already booked keep theirs.\n- **A job can be saved with no rate.** It is flagged \"no rate\" so it shows up on **Catch up** and is held back from invoicing until a price is on it.\n- **Your quote is only as good as your set-up.** If vehicle or driver costs are missing, the answer warns you.\n\n## When something goes wrong\n\n- **\"Choose a customer to save this as a job\"**: pick the customer at the top of the page.\n- **\"Enter both postcodes first\"** or **\"Both postcodes need to be found\"**: check the postcodes for typos. If a postcode is new and the app cannot place it, type the **Miles** yourself. They show as **Typed in**, and **Use road miles** takes you back.\n- **\"Choose the subcontractor\"**: you picked **Subcontract this load…** but not who.\n- **\"Not all the costs are set up yet, so this profit is too high\"**: the answer lists what is missing, for example a driver with no pay scheme. Fix it on **Drivers** or **Vehicles & trailers**.\n- **\"Price changed - jobs already booked keep their old price\"**: this is just a reminder, not an error.\n- **A percentage rise is refused**: it must be between -50 and 100, and not 0. Running a rise twice raises prices twice, so the app asks you to press the button a second time.\n"}, {"id": "jobs", "n": 6, "title": "Jobs", "md": "# 6. Jobs\n\n## What it's for\n\nA job is one load: collect here, deliver there, for this customer, at this price. Every job, past, planned and cancelled, lives on the **Jobs** page with its revenue, cost and profit. This chapter covers adding jobs, finding them, the job panel (where you change a rate, record a delivery, add extra charges or print a consignment note), cancelling, giving a load to a subcontractor, and what to do when a load goes wrong on the day.\n\n## Before you start\n\n- Your customers, vehicles and drivers should be set up (chapters 2 to 4).\n- If you price from a list, fill in the **Price list** first (chapter 5). It makes adding jobs much quicker.\n\n## How to add jobs\n\nYou can add jobs from **Operations > Jobs** (**Quick add job**), from the Planning board (**+ Add job** in the Unplanned list, which starts on the day you are looking at), or by saving a quote from Route Builder (chapter 5). Imports (chapter 3) bring in jobs in bulk.\n\n1. Press **Quick add job**. The **Add jobs** panel opens.\n2. Choose the **Customer**. You can search by name or account code. The **Date** is the day of the job (it says **Starting** when you are adding a pattern).\n3. Once a customer is chosen, **Their usual jobs and prices - click to fill in** appears. Click one and the postcodes, sites, last price and site instructions fill in. Price list lines appear here too.\n4. Fill in the **Collection postcode** and **Delivery postcode**, and the **Collection site** and **Delivery site** if you want names. Road miles are looked up from the postcodes. Type **Miles (optional)** only if you know the real figure.\n5. Set how it is priced (see chapter 5), and add the **Customer's order ref** if there is one.\n6. If you already know who is doing it, choose the **Vehicle** and **Driver**. If you pick a vehicle, the job goes straight onto its run for the day. Leave both on **Not yet known** to plan it later.\n7. Add **Site instructions** (the driver sees these), and what is being carried under **Goods (optional)** and **Gross weight, kg (optional)**.\n8. Under **How many**, choose:\n   - **Just this one**.\n   - **Several on this date**: type **How many on that date**.\n   - **Every day**: type **For how many days**. Tick **Include Saturdays and Sundays** if you want them.\n   - **Weekly pattern**: tick the days of the week and set **For how many weeks** (up to 52).\n9. A note underneath says how many jobs it will make. Press **Add job** (or **Add 20 jobs**).\n\nAt most 400 jobs can be made in one go. Day hire works a little differently: see chapter 5.\n\n### Just added\n\nStraight after adding, **Just added** lists the jobs you made. Tick some and use **Move to** with **Change date of selected** to re-date them, or **Take selected back out** to remove them. Jobs that are already planned or invoiced are left alone and the message says so. **Add more like this** starts again with the same details.\n\n## How to find jobs\n\nOn the **Jobs** page:\n\n1. The **From** and **To** dates at the top set the window. It starts a month back and two weeks ahead. If nothing is in the window the page tells you where your newest job is and offers **Show the six weeks up to then**.\n2. Type in the search box. You can search by customer, account code, postcode, plate or driver. Every word you type must appear somewhere on the job, so \"YSH01 287071\" finds that customer's job 287071.\n3. Press **Filters** to narrow by **customer**, **vehicle**, **driver**, **Status** (Unplanned, Planned, Cancelled, No rate, Not costed, Losing money, Invoiced, Not invoiced yet), **Revenue £** range and **Margin %** range. **Clear filters** resets them.\n4. Click a column heading to sort.\n5. On the Planning board, **Ctrl K** (or the **Find a job** button) searches every job from anywhere.\n\n### What the Status column means\n\n**Unplanned**, **Planned**, **Subcontracted**, **On the road**, **Delivered**, **Done (imported)** (history brought in from your old system) and **Cancelled**. An invoiced job also shows its invoice number.\n\n### Doing things to many jobs\n\nTick the box on each row, or **Tick all** (it ticks only the jobs shown). Then you can:\n\n- **Cancel ticked jobs**, then **Yes, cancel 4 jobs** (or **Keep them**).\n- **Mark delivered…**.\n- **Download these for Excel**. It downloads the ticked jobs, or all those shown if none are ticked.\n\nFor changing something on lots of jobs (sites, needs, rates), company admins have **Bulk changes** (chapter 27).\n\n## The job panel\n\nClick any job and its panel opens beside the list. Use the up and down arrow keys to move to the next or previous job. You can also open it from the Planning board.\n\nFrom the top, the panel shows the route, miles, vehicle and driver, order reference, site instructions, what the job **Needs**, and **Created by** (Quote, Import or Quick add). Under **Money** you see the **Rate**, **Cost** and **Profit** with the margin. **How it was costed** breaks the cost into fuel, driver, fixed cost and so on. For a job that is on a run, the cost is its share of that vehicle's day.\n\n### Changing the rate and the order reference\n\n**Rate & references** is always open on the job. Change anything and it saves when you click away, with a tick and the time. Every rate change is kept: **Show rate history** says who changed what. Once a ticket is in, a **Delivery ticket** box appears too.\n\nIf the job is on an issued invoice it shows **Locked - on INV...**. A company admin can press **Unlock to correct it…** and give a reason. It is kept on the job, and it re-locks at midnight or when you press **Lock it again**. An invoice that has gone out does not change. If the money is wrong, raise a credit note (chapter 23).\n\n### Progress: recording what happened\n\n**Progress** lists the steps (arrived at collection, loaded and left, arrived at delivery, delivered) with their times. If the driver uses the phone app, these fill in by themselves. If a driver rings in instead:\n\n1. Check the **When** box. It starts at the time now. For a job from an earlier day you must type the time.\n2. Press the button, for example **Mark \"Arrived at collection\"**.\n3. When you get to delivery, type the **Delivery ticket number** and **Signed for by (name, optional)**.\n\nIf the driver phones to say \"it's delivered, ticket T-1001\", use **It's delivered - skip to the end**. The steps in between then read \"time not given\", and waiting time and demurrage leave the job out. If you find the real time later, use **Add the time**.\n\n**Step back** takes the last step off if you tapped by mistake. A job cannot be stepped before an issued invoice. You can still change a ticket number afterwards with **Change** next to **Delivery ticket**.\n\nJobs brought in from your old system say **Done (imported)**. They are records of work already done, so there are no steps to mark.\n\n### Waiting time and demurrage\n\n**Waiting time** shows how long the vehicle waited at collection and delivery. If you have a tracker on the vehicle, the time comes from the tracker (it also shows queueing time and where the driver's own taps differ). Otherwise it comes from the driver's taps.\n\nTo charge for it, the customer must have waiting time ticked and a £ per hour rate on their **Customers** page. Then press **Add demurrage**.\n\n### Extra charges\n\nUnder **Extra charges**, pick the charge type, type the **Amount**, add **What for (optional)** and press **Add charge**. The ✕ removes a charge that is not yet invoiced. A charge added after its job was invoiced goes on the customer's next backing sheet.\n\n### Photos, goods and the consignment note\n\n**Photos** shows the loading and delivery photos from the driver and lets you add a scanned paper ticket. **Goods and consignment note** records what is carried (what it is, packages, weight, dangerous goods). **Consignment note (PDF)** prints it with the proof of delivery and the receiver's signature. If you work internationally, turn that on in **Settings** and a job can print as **CMR note (PDF)** with the extra boxes.\n\n### Needs\n\nUnder **Needs**, tick what the job needs, such as a tail-lift or a qualified driver. Only a vehicle and driver that have it can take the job. The Planning board warns if you put it on a run without it, and Optimise day never offers it to one.\n\n### Moving a job\n\nUnder **Instructions, notes and date** you can edit the instructions (the driver sees them) and office-only notes. **Move to** with **Move date** puts the job on another day, with the same vehicle and driver. **Move to run** puts it onto another vehicle's run that day without dragging. A split load can only be moved from the Planning board.\n\n### Copy, re-quote, reinstate\n\n- **Copy to a new job** starts Add jobs with this job's customer, lane and rate. Use it for repeating a job.\n- **Quote again** opens Route Builder with its details.\n- **Reinstate job** brings back a cancelled job. If it was on a run, it goes back on it.\n\n## Cancelling a job\n\n1. Open the job and press **Cancel job**.\n2. Read the question. It says the job comes off its run and won't be invoiced.\n3. Press yes.\n\nIf the customer cancelled after you had already set off or loaded, do not simply cancel. Use **Something's gone wrong** (below), which lets you charge for it. If the vehicle is off the road, the app asks once whether that is why you are cancelling. Say yes only if it is, because a \"yes\" is counted as money lost to the breakdown in your reports. If the job is on a run already sent to a driver, the message reminds you to ring the driver.\n\n## Giving a load to a subcontractor\n\nUse this when you will not run the load on your own vehicle.\n\n1. Open the job and press **Give to a subcontractor** (or press **Subcontract** on a card in the Planning board's Unplanned list).\n2. Choose the **Subcontractor**, or **+ Add a new subcontractor…**. Type the **Agreed price (£)**: what you will pay them. If you have used a subcontractor on this lane before, **Paid before on this lane** lists what you paid. Click an amount to use it.\n3. Add **Notes for them**. They go on the load sheet.\n4. Check the figures at the top: **Customer pays**, **On your own vehicle** (estimated cost) and **You keep**.\n5. Press **Give to** the subcontractor. The load comes off any run, gets **your** order number, and its cost becomes the agreed price.\n6. Press **Email the load sheet**. Your own email program opens with the message filled in, and the load is marked as sent. You can also use **Load sheet PDF**, **Copy the details (for WhatsApp / text)**, or **I sent it another way**.\n\nThe load sheet shows the sites, date, booking reference, needs, instructions and your price. It deliberately never shows your customer's name or your rate.\n\nWhen they have delivered, open the load and press **They've delivered it…**, type the time and **Their ticket no.**, and press **Mark delivered**. It is then treated like your own work, so it can be invoiced. If they break down, press **Take back**, say why, and the load goes back to Unplanned for your own vehicles.\n\nThe **Subcontractors** page (under **Customers**) holds their contact details and email (the load sheet goes there), plus loads and spend in the last 90 days. On the Planning board, **More > Subcontracted** lists loads given out for a day or a week, and which have not been sent yet.\n\n## Something's gone wrong\n\nUse this when a load goes wrong on the day: refused at the gate, redirected, a wasted journey. You do it from the Planning board.\n\n1. On the Planning board, click the job's card once to pick it (it is highlighted). In the Compact view you must switch to Detailed first.\n2. Press the button at the top, which now reads **Something's gone wrong - Northgate Aggregates**.\n3. Under **What's happened?** choose:\n   - **Load refused - taken back**\n   - **Delivering somewhere else**\n   - **An extra drop**\n   - **Part of the load rejected**\n   - **Nothing to collect (wasted journey)**\n   - **Loaded, then cancelled**\n   - **Can't tip (site shut, no access)**\n   - **Overweight - to a weighbridge**\n   - **Damage or an accident**\n   - **Something else**\n4. Fill in what it asks for: a place and postcode, how much was rejected, extra time in minutes, and notes (the driver sees them).\n5. Look at the suggested charge. The app works out extra miles and suggests a charge from the job's own rate per mile, plus extra time at the waiting rate. Change it to what was agreed, or put 0 for no charge. For **Nothing to collect** and **Loaded, then cancelled** the job's price becomes this figure (not added on top) and the job is marked done.\n6. Press **Save and tell the driver**.\n\nThe driver's phone shows the change until they tap **Got it**, and you can see whether they have. If you choose **Can't tip** and then **Back to the yard - split the load**, the button reads **Save, then split the load** and takes you on to the split (chapter 9).\n\nWhich kinds are offered and how each suggests a charge is set in **Settings**, under Planning board. If none are switched on, the panel says so.\n\n## Good to know\n\n- **An invoiced job is locked.** You cannot cancel it and changing its rate needs an admin to unlock it. The message names the invoice.\n- **Recording something twice adds a second charge.** The panel warns you if the same kind of change is already recorded on the job.\n- **A job needs a customer.** An inactive customer takes no new jobs.\n- **Prices and miles have sensible limits.** A price over £100,000, or a count of jobs that is not a whole number of 1 or more, is refused with a message.\n- **A job with no rate is not lost.** It shows **no rate** until you price it, and it is held back from invoicing.\n\n## When something goes wrong\n\n- **\"Locked - on [invoice number]\"**: the job is on an issued invoice. See chapter 23.\n- **\"Still saving - try again in a second.\"**: the board is saving your last move.\n- **No postcode found for a job**: the job shows **No route**, or a \"?\" on the Planning board. Fix the postcode on the job so empty miles can be counted.\n- **Cannot step a job back**: it is on an issued invoice. Credit it instead.\n- **How many has to be a whole number, 1 or more**: fix the count in Add jobs.\n"}, {"id": "planning-board", "n": 7, "title": "The Planning board", "md": "# 7. The Planning board\n\n## What it's for\n\nThe **Planning board** is where the day gets planned. Each vehicle has a row, called a lane. A run is one vehicle, one driver and an ordered list of jobs for one day. You drag unplanned jobs onto vehicles, put them in order, and watch the empty miles, the day's profit and the driver's hours update as you go. Everyone in your office sees the same board, and changes appear on each other's screens within a few seconds.\n\n## Before you start\n\n- Vehicles, drivers and your yard (with its postcode) must be set up. If the yard has no postcode, the board says so, because empty miles to and from the yard cannot be counted. Add it on **Customers > Places**.\n- Jobs must exist for the day (chapter 6). Jobs with no vehicle appear in the **Unplanned** list on the right.\n\n## The screen\n\nOpen **Operations > Planning board**.\n\n- **Top bar**: the arrows ‹ and ›, the date box and **Today** move between days. A summary shows runs, jobs planned, unplanned jobs, revenue planned, empty miles and **day profit**.\n- **Live** badge: it turns to **Updated by a colleague** when someone else changes the day. Initials show who else is looking at the board.\n- **Compact | Detailed | Map**: three ways to see the same day. Your choice is remembered on this computer.\n- **Hide idle vehicles**: hides vehicles with no work.\n- **Find a job** (**Ctrl K**): searches every job.\n- **Something's gone wrong**: see chapter 6.\n- **Send to drivers**: see chapter 10.\n- **Optimise day**: see chapter 8.\n- **More**: **Subcontracted**, **Drivers' infringements** (if your company lets planners see them), **Clear draft runs**, and **Every run today…** (set one run pattern on every run at once).\n- **Unplanned** list on the right, and tabs across the top of the lanes if your fleet is split into sections (for example General and Day hire).\n\n## How to plan a day\n\n1. Go to the day. Look at the **Unplanned** list. Jobs from earlier days that were never planned appear under **Earlier - still not planned**. Use the box beside **Include older jobs** to choose **This day only** or add the last 3, 7 or 14 days.\n2. Drag a job card from the list onto a vehicle's lane. If the vehicle has no run yet, one is made for it. The driver is the vehicle's usual driver if it has one, otherwise the last driver it had.\n3. To put the job in a particular place in the run, drop it where you want it. A marker shows where it will land.\n4. Or click the vehicle first, then press **+ DE24 MOH** on a job card. This adds it to the end of that run.\n5. Between jobs, a number in miles shows the empty miles: the distance the vehicle runs without a load. Short empty runs show plainly; longer ones turn amber, then red. A mark **≈** means the road distance is still being looked up. A **?** means a postcode could not be placed.\n6. Reorder by dragging a job to another position, or use the ◀ and ▶ buttons on the job.\n7. Choose the **driver** from the drop-down on the lane. Anyone booked off shows **- OFF**.\n8. Press **Suggest order** on a run with two or more jobs. If a different order saves empty miles, you are offered it with the saving: **Use this order** or **Keep mine**.\n9. Click **Draft** to mark a run **Confirmed ✓** (click again to go back to draft).\n\nTo take a job off, press ✕ on it, or drag it back to the Unplanned list. It goes back to Unplanned. To move it to another vehicle, drag it there.\n\nA job with no postcodes (day hire, a yard move) shows its site names instead and counts as the driver's work for the day.\n\n## Picking a job and finding what fits\n\nClick a vehicle to select it. The Unplanned list then re-orders:\n\n- Jobs loading close to where the run finishes come first, nearest first. The distance is set in your planning settings.\n- A job in **pink** with **★ Perfect fit** loads near where the run finishes, tips near where it ends the day (usually the yard) and still fits the driver's day.\n- A job with **Not suggested** needs something the vehicle, trailer or driver does not have.\n\nIf a job would take the driver over their normal day, the button asks twice: **+ DE24 MOH (over their day)**, then **Yes - 11.2 h, add it**. If the vehicle cannot legally go out, the button is greyed and says why. If it is off the road or its MOT has run out, you can still put work on it, but you must confirm and give a reason that is recorded.\n\n## The three views\n\n### Detailed\n\nEach lane shows the vehicle plate and any trailer, a **Draft** or **Confirmed** button, the driver and run pattern drop-downs, and buttons: **Send to driver**, **Suggest order**, **Run details**, **Message driver** and **+ 2nd driver**. Along the lane are the yard, the jobs with the empty miles between, and the yard at the end. The totals show jobs, miles, empty miles and cost, revenue, **Day profit**, **Duty** (the driver's estimated hours) and the **Day score**.\n\nA job block shows the customer, route, miles and rate. Click it once to pick it. Double-click, or press ↗, to open the job. ⇄ splits the load (chapter 9).\n\n### Compact\n\nOne line per vehicle: plate, driver, a **Day** or **Out** button, trailer, then every job as a small pill, then total miles, the score and day profit. Click the row to open it. You then see the controls, a table of the loads with **Empty to it**, **Loaded**, **Time** and **Rate**, the **day score** broken down and **The day's money**.\n\n### Map\n\nThe compact lanes with a map beside them. Click a vehicle and its run lights up, numbered. Blue diamonds are loading sites, green squares are tipping sites. A load that is good for the picked vehicle is amber, and a perfect one is pink. Click a load in the Unplanned list or on the map and the card lists the vehicles it suits best, each with a button such as **saves 8 empty mi** or **+12 empty mi** to put it on in the cheapest place. Lines are straight between stops, but the miles are road miles.\n\n## Day profit, duty and the day score\n\n- **Day profit** is worked out for the run as one vehicle and one driver for the day. Revenue, less fuel, tyres and maintenance for every mile including empty ones, less idling, less the vehicle's fixed daily cost once, less the driver's pay. That is why it can read lower than the profit on the Jobs page, which does not include empty miles. An asterisk means a run has no driver yet, or a vehicle has no daily fixed cost typed in, so the profit reads high.\n- **Duty** is each job's own time plus driving empty. It is shown against the driver's normal day.\n- **Day score** is out of 100: hours out of 40, empty running out of 40, money out of 20. The score tells you what is holding it back.\n- **n runs losing money** in the top bar lists runs below zero.\n\n## Run details\n\nClick **Run details** to open a run. You can:\n\n- Change the vehicle, where it **Starts from** and where it **Finishes at**.\n- Write **Notes for this run**. The driver sees them at the top of the run.\n- Add **Instructions for the driver**, such as \"Collect pallets from the yard on the way back\".\n- Add **Calls partway through the day**: back to the yard empty, or drop one trailer and take another. The empty miles there and on count in the run.\n- **Split load…** (chapter 9).\n- **Remove run**, which puts all its jobs back to Unplanned.\n\n## Nights out (tramping)\n\nEach run has a run pattern. A pattern that does not return to base means the vehicle stays out. Its lane ends with **Stays out** instead of the yard. The next day's run then starts from where the vehicle was left, shown as a blue **At [postcode]** chip with the days since it left.\n\nIn Compact, the **Day** or **Out** button switches a run between going home and staying out. Drivers set as usually staying out get the stay-out pattern by default. Every vehicle shows where it starts the day even before it has a run.\n\n## Second runs (double shifts)\n\nA vehicle can have a run for each driver on the same day. Press **+ 2nd driver** on a lane. The second run gets its own lane marked **2nd run**. Choose its driver there.\n\n## Not running today\n\nFor a vehicle with no work on the day, press **Not running today**. Optimise day leaves it alone and no job can be put on it. Press **Set running** to undo. If the vehicle already has work that day, the app refuses, naming the work. A vehicle that is off the road shows **Off the road** and cannot be switched back on from here.\n\n## Warnings\n\nWarnings show on each lane with ⚠. The ones you will meet:\n\n- **Off the road** or a Red defect: the vehicle cannot go out. Only the repair clears it.\n- **MOT ran out** (with the date): book a test to plan it.\n- **Can't go out**: the run cannot be sent. The message names why, for example a licence out of date.\n- **Over their day** or **Over duty hours**: the estimated hours are over the driver's normal day, or over the legal duty warning.\n- No legal date on file: shown once for the day, because imported fleets often have none. It is a warning, not a block.\n- A job needing something the vehicle or driver does not have.\n- **Can't legally run - overridden**: someone planned it anyway and gave a reason.\n\n## Good to know\n\n- **Moves are instant, saves follow.** When you drag, the board updates at once and saves in the background. If a move is refused, the board snaps back and tells you why.\n- **Two planners at once is fine.** If a colleague changes the same day, you see it within seconds.\n- **A job is on one run at a time.**\n- **A run already sent to a driver** shows **Sent** and, if you change it, **Changed – send again** (chapter 10).\n- **Imported history** appears as **Imported** runs for earlier days. Optimise day leaves them alone.\n- **Holidays and workshop bookings** take people and vehicles off the board for those days.\n\n## When something goes wrong\n\n- **\"Still saving - try again in a second.\"** Wait a moment and repeat.\n- **A refusal on a move** names the reason (for example the vehicle is not running, or a Red defect). Fix that and try again.\n- **A \"?\" between jobs**: a postcode could not be placed. Open the job and correct it.\n- **Ring the driver now**: a red box listing runs already on drivers' phones that now cannot go ahead, with the driver's phone number. Ring them.\n- **No vehicle has work on this day yet**: untick **Hide idle vehicles**.\n"}, {"id": "optimise-day", "n": 8, "title": "Optimise day and Plan everything", "md": "# 8. Optimise day and Plan everything\n\n## What it's for\n\n**Optimise day** shares out a day's unplanned jobs across your fleet in one go, with as few empty miles as it can manage. It never changes anything until you have reviewed the proposal and pressed the button. **Plan everything** is the thorough version: every job goes on the plan, even if that means a driver going over their hours, and it tells you where it had to bend.\n\n## Before you start\n\n- Jobs for the day should be in the Unplanned list, with postcodes.\n- Vehicles need drivers who can be used. Vehicles off the road or due in for MOT, drivers booked off, and vehicles set **Not running today** are never used.\n- Jobs that need something (a tail-lift, a qualified driver) only go to a run that has it. Set job needs in chapter 6.\n\n## How to optimise a day\n\n1. Open the Planning board on the day you want. If the fleet is split into sections, pick a section tab first: the button then reads **Optimise day (General)** and acts on those vehicles only.\n2. Press **Optimise day**. The panel opens.\n3. Choose **How to plan**:\n   - **Quick**: a fast first go that keeps to every limit.\n   - **Thorough (up to 15 s)**: looks harder, moving jobs between vehicles and into the middle of runs.\n   - **Plan everything**: see below.\n4. Choose **What can it change?**\n   - **Fill the gaps**: puts unplanned jobs on vehicles with time to spare. Runs already on the board keep their jobs.\n   - **Re-plan draft runs**: takes the jobs off every draft run and plans them again with the unplanned ones. Confirmed runs, imported runs and runs already sent to drivers are left exactly as they are. The panel always opens on **Fill the gaps**, so you never re-plan by accident.\n5. Choose **Jobs to plan**: **This day**, **+ last 3 days**, **+ last 7 days** or **+ last 14 days**.\n6. For Quick and Thorough, choose **Aim for**: **Fewest empty miles**, **Balanced** or **Most profit**.\n7. Set **Furthest to drive empty to reach a job**, in miles, or tick **No limit**.\n8. Press **Work it out**. (For Plan everything the button says **Start planning**.)\n9. Read the proposal (below). When you are happy, press **Put 12 jobs on the board**, or **Use this plan** in re-plan mode.\n\nA banner on the board then says what was done, with an **Undo** button that puts everything back as it was.\n\n## Reading the proposal\n\nAt the top are the numbers: jobs planned out of how many there were, runs, **Day profit** with the change on now, **Empty miles** against now, and the **Average day score**.\n\nEach run is listed with its vehicle, driver and jobs in order, with the empty miles between them. Pills tell you:\n\n- **New run**, **Adds to run** or **Rebuilt**.\n- **Spare driver**: the vehicle's usual driver is not free, so a driver who has driven recently and is free is suggested.\n- **Over 10 h** or **Past the duty warning**: the driver's day is too long.\n- **Long empty drive** and **Loses money**.\n- **Needs a driver**: no driver is free for this vehicle.\n\nIn Fill mode, untick a run's box to leave it out. If any run loses money, the button is no longer highlighted and says how many, so you look before accepting.\n\n**n jobs not planned** (a drop-down at the bottom) lists every job left out, grouped by reason, and which vehicles were in the way. **n vehicles not used** says why each was skipped. Jobs with no postcodes (day hire, hook-ups) are never placed for you: you put
