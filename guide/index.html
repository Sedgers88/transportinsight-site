day. **Time (optional)** and **Until (optional)** are for when you know the hours.\n6. Choose where: **Our workshop**, **Test centre** (type its name) or **Outside firm** (pick the firm - add garages and tyre firms on the **Outside firms** page).\n7. Pick **Mechanics**, any number. If none are set up the box says so. They can be on other bookings at the same time.\n8. Leave **Take it off the Planning board** ticked if the vehicle will not run. Untick it for a booking that does not stop it working.\n9. Add notes, then press **Book it in**. If a box is missing, the button says what: for example \"Choose what it's for first\".\n\nThe result tells you **Booked in**. If work was already planned on those days, a warning lists **Already planned on those days:** with a link to the Planning board so you can move it.\n\nAn **MOT** booking also records the test centre and marks the vehicle as booked on the MOT plan (chapter 14). A booking runs for 60 days at most. The last day cannot be before the first.\n\n### Working a booking\n\nClick a booking to open it. You see what, when, where, mechanics, whether the vehicle still shows on the Planning board, the notes, who booked it and the checklist.\n\n- **It's in** - the vehicle has arrived.\n- **Mark done…** - asks for **Mileage now** (for a vehicle; the dashboard reading, which the next service by miles is worked out from), the checklist (**tap each: ✓ done, ✗ needs work**; **Tick the rest as done** saves time) and done notes. Then **It's done**. A booking marked done moves the due date on. If something needs work and there is no job card, the app suggests making one after.\n- **Make a job card** - for parts, faults found and clocked time. Once made the button becomes **Job card JC-0004**.\n- **Change days / mechanics** - then **Save changes**.\n- **Cancel booking…** - asks **Why is it cancelled?** (for example \"test centre cancelled\"), then **Cancel the booking**.\n- **Not in yet** - puts an \"in\" booking back.\n\nA booking whose days have passed with no answer shows **Past - did it happen?**. Press **Mark done** (the due date moves on). If it did not happen, change the date or cancel it. Until then it is not counted as booked.\n\nBookings the app made for you (MOT prep days and inspection jobs, set in Settings) show a note: \"Made by the app - give it to a fitter\".\n\n### Checklists\n\nOpen the **Workshop rates** tab on **Job cards**. Under **Checklists**, choose a **Kind of work**, edit the list (one item per line) and press the save button. **Undo changes** puts the saved list back. Changes apply to new bookings.\n\n## The Workshop board\n\nOpen **Workshop > Workshop board**. It is hidden if your company uses outside firms only.\n\nEach row is a mechanic. The top lane is the plan: jobs placed on a time. The lane under it is what they actually clocked that day. A key shows the colours for **in the workshop**, **out on site**, **travelling** and **other work (yard, tools…)**. Move between days with **Day before**, the date box, **Day after** and **Today**.\n\nA box **Booked in today, no mechanic on it yet** lists bookings that need someone.\n\nOn the right, **Not on anyone's day** lists open job cards that have no time yet. If there are none it says **Every open job card is on someone's day.**\n\n### How to plan a mechanic's day\n\n1. Drag a card from the right-hand list onto a mechanic's line at the time it should start. Times snap to 15 minutes. Or press **Put on a day…** on a card, pick the day, mechanic, start and how long, then **Put it on**.\n2. To move a block, drag it. Click it to change the **Starts**, **How long** and **Mechanic**, then **Save**. **Open the job card** is there too.\n3. To take a job off the board, open it and press **Take off the board**. It goes back to the unallocated list.\n\nPlacing a card that has no mechanic makes it that mechanic's. Overlaps are refused, naming the clash.\n\nEach row also shows hours planned, \"Not clocked in\" or \"in since 07:58 on JC-0004\", and for jobs out on site, the miles out.\n\n### Booking someone off\n\nPress **Book off…** on a mechanic's row. Choose **All day**, **Morning** or **Afternoon** and give a reason, then **Book off**. It goes on the Holiday calendar (chapter 21), which is the place for several days at once. **Change…** lets you put them **Back on that day**. You cannot book someone off while they have planned work; the message names it.\n\n## Parts & stock\n\nOpen **Workshop > Parts & stock**. The tabs are **Parts**, **Stock**, **Orders**, **To price**, **Categories**, **Locations** and **Advice & trends**.\n\n### Parts\n\nEvery part you use is here with its price, number and category. A part goes on this list the first time it is used. Click one to open it:\n\n- Set its **Category**, **Price each (£)** (used the next time it goes on a card), **Part number** and **Usually bought from**. Running low then puts it on a draft order to that supplier.\n- **Still used** - untick to stop it showing when typing.\n- **Other names it's known by** - add any name or nickname, and typing it on a job card or the phone goes straight to this part.\n- **The same as another part?** - pick the real part and press **Merge them**.\n\n### To price\n\nParts used on job cards with no price. Type a price and press the save button beside it: the price goes on every one of those lines and is used next time. It says \"Priced - 3 lines\" when done.\n\n### Stock\n\nParts you keep on the shelf, by location. Columns show **On hand**, **Keep at least**, **On order** and **Usual supplier**. A part with too few shows **needs ordering**. The filter chooses **Every location** or **Only what's running low**.\n\nPress **Goods in** to book parts onto the shelf: pick the part, how many came in and the price each from the delivery note. Opening a part shows **Adjust** (count it, add or take away, or move it between locations) and a **History** of every movement. Choose **Keep it in stock…** on a part that is not yet kept. Parts you only buy when needed never show on this tab.\n\n### Categories and Locations\n\n**Categories** group parts (for example a tyre) and decide what a new part asks for, such as size and brand. **Words that always ask which one** makes typing \"tyre\" ask which tyre. **Locations** are where stock is kept: the shelves, and a mechanic's own van (parts they fit come from there first). One is the default.\n\n### Advice & trends\n\nAdvice and trends drawn from the parts you use and buy. Open it when you want to see where parts money is going.\n\n## Purchase orders\n\nOpen **Money > Purchase orders** (or the **Orders** tab on Parts & stock). Tabs: **Orders** and **Parts spend** (spend by supplier).\n\nWhen a part drops below its minimum, it goes on a draft order to its usual supplier by itself. Nothing is sent until you check it and press **Raise**. **Order what's running low** makes drafts for everything below its minimum; it tells you if some parts need a usual supplier first.\n\n### How to make an order\n\n1. Press **New order**.\n2. Choose the supplier, or **A new supplier…** and type the name.\n3. Set **Deliver to**, and optionally pick a job card under **For a job card (optional)**. The card then shows the order, and shows as ready to restart once it is all in.\n4. Under **What you need**, add each part (name, number or what it is called), **How many** and **£ each**. Use **Or something that isn't a part on the list** for oil drums and consumables.\n5. Press **Raise the order**, or **Keep as a draft**. Raising gives it an order number.\n6. Press **Email it to them**: it opens your own email program with the order. **Order PDF** makes a copy.\n\n### Booking in a delivery\n\nOpen the order, type how many of each line came in under **Come in** (and the price paid), then press **Book these in**. The order becomes **Part received** or **Received**, stock goes up, and any job card waiting for parts is told. Their invoice can be matched under **Their bill**; if it does not match the order total, the app warns.\n\nAn order can be **Cancel the order…** with a reason. A draft can be binned with **Bin this draft**.\n\n## Workshop invoicing\n\nWorkshop work for outside customers is invoiced on its own run of numbers, starting WS-. It never goes on a haulage invoice and a haulage invoice never carries workshop work.\n\nYou can work from **Job cards > Invoices**, or on **Money > Invoicing** with the **Haulage | Workshop** switch set to **Workshop**.\n\n1. Under **Ready to bill**, each customer with finished cards is listed. Cards that cannot be billed yet say why in the last column. A customer with **no billing address - add it on Customers** needs one first.\n2. Tick the cards to bill (they are ticked by default). The button shows the total before VAT.\n3. Press **Make the invoice**. If the customer already has a draft, the button is **Add to their draft**; **Open their draft** shows it.\n4. Open the draft to check it and issue it. The PDF's second page breaks each card down into labour, travel and each part with its markup.\n5. **Workshop invoices** lists every one with its number and status. Credit control shows them labelled, apart from haulage.\n\nSage 50 export (on Invoicing) is one file for both kinds, each posted to its own sales code.\n\n## Good to know\n\n- **A booking changes the Planning board** for the days it covers, if you leave the tick on.\n- **Work already planned is never moved for you.** The app warns and names it.\n- **A part with no price is never free.** It stays \"needs a price\" until someone prices it.\n- **Orders are not sent by the app.** **Email it to them** opens your own email program and marks the order sent.\n- **A mechanic's day is shared with the Holiday calendar.** Booked off there means off here.\n\n## When something goes wrong\n\n- **\"Already planned on those days\"** after a booking: the vehicle had work. Open the Planning board and move it.\n- **Can't book a mechanic off.** They have planned work that day. The message names it; move or take it off first.\n- **Placing a card is refused for an overlap.** The message names the clash. Choose another time.\n- **Mark done asks for a mileage.** For a vehicle the mileage is needed so the next service can be worked out.\n- **\"Need a usual supplier first\"** after **Order what's running low**. Open the part and set **Usually bought from**.\n- **A mechanic you wanted is missing from the board.** Only active mechanics show; check **Mechanics**.\n"}, {"id": "drivers-and-pay", "n": 19, "title": "Drivers, pay schemes and Hours clocked", "md": "# 19. Drivers, pay schemes and Hours clocked\n\n## What it's for\n\n**Drivers** is the list of the people who drive for you: their pay, licence, CPC and tacho card dates, and their phone app login. **Pay schemes** say how each driver is paid, so that every job and every day on the Planning board is costed with the real wages. **Hours clocked** shows who clocked in and out on their phones, so you can check the day and download the week for payroll.\n\n## Before you start\n\n- You need the **People** section to see the Drivers and Hours clocked screens, and the **Pay** section to see or change pay. Pay is kept apart on purpose, so you can give it to accounts or HR and not to planners (chapter 4). Without Pay access the pay columns and the Pay schemes screen are hidden.\n- Build the pay schemes before you put drivers on them. A driver with no pay shows **No pay set**, and their jobs are costed without wages.\n\n## Pay schemes\n\nOpen **HR > Pay schemes**. The list shows each scheme, who is on it (**Drivers on it**) and whether it is **Shared** or belongs to **one driver**.\n\nA scheme is built from pay lines that add up. Each line is one of:\n\n- **Per day worked** (£ per day)\n- **Per hour** (£ per hour)\n- **Per mile** (£ per mile)\n- **Per job / drop** (£ per job)\n- **Per night out** (£ per night)\n- **Weekly salary** (£ per week)\n- **% of job revenue**\n\nEach line can be limited to **Any day**, **Weekdays**, **Saturdays**, **Sundays** or **Bank holidays**, and to a band of hours using **From hour** and **To hour**. For example, a line of £18 per hour **From hour** 10 gives overtime after 10 hours. A blank **From hour** means from the start, and a blank **To hour** means no limit. A **Label (optional)** helps you remember what the line is.\n\n### How to build a pay scheme\n\n1. Press **New pay scheme**.\n2. Give it a **Scheme name** and a **Description**.\n3. Leave **Shared - other drivers can be put on this scheme** ticked if more than one driver will use it.\n4. Press **+ Add pay line** for each part of the pay. Choose the kind, type the amount, and set **Applies on** and the hours if needed. **Remove line** takes one away. A line with no amount is refused: \"Pay line 2 needs an amount\".\n5. Try it in **Example day - check it pays what you expect**. Choose **Weekday**, **Saturday**, **Sunday** or **Bank holiday**, type **Hours worked**, miles, jobs, **Nights out** and **Revenue (£)**. The **Pay for this day** box shows each line and the total.\n6. Press **Save scheme**. The message is **Pay scheme saved**.\n\nTo change a scheme, click it in the list, edit it and save. To remove one, open it and press **Take off this scheme**: \"Pay already worked out on it stays as it was.\"\n\n## Drivers\n\nOpen **HR > Drivers**. The list shows each driver's status (**Available**, **Off today**, **Inactive** or **needs details**), their pay, **Licence**, **CPC expiry**, **Tacho card**, **Last job**, and whether they are **On the app**, **Invite sent** or an **Office login**. Search with **Search drivers…**.\n\nPay changes are kept as history, so past jobs always cost at the pay that applied then.\n\n### How to add a driver\n\n1. Press **Add driver**. If you are the driver, press **This is me** instead: it makes you a driver as well as an office login.\n2. Type the **Full name**. If someone with the same name is already on the system, add something to tell them apart (the form has a place for it).\n3. Choose a **Pay scheme** from the list, or press **Build custom pay for [name]** to make a scheme for this one driver. Set **New pay applies from** - earlier jobs keep the pay that applied at the time.\n4. Type the **Standard working hours per day**. This is used to share a day's fixed pay across that day's jobs when quoting, and the Planning board warns when a run goes over it.\n5. Under **On the planning board**, tick **Night-out driver - usually stays out** if the driver normally sleeps out. Their new runs then do not go back to the yard, unless the vehicle has its own usual pattern. Drivers whose names include N/O are ticked automatically.\n6. Under **What they can do**, tick the capabilities they hold, from the list in Settings, so jobs that need them can be matched.\n7. Under **Licence & compliance** fill in **Driver CPC expiry**, **Tacho card expiry** and **Licence expiry**. The Planning board warns, and blocks, when a date has run out (chapter 7 and chapter 14).\n8. Press **Add driver**. When editing, the button is **Save**; the message is **Driver saved**.\n\n### Changing someone's pay\n\nOpen the driver, choose another **Pay scheme**, set **New pay applies from** and save. The message says \"Danny is now on 'Standard day rate' from 3 Nov 2026\". Earlier jobs keep the old pay. To change many drivers at once, use **Bulk changes** (chapter 27).\n\n### Giving a driver the phone app\n\nOpen the driver and find **Driver app**. Type their email and press **Give app access**. It makes a one-time code. Press **Copy code**, or **Copy a ready-made text** to paste into a message. They open the link on their phone, choose a password, and their day is there from then on. The code is only shown once; if it is lost, press **Make a new code**, which cancels the old one.\n\n### Active, needs details and leavers\n\n**Active** is ticked while the driver works for you. **Needs details (an import made this)** appears when your import made the driver from a name in a file: untick it once you have checked their details. Do not delete a driver who has left. Record it under **HR > Staff files** (chapter 20), which also ends their login.\n\n## Hours clocked\n\nOpen **HR > Hours clocked**. It shows drivers and mechanics clocking in and out on their phones: when, where and the proof alongside.\n\nUse **Day** or **Week** at the top, and **Earlier**, the date box and **Today** to move about. **Download (CSV - opens in Excel)** saves what is on screen, so you can send a week to payroll.\n\n### The day view\n\nAt the top are four numbers: **In now**, **Clocked in today** (of how many drivers and mechanics), **Hours** and **To look at**. For each person you see:\n\n- when they clocked in and out. **(office)** means someone in the office put the time in. **still in** means they have not clocked out.\n- **Where**: the nearest of your saved places when they clocked in. A link opens the exact spot on a map.\n- **Hours**, and for a driver the vehicle and its miles. **Proof** is the tracker's first and last move of the driver's vehicle that day (when you have trackers).\n- **To look at**: things that need a second look, such as **Forgot to clock out - put the real finish time in**, **Has work on DE24 MOH but didn't clock in**, **Clocked in away from your saved places** and **No walk-around check on DE24 MOH**.\n\n### Correcting a clocking\n\nPress **Change** (or **Add** if they have none that day). Edit **Clocked in** and **Clocked out** (leave it empty if they are still in) and fill in **Why**, for example \"forgot to clock out, left at 17:15\". The reason is kept with the change and shown on the line. **Take it off** removes a clocking. The message says **Saved - with your reason**.\n\n### The week view\n\nOne row per person with each day's hours and a **Total**. With Pay access there is also **Pay (est.)**: the clocked hours through each driver's pay scheme, or a mechanic's hourly rate. It is an estimate to check against payroll, not a payslip. Per-mile parts of a scheme are not in it, because clocking has no miles.\n\nWorking time under the Road Transport Working Time Regulations comes from the tachograph, not from here. Clocking in and out is kept separately and is never the legal record (chapter 14).\n\n## Good to know\n\n- **Pay is a separate permission.** Without it you cannot see pay on Drivers or Hours clocked, or open Pay schemes.\n- **Pay history is kept.** Changing a scheme or a driver's scheme does not change what old jobs cost.\n- **Pay schemes can be shared.** Edit a shared scheme and every driver on it changes from now on. Use **Build custom pay** when only one driver differs.\n- **Standard working hours per day** sets when a run counts as over the driver's day.\n- **Clocking never changes pay.** **Pay (est.)** is a check, not payroll.\n\n## When something goes wrong\n\n- **\"Pay line 2 needs an amount.\"** Fill in the amount or press **Remove line**.\n- **A driver shows \"No pay set\".** Open them and choose a **Pay scheme**.\n- **Hours shows \"No pay scheme or hourly rate set\".** Give the driver a pay scheme, or the mechanic a rate on **Mechanics**.\n- **\"To look at\" is red.** Open each flagged person and press **Change** to put the real times in, or ask the driver about the missing check.\n- **The driver cannot see their day.** Make sure they have **App access** and have used their code. If the code is lost, make a new one.\n"}, {"id": "staff-files", "n": 20, "title": "Staff files, new starters, leavers and recruitment", "md": "# 20. Staff files, new starters, leavers and recruitment\n\n## What it's for\n\n**Staff files** gives everyone who works for you one file: their details, right to work check, every document with the date it runs out, their new starter pack, the policies they have signed and, when the time comes, their leaving. **Recruitment** looks after finding people: your jobs, where they are advertised and what that costs, and every applicant from first contact to first day. When you take an applicant on, their staff file and new starter pack are made for you.\n\n## Before you start\n\n- You need the **People** section. Pay is separate and is not shown here.\n- Staff files list people who are drivers, mechanics or office logins. New people are added from **HR > Drivers**, **Workshop > Mechanics** or **HR > Team & logins**, not from Staff files.\n- Company policies (the ones new starters read and sign) are set up in **Settings**.\n\n## The Staff files list\n\nOpen **HR > Staff files**. Each person has a row: role, **Started**, **Right to work**, **Documents**, **Next to run out** and **Needs doing** (or **all in order**). The red ones need something doing now. Use **Only files that need something** to see just those, and **Show people who've left** to include leavers.\n\nRight to work shows **not recorded**, **ask the agency** (for agency staff) or **not required** where the law does not need it.\n\nClick a person to open their file. At the top, any problems are listed as **Now** (red) or **Soon**. Then the tabs: **Details & right to work**, **Documents**, **New starter**, **Policies & sign-offs** and **Leaving**.\n\n## Details and right to work\n\nOn the **Details & right to work** tab you record:\n\n- **Job title** (for example Class 1 driver, Transport planner) and **Employed as**.\n- **Started on**. This decides whether the right to work check is a legal must (from 1 October 2026 for those who started on or after that date).\n- **Probation ends**: shown on Home as the review comes up.\n- **Written statement given on**: the written statement of terms is due on or before their first day.\n- **Right to work**: **Checked on** and **How it was checked**. Tick **Their permission to work is time-limited (List B, or a visa / status with an end date)** and give **Permission ends on**: a follow-up check must be done before then, and it shows on Home ahead of time.\n- **Home and emergency contact**: address, emergency contact, their phone and relationship.\n\nFor agency staff, the agency does the check and must confirm it in writing; record that here. For self-employed individuals working for you who started on or after 1 October 2026, check them the same way before they start.\n\nThe screen explains the rule it applies: check before they start work, keep a copy of what you checked with the date, for as long as they work for you and 2 years after. Add the copy under **Documents**.\n\nPress the save button when you are done.\n\n## Documents\n\nOn the **Documents** tab, **What runs out** lists the dates that matter. Press **Add a document**.\n\n1. Under **What is it?** pick the kind of document (licence, CPC card, tacho card, medical, right to work copy, contract and so on).\n2. Add a title if you want, the **Number**, **Issued on** and **Runs out on**.\n3. Attach **The file**: a PDF, photo (JPG, PNG, HEIC) or Word document, up to 20 MB.\n4. Press **Add to file**.\n\nKeep a clear copy of every page you checked, or the online check result. For a driver's documents, the expiry date also updates their driver record, so planning sees it.\n\nFor a photocard licence, the date to type is the photocard date (4b on the front). A **D4 medical** renews their C / C+E entitlement, so its **Runs out on** is the date that entitlement ends (column 11 on the back of the licence). The screen reminds you that a D4 is needed at 45, then every 5 years, and every year from 65.\n\n### Checking a document\n\nA document added by the person themselves from their phone shows **Added by them** and **still to check**. Until someone checks it, its dates do not count for planning. Open it, then press **Mark as checked**. You are asked: \"Have you opened it and seen it's Danny Driver's licence, with the dates as typed?\" Say yes and it shows **Checked** and its date now counts. **Undo check** puts it back if you pressed it by mistake.\n\nOther buttons on each document:\n\n- **Open** shows the file.\n- **Change** corrects a typo in a date or number. What it said before is kept on it. A renewed card is a new document (**Add a document**) and the old one shows as \"replaced by a newer one\".\n- **Take off** removes it from the file after you give a reason. Nothing is deleted: the record and copy stay in the history with who took it off and why.\n\n## New starters\n\nA new starter pack is the list of things a new person must do before and on their first day: give their details, photograph their cards, read and sign documents, and so on. It appears on their phone.\n\n### The new starter checklist\n\nPress **New starter checklist** (top right of **Staff files**) to set what every pack holds. Each step has a **Kind**:\n\n- **Their details**\n- **Photo of a document**\n- **Read and sign**\n- **Shown in person**\n\nand **Who does it**: **on their phone**, **in the office** or **on paper**. Press **Add your own step**, or add from **Suggestions** (they then show **on your list**). Use the up and down buttons to reorder, **Change** to edit and **Take off** to remove. Starting a pack copies this list, so changing it never changes a pack already running. Steps can be for **Drivers**, **Mechanics** or **Office**.\n\n### Starting a pack\n\n1. Open the person's file and go to the **New starter** tab.\n2. Give **Their first day** and press **Start a new starter pack**. The message says \"New starter pack started - it's on Danny's phone now\".\n3. Work through the **Step** list. For each step the office can see what has been done. **Mark done** with an optional **Note** (for example \"checked against the card\"). **Undo** takes it back. **Attach** links a document from their file: add it under **Documents** first.\n4. **Not needed** (with **Why not**, for example \"under 45 - no D4 yet\") takes a step out. **Needed after all** puts it back.\n5. For a paper copy, type their name as signed and attach the scan under **Signed paper copy**, then **Signed on paper**.\n6. The pack closes by itself once everything is done. Or press **Close the pack**, give a reason (for example \"didn't start with us\") and **Close it**.\n\n## Policies and sign-offs\n\nThe **Policies & sign-offs** tab lists each company policy as **signed** with the date and how, or **not signed**. Under **Infringement sign-offs** it lists tachograph sign-offs, with **Signed record (PDF)** for each (chapter 14).\n\n## Leavers\n\n1. Open the person's file and the **Leaving** tab.\n2. Type the **Last day**, choose **Why they're leaving** and **Would you take them back?** (**Yes**, **No** or **Not said**), add **Anything more (optional)**.\n3. Press **Danny is leaving**. A **Leaving 30 Nov** tab and the leavers checklist appear.\n4. Work through the checklist. Each step has **Done** and **Not needed** (give a reason). **Undo** takes it back. If the checklist is empty because it was started before steps were added for their role, press **Add the leavers checklist**.\n5. If the person has **Holiday after their last day**, a warning lists it: cancel or turn it down on the Holiday calendar. Paid holiday owed is settled in final pay.\n6. Press **Finish - Danny has left**. The app warns that their login stops working now, and names anything still to do. Press **Yes - Danny has left** to confirm.\n   If steps are still open, tick **Finish anyway - still to do: ...** first.\n7. Changed your mind? **Not leaving after all** cancels it.\n\nFinishing marks the person as left everywhere (as a driver, mechanic and office person), ends their login and phone app invite, and closes anything open on their new starter pack. Their records are kept. Your company keeps leavers' personal details until someone removes them; the file says so.\n\nPress **The leavers checklist** at the bottom of the tab to set what every leaver's list holds, in the same way as the new starter checklist.\n\n## Recruitment\n\nOpen **HR > Recruitment**. The tabs are **Applicants**, **Jobs & adverts**, **What it costs** and **Set-up**.\n\n### Your apply link\n\nAt the top is **Your apply link**: put it on adverts, your website or a text, and use **Copy link**. Each advert has its own link, so you can see where applicants came from. In **Set-up** you can switch the link off, see it as an applicant (**See it as an applicant**), or make a new one. A new link stops every old one working, and the screen warns you.\n\n### Jobs & adverts\n\n1. On **Jobs & adverts**, press **Add a job**.\n2. Type the **Job title**: say what the job is, not who you want (for example \"Class 1 driver, nights\", never \"young\" or an age). Add **How many**, location, pay, hours, **Status** and **About the job (shown on your apply page)**.\n3. Untick **Show it on your apply page** to hide it.\n4. To record where it is advertised, add an advert to the job: choose the **Job board or where** (or **Somewhere new…** and name it), the **Started** and **Ends (if known)** dates and the **Cost (£)**. Each advert gets its own link: **Copy link**.\n5. **Show filled and closed jobs** includes old ones.\n\n### Applicants\n\nThe **Applicants** tab is a board with a column for each stage. Each applicant is a card showing the job, their licence categories, where they came from and how many days they have been at that stage. Filter with **Show applicants for** (**Every job**).\n\nTo add someone yourself, press **Add an applicant**: name, phone, email, the job (**Applying as**), **Where they heard about it**, **Licence and cards** (**Driver CPC card**, **Digital tacho card**), **Referred by** (a referral bonus is reminded on Home once they pass probation) and notes.\n\nOpen an applicant to:\n\n- Move them on with the **Stage** drop-down.\n- **Record the assessment drive**: the vehicle, each item on your sheet (a score from 1 to 5, a yes or no, or a written note) and the **Result**: **Passed** or **Failed**. Press **Save the assessment**. The card then shows **drive passed** or **drive failed**.\n- **Take them on**: type their **First day**, tick **Start their new starter pack** and press **Take them on**. Their staff file and new starter pack are made. It shows **Taken on**.\n- **Not taking them**: give a reason. Tell them yourself, because nothing is sent. Their details are removed automatically after the time set in **Set-up**.\n- **Reopen** brings back someone you turned down. **Turned down in the last 30 days** lists them.\n- **Referral bonus paid** records the payment.\n\n### What it costs\n\nFor the last few months, each job board's **Spent**, **Applicants**, **Taken on**, **Cost a hire**, **Days to hire** and **Still here after 90 days**, so you can see what each board really costs you per hire and which ones bring drivers who stay. Cost a hire is what you spent there divided by the people taken on from it.\n\n### Set-up\n\nSwitch the apply link on or off, add a line for the top of your apply page, and set **Keep the details of people you don't take for** (6 months covers the time someone could bring a claim, following ICO guidance). You can also edit the **Stages** (columns on your board, with **Taken on** where people wait for their first day), the **Job boards and where you advertise**, whether **We do an assessment drive for drivers**, the sheet of items the assessor marks, and the **Usual referral bonus (£)**.\n\n## Good to know\n\n- **A document does not count for planning until it is checked** if the person added it themselves.\n- **Nothing is deleted from a file.** **Take off** and **Change** keep the history.\n- **Finishing a leaver ends their login at once.** That is why the app asks twice.\n- **A new starter pack is a copy of the checklist** at the time it starts.\n- **Applicants' details are removed after the keep period.** The numbers (where they came from, why not taken on) stay.\n- **The job title must describe the job**, not the person you want.\n\n## When something goes wrong\n\n- **\"Right to work: not recorded\"** on the list. Open the file, fill in **Checked on** and **How it was checked**, and add the copy under **Documents**.\n- **A date does not count for planning.** The document is **still to check**. Press **Mark as checked**.\n- **The Finish button is greyed out.** Steps are still open. Do them, mark them **Not needed** with a reason, or tick **Finish anyway**.\n- **\"Taken on - but no new starter pack\"**. The message says why; start the pack on the person's **New starter** tab.\n- **An old advert link stopped working.** You made a new apply link. Put the new one on your adverts.\n"}, {"id": "holiday-calendar", "n": 21, "title": "The Holiday calendar", "md": "# 21. The Holiday calendar\n\n## What it's for\n\nThe **Holiday calendar** shows who is off and when, for drivers, mechanics and office staff in one place. Anyone booked off here comes off the Planning board and the Workshop board for those days, so nobody plans them in by mistake. It also keeps each person's holiday allowance and shows what is left.\n\n## Before you start\n\n- You need the **People** section.\n- Everyone who is an active driver, mechanic or office person with an admin profile appears on the calendar. If someone is missing, add them on **HR > Drivers**, **Workshop > Mechanics** or **HR > Team & logins**.\n- Set your holiday year and everyone's allowance first, in **Allowances & types** (below). Without an allowance on file, nothing counts down for that person.\n\n## The screen\n\nOpen **HR > Holiday calendar**.\n\n- **Book time off** (top right) and **Allowances & types**.\n- A month grid. Use ‹ and › (**Previous month**, **Next month**) and **This month** to move. **Everyone**, **Drivers**, **Mechanics** and **Office** filter who you see (each shows how many). **Find a name** searches. **Only people off this month** hides everyone else.\n- A row for each person, a column for each day. Weekends and bank holidays are shaded; the bank holidays for the month are listed underneath. A bar across the days is a booking; a half day fills half the cell. A bar with stripes is **Striped = asked for, not approved yet**.\n- A row at the bottom, **Off that day**, counts how many are away each day, so you can see when you are short.\n- The small number beside each name is how many days they have **left** (or \"3 days over\").\n\nAbove the grid, if anyone has asked for time, a box called **Waiting for a yes or no** lists the requests (see below).\n\n## How to book time off\n\n1. Press **Book time off**, or drag across someone's days in their row (\"Drag across someone's days to book them off\"). Dragging fills in the person and the dates.\n2. Choose **Who**.\n3. Choose **Why**: the type of absence, for example Annual leave. A type that takes days off the holiday allowance says \"(comes off their holiday)\".\n4. Set **First day off** and **Last day off**. Choose **How long**: **Whole days**, or for a single day **All day**, **Morning** or **Afternoon**.\n5. Add a **Note** if you like (for example family wedding).\n6. For a type that needs approving, choose **Approval**: **Approve it now** or **Put it in as a request**.\n7. Press **Book it**. If you chose a request, the button says **Put the request in**.\n\nBefore you press it, the drawer shows what the booking will do: how many days it takes, what that leaves of their allowance, and **Also off then**, which names others off on the same days. Weekends and bank holidays do not come off the allowance. If it would take them over their allowance you are told, and \"You can still book it\". Going over is only a warning.\n\nA booking made in the office is approved at once, unless you choose **Put it in as a request**. Anyone booked off, approved or asked for, comes off the boards, so a request still stops them being planned in.\n\n## Requests\n\nDrivers and mechanics can ask for time off from the phone app. Those requests appear in **Waiting for a yes or no**, with the person, type, days, what it leaves of their allowance, who else is off and whether it was \"asked by them on the app\".\n\n- Press **Approve** to say yes.\n- Press **Decline or change…** to open it. You can change the dates or type, add a **Note back (optional)** (for example \"we're short that week\") and press **Turn it down**, or **Approve**. If you changed something, press **Save changes** first (\"Save your changes first\").\n\nIf the days have already passed, the request says **These days have passed - say yes if they had them off, no if they worked**.\n\n## Changing or cancelling a booking\n\nClick a bar to open the booking. You can change the type, dates and note and press **Save changes**, approve or turn down a request, or press **Cancel booking…** then **Yes, cancel it** (**Keep it** backs out). The message is \"Cancelled - Danny Driver is back on\".\n\n## Someone's holiday year\n\nClick a person's name. You see their holiday year: **Allowance**, any carried over, **Taken or booked**, **Asked for** (not approved yet) and **Left**. **Previous holiday year** and **Next holiday year** move between years. **Booked this holiday year** lists each booking with how much it took off their allowance.\n\nTo give one person their own allowance, type it under **Their own allowance this year** (leave it blank for the company's). Use **Carried over from last year** for days brought forward; a minus number is for days borrowed. Press **Save allowance**.\n\n## Allowances & types\n\nPress **Allowances & types** (top right).\n\n- **Holiday year starts in**: the month your leave year begins.\n- **Everyone's holiday allowance**: days a year, not counting bank holidays. Blank means not tracked. Set someone's own from their name.\n- **Bank holidays**: which part of the UK you work to (England and Wales, Scotland or Northern Ireland). It is used for holiday allowances, bank holiday pay rates and working days, and is kept up to date from gov.uk.\n- **Reasons for being off**: each reason has a colour, a name and four ticks: **Comes off holiday allowance**, **Needs approving**, **Paid** and **Counts in working time average**. Annual leave, sick leave and maternity, paternity, adoption and parental leave count 8 hours a day in drivers' 48-hour average, the rule in the Road Transport Working Time Regulations. Add your own at the bottom (for example Jury service, Compassionate leave).\n\nHiding a reason keeps the bookings already made with it. It just cannot be picked for new ones.\n\n## What drivers and mechanics see on the phone\n\nOn their phone, drivers and mechanics see their allowance and what is booked, waiting and turned down (with your note), and can ask for days or half days. They can take back a request that is waiting, but not one you have approved. A type with no approval, such as sickness, books at once. A request is not refused because work is planned on the day; approving it is (see below).\n\n## Good to know\n\n- **Everyone sees the same calendar.** It is shared with the Planning board and the Workshop board. Booked off here means off there.\n- **A whole day off is refused over planned work.** If the person has a run with jobs on it, or a card on the Workshop board, the day cannot be booked. A morning or afternoon is allowed. The message names the days. Move the work first.\n- **Approving a request checks planned work again.** A request is allowed over planned work; approving is not, until the work is moved.\n- **Two bookings cannot overlap.** The message names the booking in the way. A half day can sit beside the other half of the same day.\n- **Going over the allowance is a warning, not a block.**\n- **The allowance counts weekdays only**, less bank holidays.\n\n## When something goes wrong\n\n- **A whole day is refused because work is planned.** The message names the days and the work. Move the work on the Planning board or Workshop board, then book again.\n- **The booking overlaps another.** Open the one it names and change or cancel it.\n- **A request will not approve.** Planned work is on the day. Move it first.\n- **Nothing counts down for a person.** They have no allowance. Set one under **Allowances & types** or on their own holiday year.\n- **Someone does not appear on the calendar.** They are not an active driver, mechanic or office person yet, or they are marked as left.\n- **Bank holidays look wrong.** Check the part of the UK in **Allowances & types**.\n"}, {"id": "catch-up", "n": 22, "title": "Catch up (job checks)", "md": "# 22. Catch up (job checks)\n\n## What it's for\n\n**Catch up** is the first thing to open in the morning. It lists yesterday's jobs that would hold up an invoice, such as a job with no rate, one nobody marked delivered, or one with no delivery ticket. It also lists a few jobs that will not stop an invoice but are worth a look, such as a rate lower than usual or a job that made a loss. You fix each one on its own line, or tick a batch and fix them together. Ten minutes a day here saves a long, painful month end.\n\n## Before you start\n\n- You need the **Operations** or **Money** section on your login (chapter 4). Without either, **Catch up** is not in your menu.\n- Jobs only appear here once they are not yet invoiced. A job already on an invoice or a backing sheet is not listed.\n- Putting a never-planned job onto a vehicle's run needs the **Operations** section. If you only have **Money**, the line tells you who to ask instead of showing the button.\n\n## The screen\n\nOpen **Operations > Catch up**. (**Home** also links to it from the yesterday's-work box.)\n\n- **Yesterday**, **Last 7 days** and **Last month** across the top choose the dates. Use **or a day** to pick any single day. Use **Last 7 days** or **Last month** to catch up after a holiday.\n- Three figures show how things stand: **Jobs on** the day (not yet invoiced), **Holding up invoicing**, and **Worth a look** (jobs that will not stop the invoice).\n- Under them, a row of buttons filters the list: **All**, then one button per problem with the number of jobs, for example **No rate**. The ones that are only worth a look sit after a small **Worth a look:** label.\n- If there is nothing to fix, the screen says **All clear.**\n\nThe table has one line per job: **Date**, **Customer**, **Job** (click the number to open the job), **From → to**, **Vehicle · driver**, **Rate**, **Ticket**, **To sort**, and a button column on the right.\n\n### The problems it looks for\n\nThe **To sort** column shows a label for each problem. Hover over a label to see the detail.\n\nThese hold up invoicing:\n\n- **No rate**: the job has no price.\n- **Not marked delivered**: nobody has marked the job delivered.\n- **No delivery ticket**: it is delivered but has no ticket number.\n- **Never on a driver's run**: the job was never planned onto a vehicle's run.\n- **Loading photos missing** and **Delivery photos missing**: fewer photos than your minimum (chapter 27 explains the setting).\n- **Postcode not found**: the app could not place a postcode.\n\nThese are only worth a look:\n\n- **Rate lower than usual** and **Rate higher than usual**: compared with what this customer is usually charged on the same route. Often a typing slip.\n- **Below their minimum**: under the customer's minimum charge.\n- **Made a loss**.\n- **No driver on the run**.\n\n## How to fix jobs one at a time\n\n1. Open **Catch up** and look at the first line.\n2. **No rate**: type the price in the **Rate £** box and press **Enter**, or press **Save rate**. If the app has seen this customer on the same route before, it shows **last £250.00** beside the box and uses that figure if you just press **Enter**. The cursor drops to the next rate box.\n3. **Not marked delivered**: type the ticket number in the **Ticket** box (if you have one) and press **Enter**, or press **Delivered**. The button changes to **Delivered + ticket** when a ticket is typed. The job is marked delivered at 5pm on its day (or at the current time if today is the day), and shown as \"time not given\" on the job.\n4. **No delivery ticket** on a job already delivered: type the ticket and press **Enter**, or press **Save ticket**.\n5. **Never on a driver's run**: pick the vehicle from **Which vehicle did it?** and press **Put on its run**.\n6. **Postcode not found**, **Made a loss** and the rate warnings: press **Open** to open the job and correct it.\n\nWhen a line is sorted it stays where it was, marked **Sorted** with a tick, so the next line does not jump while you type. It goes when you change the dates.\n\nIf you type a ticket and click away without pressing **Enter**, the line says **Not saved yet - press Enter or \"Delivered + ticket\"**. The ticket is kept in the box, not thrown away.\n\n## How to fix many jobs together\n\n1. Tick the boxes at the left of the jobs. The box in the top-left corner ticks every job shown. Use the filter buttons first if you only want, say, the **No rate** ones.\n2. A bar appears at the bottom, **n ticked**. Choose what to do:\n   - **Rate £** with **Set on the n with no rate**: puts one price on all the ticked jobs that have no rate.\n   - **Use each one's usual rate (n)**: each job gets what this customer was charged last time on the same route.\n   - **Mark n delivered**: marks the ticked, undelivered jobs delivered at 5pm on their day.\n   - **Don't invoice…**: type a reason, for example \"internal yard move\", and press **Don't invoice these**. Those jobs never go on an invoice.\n3. When it has finished, you see a message such as **3 jobs fixed**. If some could not be fixed, a yellow box lists each one with the reason. Click a job number in that list to open it.\n\n### Pasting a lot of tickets\n\nIf you have the tickets in a spreadsheet, press **Paste tickets…** above the table. It shows how many jobs can take a ticket.\n\n1. Copy two columns from your spreadsheet: the **job number**, then the **ticket**, one job a line. Paste them in. Or tick the jobs first and paste just the tickets, one a line, in the same order as the jobs on screen.\n2. A preview table shows each job, customer, date and ticket. Jobs not yet delivered say **marks it delivered**.\n3. Press **Save n tickets**.\n\nAny job numbers that are not in the list (already done, or another day) are named under the box so you can check them.\n\n## Fixing a customer's held-back jobs from Invoicing\n\nWhen you build backing sheets (chapter 23), jobs with a problem are held back. On **Invoicing > To invoice**, the **To sort first** column shows **Fix n jobs** for that customer. It opens this same list for just that customer, showing only the problems that block an invoice.\n\n## Good to know\n\n- **A bulk rate only ever goes on jobs that have no rate.** It never overwrites a price someone already typed.\n- **Delivered with no times is flagged.** Catch up marks a job delivered without real times, so the job shows \"time not given\" and waiting time is not charged from it. If you later learn the real time, add it on the job.\n- **A split load is not delivered until part two is.** A job split at a handover (chapter 9) shows **Split load at the handover - plan who takes it on.** Mark delivered applies to the delivering part.\n- **A job on an issued invoice is locked.** It is not on this list. A company admin can unlock it to correct it.\n- **The usual rate is only a suggestion.** It comes from the same customer on the same route, so check it fits before you press **Use each one's usual rate**.\n- **Imported history is left alone.** Jobs brought in from an old system as past work are not flagged as \"never on a driver's run\".\n\n## When something goes wrong\n\n- **\"n fixed. n couldn't be:\"** A yellow box lists each job with a reason, for example the job has since been invoiced. Open the job from the list and sort it there.\n- **\"Not saved - ...\"** appears when a rate could not be saved. The reason follows the dash.\n- **Nothing shows for yesterday but you know something is wrong.** Check you are on the right tab. Jobs already on an invoice or a backing sheet are not listed.\n- **The Put on its run button is missing.** Your login has **Money** but not **Operations**. Ask someone who has the Planning board.\n- **A rate will not save.** Type it in pounds, like 250 or 1,250.50, with numbers only.\n"}, {"id": "invoicing", "n": 23, "title": "Invoicing", "md": "# 23. Invoicing\n\n## What it's for\n\n**Invoicing** turns finished jobs into invoices. The app builds a **backing sheet** for every customer whose billing period has closed. A backing sheet is a draft invoice: the list of jobs, with the amounts, that you check before it goes out. When you are happy you issue it, and it gets its invoice number. After that you record payments, issue credit notes if something was wrong, and send everything across to Sage. You can also find any invoice again by number, customer, job, PO or amount.\n\n## Before you start\n\n- You need the **Money** section on your login (chapter 4).\n- Fill in **Invoicing > Invoice settings**: your legal name, address, whether you are VAT registered (and your VAT number), payment terms, bank details and the numbers to start from. An invoice has to show them, and the app will not issue without them.\n- Each customer needs a billing address and a billing profile on **Customers**: how often you invoice them (**Weekly**, **Fortnightly**, **Monthly** or **Every job (one invoice per job)**), whether they need a PO number, and whether they are self-billing. Chapter 2 covers the set-up.\n- Fix the day's gaps first on **Catch up** (chapter 22). Jobs with no rate, no ticket or not delivered are held back.\n\nThe screen has five tabs along the top: **To invoice**, **Backing sheets**, **Invoices**, **Sage export** and **Invoice settings**. If your company has a workshop that bills outside customers, a **Haulage | Workshop** switch sits at the top right. The workshop side has its own invoices and numbers and is covered in chapter 18.\n\n## Invoice settings\n\nOpen **Money > Invoicing > Invoice settings** (the same panel is on **Settings > Company**).\n\n- **Your company**: **Legal name**, **Company number**, **Email**, **Phone** and **Address**.\n- **VAT and payment**: **Are you VAT registered?** Choose **Yes - add VAT to invoices** or **No - no VAT**. A new company has to answer before it can issue anything. If you answer Yes, type the **VAT number**. Set the **VAT rate %** and **Payment terms (days)**; a customer's own terms win. Fill in **Bank details** (printed under Payment) and a **Footer** such as your terms of business.\n- **How you invoice**: **Usual wording of the line**, **Your week ends on** (your weekly customers are invoiced up to this day), and **Start invoicing from**.\n- **Invoice numbers start with** and **Next invoice number** carry on from your current numbering. **Credit notes start with** and **Next credit note number** do the same. You can only raise a number, never lower it below one already used.\n- **Sage sales nominal code** (usually 4000) and **Sage bank code (money received)** (usually 1200).\n\nPress **Save settings**. A message such as **Saved - but you said you are VAT registered: type your VAT number before issuing an invoice** tells you what is still missing.\n\n## Starting out with imported history\n\nIf you brought in old jobs (chapter 3) and the oldest is more than two weeks back, the **To invoice** tab first asks **Before the first backing sheets: was any of this work invoiced already?** You have two choices:\n\n1. Type the date you start invoicing from and press **Start from this date**. Older work is set aside as already invoiced.\n2. Press **None of it was invoiced - invoice it all**.\n\nYou can change the date later under **Start invoicing from**. Until you answer, the **Build backing sheets** button is replaced by a reminder.\n\n## How to build and check backing sheets\n\n1. Open **Invoicing > To invoice**. The list shows each customer with how they are **Invoiced**, **Due up to** (the end of their last closed period), **Due now**, **To sort first**, **Late charges** and **This period so far**.\n2. Use **Work dated** to limit the range if you want to, for example **Last month**.\n3. Press **Build backing sheets for n customers**. A report shows what was built, and which jobs were held back with a reason beside each.\n4. Open **Backing sheets** and click a customer. The backing sheet opens beside the list. Check the lines.\n5. Fix anything that is wrong (see below), then issue it.\n\nThe figures at the top are **Customers ready**, **Due to invoice** and **Jobs to sort first**. **Late charges** are extra charges added to a job after it was invoiced; they go on that customer's next sheet.\n\n### Invoicing a customer early\n\nFor a customer whose period is still running, the **This period so far** column has **Invoice these now**. It puts the work done so far on one backing sheet. You are asked to confirm first.\n\n### Choosing the jobs yourself\n\nClick a customer on **To invoice** to open their jobs. Tick the jobs you want, or press **Tick everything due**. Then press **Make a backing sheet**, or **Add to their backing sheet** if one already exists. You can search the jobs by job number, ref, ticket, postcode or vehicle.\n\nIf a ticked job has a problem, you must give a reason (\"customer agreed the rate by phone\"). You can type one reason for all of them. It stays on the backing sheet for good. If a job should never be invoiced (an internal move), press **not to be invoiced?** beside it and give a reason.\n\n### Searching for work still to invoice\n\nThe search box on **To invoice** takes a job number, account code, customer name, order ref, ticket, postcode or vehicle. It shows matching jobs with an **Invoice it** button.\n\n## What a backing sheet shows\n\nOpen a draft. At the top you can set:\n\n- **PO number**. It says **PO number (needed)** if the customer requires one on every invoice. You cannot issue without it.\n- **Invoice style**: **One line + backing sheet** (one line per customer wording, with the job-by-job sheet attached) or **A line for every job**.\n- **Wording of the line**.\n- **Self-billing customer** tick box (see below).\n\n**What the invoice will show** lists exactly what will print. Under it, any fuel surcharge and any late charges are shown as **added when issued**, so the total here is the total you will issue. **Backing sheet** lists the jobs, with date, vehicle, order ref, ticket and amount.\n\nOn each line, **Take off** removes a job from this sheet with a reason; it goes back to waiting to be invoiced. **+ Add a line** adds a manual line, such as bin hire, with a description and an amount. Taken-off lines are listed under **n lines taken off**.\n\n**Discard** throws the whole backing sheet away. Its jobs go back to waiting to be invoiced. **Open draft PDF** shows it as a PDF.\n\n## How to issue an invoice\n\n1. Open the backing sheet.\n2. Fix any yellow warnings at the top. The **Issue invoice…** button stays greyed out while one remains. They name the problem, for example \"Job 289065 has no rate - add one on the job, or take it off.\"\n3. Press **Issue invoice…**. The box says who and how much, for example \"Issue this to Northgate Aggregates for £1,440.00 inc VAT?\" It includes the fuel surcharge.\n4. Press **Yes - issue it**. The invoice gets its number and the next backing sheet opens.\n\nIssuing does not email anything. Open the PDF and send it yourself.\n\nTo issue several at once, tick them on **Backing sheets** (**Tick all** is there too) and press **Issue n…**, then **Yes, issue**. The message lists what was issued and anything **not issued** with a reason. Self-billed sheets are skipped in a batch because each needs the customer's own number.\n\n## Self-billing\n\nSome customers send you the invoice and you match it. Tick **Self-billing customer** on the backing sheet (or set it on the customer). The sheet then asks for **Their invoice number**, **Their invoice date** and **Their total inc VAT (£)**. The hint shows what your sheet comes to. The button reads **Record their self-bill…** and then **Yes - record it**. If the totals do not match, the app refuses and gives the difference: take off jobs they did not include, or correct rates, until the two match. Anything you take off stays waiting to be invoiced.\n\n## After an invoice is issued\n\nAn issued invoice is frozen. Click it on **Invoices** to open it. The top shows **Total**, **Paid** and **Still owed**, with a status such as **Awaiting payment**, **Part paid**, **Overdue**, **Paid**, **Credited (nothing to pay)** or **Overpaid**. **In Sage** shows once it has been exported.\n\n### Recording a payment\n\n1. Press **+ Record a payment**.\n2. Type the **Amount**, or press **All of it** to fill in what is owed. Set **Paid on**, **How** (bank transfer, direct debit, card, cheque, cash, other) and **Their reference**.\n3. Press **Record**. Part payments are fine.\n\nIf the amount is more than what is owed, a **They paid more than the invoice** tick box appears. A payment can be removed with **Take off** and a reason, unless it has already gone to Sage. If one customer pays several invoices in one go, use **Record a remittance…** on **Credit control** (chapter 24).\n\n### Credit notes\n\nIf the invoice was wrong, press **Credit…** at the foot of the invoice.\n\n1. Tick the lines to credit. For each, set the amount, which is before VAT. The VAT and the total are shown beneath.\n2. Type a **Reason for the credit**. It shows on the credit note.\n3. Optionally tick **Invoice it again later** on a fully credited job, to put it back for invoicing, for example if it was billed to the wrong customer. This only works when the whole line is credited.\n4. Press **Issue credit note**. You are asked to confirm, because it cannot be undone.\n\nThe credit note appears under **Credit notes** with its own **Open PDF**. It takes that amount off what the customer owes and goes to Sage with your next export.\n\n### Voiding\n\n**Void** (with a reason) is only offered on an invoice with no payments, no credit notes and nothing yet sent to Sage. Its jobs go back to waiting to be invoiced. Otherwise credit it.\n\n### Unlocking a job\n\nA job on an issued invoice is locked. A company admin can unlock it on the job, giving a reason, to correct it. Raise a credit note if the money changes.\n\n## The PDF\n\n**Open PDF** on an invoice, or **Open draft PDF** on a backing sheet, draws the document. Page one is the invoice. The backing sheet follows. In the desktop app it opens in your PC's PDF viewer; in a browser it opens in a new tab.\n\n## Finding an invoice\n\nOpen **Invoicing > Invoices**. The big box searches the invoice number, customer name or code, PO, any job on the invoice (job number, order ref, postcode or place name), the wording of a line, or an amount. A search such as **£1250** finds amounts only. When something is found inside the invoice, the row says **Found:** and what matched.\n\nFilters sit under the box:\n\n- **Customer** (**Every customer**).\n- **Invoice date**: **Any time**, **This month**, **Last month**, **This quarter**, **Last 3 months**, **This year**, **Last year** or **Pick dates…**.\n- **£ from** and **£ to**.\n- **Sage: either**, **Sent to Sage** or **Not sent to Sage**.\n- Buttons for where it stands: **All**, **Still owed**, **Overdue**, **Part paid**, **Awaiting payment**, **Paid**, **Void**.\n\nThe figures show **Invoices found**, **Total**, **Still owed** and **Overdue**. Click a column heading to sort. **Clear filters** starts again. A search shows at most the first 1,000.\n\nTick invoices and a bar appears:\n\n- **Download PDFs** makes one zip of their PDFs.\n- **Mark paid…** records each one's full balance as paid on the date you choose. Invoices with nothing owed are left alone, and the message says what was skipped.\n- **Download list (Excel)** saves the ticked ones, or everything shown, as a spreadsheet.\n- **Untick all**.\n\n## Sending to Sage\n\nOpen **Invoicing > Sage export**. This makes a Sage 50 import file: invoices, credit notes and money received (payments). In Sage use **File → Import → Audit Trail Transactions**.\n\n1. Choose **Dated from** and **to**, or press **This month**, **Last month** or **Everything not sent**. Last month is the default.\n2. A table lists exactly what will go across. If something needs fixing, a yellow box says what. A customer with no account code is refused and named.\n3. Press **Export n invoices, n credit notes, n payments…**.\n4. The warning says the documents will be marked as sent to Sage and will not be offered again. Press **Yes - make the file**.\n\nEach document goes across once. **Past exports** lists earlier files with **Download again**. If an invoice was already exported, its credit note and payments go in your next export: do not key them into Sage by hand. One file holds haulage and workshop, each to its own sales code.\n\n## Good to know\n\n- **A job is on one invoice at a time.** A job on another invoice is refused. Take it off there first.\n- **Numbers are never wasted.** If issuing fails, no number is used. Each series (invoices, credit notes, workshop) counts its own numbers.\n- **Issuing is final.** After issue you can only void (in the narrow case above) or credit.\n- **Weeks end on a fixed day.** Your weekly customers are invoiced up to the day set in **Your week ends on**. Fortnightly customers use a fixed fortnight rhythm.\n- **Fuel surcharge** is a percentage on the haulage lines, added when you issue. The backing sheet shows it as **added when issued**.\n- **Workshop and haulage never mix.** A job card cannot go on a haulage invoice, or a haulage job on a workshop one.\n- **Nothing is emailed from here.** You open the PDF and send it yourself.\n\n## When something goes wrong\n\n- **\"That invoice has been issued - it can't be changed. Void it or credit it instead.\"** Use **Credit…**.\n- **\"Before your first invoice: are you VAT registered?\"** Answer it on **Invoicing > Invoice settings**.\n- **\"Job 289065 is already on an invoice or backing sheet - take it off there first.\"** Find the other sheet and press **Take off**.\n- **\"These need a reason before they can go on: ...\"** Tick the jobs and type a reason.\n- **\"These are marked as not to be invoiced - clear that on the job first.\"** Open the job and clear the \"no invoice\" mark.\n- **\"Their self-bill is £x; this backing sheet comes to £y ...\"** Adjust the sheet until they match.\n- **\"For (a line): credit between £0.01 and £x (what's left of it).\"** The credit is too big or too small.\n- **\"That's more than the £x still owed on INV-0001. If they really paid more, tick 'They paid more than the invoice'.\"**\n- **\"That payment has already gone to Sage in an export...\"** Take it off in Sage, and record the correction here as a new payment or credit note.\n- **\"That invoice has already gone to your accounts package - credit it instead...\"** Void is refused once exported.\n- **\"Nothing new to export in that period - every issued invoice, credit note and payment has gone across already.\"** Try **Everything not sent**.\n- **\"Fix these first: ...\"** on the Sage export: the list names what is missing, such as a customer account code.\n- **\"Number 1042 has been used already (the last was 1050) - pick a higher one.\"** Choose a number above the last used.\n"}, {"id": "credit-control", "n": 24, "title": "Credit control and chasing", "md": "# 24. Credit control and chasing\n\n## What it's for\n\n**Credit control** shows who owes you money, how old each debt is, and how each customer usually pays. From here you log your calls, record that a customer has promised to pay, and send them a statement or a reminder letter. You also record one payment that covers several invoices. Whether an invoice is paid, part paid or overdue is always worked out from the payments, so recording a payment is all it takes for the status to follow.\n\n## Before you start\n\n- You need the **Money** section on your login (chapter 4).\n- Invoices must have been issued (chapter 23). Credit control only lists issued invoices that still have a balance.\n- For reminder emails, put each customer's billing email on **Customers**. The Chase box shows it as **Invoices go to** the address.\n\n## The screen\n\nOpen **Money > Credit control**.\n\nAt the top, two figures show **Owed to you** (split into haulage and workshop) and **Overdue**. A second row breaks the debt down by age: **Owed - not due yet**, **1-30 days overdue**, **31-60 days overdue** and **Over 60 days overdue**. The older two turn to a warning colour when they are not zero. If customers have paid you more than they owe, the **Owed to you** figure says how much is held in credit.\n\nBelow that are three controls and two lists.\n\n- **Record a remittance…** (button, explained below).\n- **Everything | Haulage | Workshop**: shows one kind of invoice or both. Each invoice is labelled **Haulage** or **Workshop** in the **For** column.\n- A search box: **Search customer, account code, invoice no.…**\n- **Which date** (**Invoice date** or **Due date**) with **From** and **to** boxes, and **Clear dates**. When dates are set, a line says how many invoices match and how much is still owed on them.\n\n### How customers pay\n\nThe first list is one row per customer. The columns are **Customer**, **Owed now**, the four ageing bands (**Not due yet**, **1-30 overdue**, **31-60 overdue**, **Over 60 overdue**), **Overdue**, **Chase**, **Usually pays in**, **Paid late** (for example \"2 of 11\") and **By (when late)**. Click any column heading to sort, for example by **Over 60 overdue** to find the oldest money.\n\nClick a customer's row to filter the second list to just their invoices. Press **Show all** to come back.\n\nThe **Chase** column shows:\n\n- **promised** with a date, if they have promised to pay. It turns to **promise broken** when that date has passed with no payment.\n- **next** with a date, when you have set one. The date turns to a warning colour on and after the day.\n- A **Chase…** button.\n\n### Invoices owed\n\nThe second list has one row per invoice: **Customer**, **Invoice**, **For**, **Date**, **Due**, **Total**, **Still owed** and **Status**, for example **Overdue · 12 days**. Click an invoice to open it. From there you can record a payment, issue a credit note or open the PDF (chapter 23).\n\n## How to chase a customer\n\n1. Press **Chase…** beside the customer (or **Chase** in the row of their name). A drawer opens with the customer's name.\n2. The figures at the top show **Owed**, **Overdue**, **31+ days overdue** (with how much is over 60) and **Chase next**.\n3. If there is a promise, a box shows **Promised**, **Promise kept** or **Promise broken**, the amount and date, who they promised to, and how much has been paid since.\n4. Under **Send them**, choose what to send (see below).\n5. Under **Log a chase**, record what you did.\n6. Under **What they owe**, check the invoices, how many days overdue each is, and what is still owed.\n\n### Sending a statement or a reminder\n\n- **Statement (PDF)** saves a statement of the customer's account. It works even when nothing is overdue, and shows what is coming due.\n- Choose **First reminder**, **Second reminder** or **Final reminder**, then press **Reminder letter (PDF)** to save a letter at that level.\n- **Copy as email** copies the reminder text, with a subject and the customer's address, to your clipboard. Paste it into your own email program.\n\nThe reminder letter and **Copy as email** are greyed out when nothing is overdue (the screen says **Nothing's overdue, so there's no reminder to send**).\n\nSaving a PDF notes it in the chase log automatically. The app does not send anything itself. You attach the file to your own email or print it.\n\n### Logging a chase\n\nUnder **Log a chase**:\n\n1. **What you did**: **Phoned**, **Emailed**, **Letter sent**, **Statement sent**, **Reminder sent** or **Note**.\n2. **About**: **The whole account**, or one particular invoice.\n3. **What was said**: a short note.\n4. **Chase again on**: a date. The customer's row then shows **next** and the date, and turns a warning colour when it arrives.\n5. **They promised to pay by**: a date, if they promised. **Promised amount (£)** is available once you set the date. Leave it blank to mean everything owed.\n6. Press **Add to the log**.\n\nThe **Chase log** lists everything with the date, who logged it and the invoice it was about. A **Note** needs words, or a promise date.\n\n## Recording one payment against several invoices\n\nWhen a customer sends one payment that covers several invoices, use **Record a remittance…** rather than recording each invoice by hand.\n\n1. Press **Record a remittance…**.\n2. **Pick the customer who paid…**. The list shows what each one owes. Nobody is picked at the start, so choose carefully.\n3. Type the **Amount received (£)**, the **Date received**, **How** it was paid and **Their reference**.\n4. Under **Which invoices**, leave the **Pay (£)** boxes blank to pay the oldest first, or type how much goes on each invoice as the remittance says. Boxes show what the app will do if you leave them blank. The line **It will:** says which invoices it will pay off and which it will part pay.\n5. Press **Record it**.\n\nIf you type your own split, it has to add up to the amount received. The screen says **The amounts add up to £x - the payment is £y** when it does not, and the button is greyed out. If the amount is more than the customer owes, it warns you to check.\n\nIf a payment like this was already recorded, a tick box appears, **It's a second payment**. Tick it only if the customer really did pay twice.\n\n## Good to know\n\n- **Status is never typed in.** It is worked out from the payments. If an invoice shows the wrong status, a payment is missing or wrong.\n- **Credit notes count.** A fully credited invoice shows **Credited (nothing to pay)**.\n- **The \"usually pays in\" figures use paid invoices.** They only appear once a customer has settled some.\n- **Workshop and haulage are listed together but labelled.** Use the **Haulage | Workshop** buttons to see one side.\n- **A promise is judged against payments.** It shows as kept when the amount has been paid, broken when the date passes without it.\n- **Sage.** Payments recorded here go across in your next Sage export (chapter 23).\n\n## When something goes wrong\n\n- **\"That's more than the £x still owed on INV-0001...\"** You typed more than is owed. If they really paid more, tick **They paid more than the invoice** on the invoice.\n- **\"That customer doesn't owe anything on an issued invoice.\"** There is nothing to record a remittance against.\n- **\"INV-0001 only has £x left to pay.\"** One of your typed splits is more than that invoice's balance.\n- **\"That's £x more (or less) than the invoices chosen...\"** The split does not add up to the amount received. The message ends \"adjust the amounts.\"\n- **\"One of those invoices isn't owed by this customer any more - refresh the page.\"** Someone else recorded a payment first.\n- **\"A payment of this money looks already recorded: ...\"** The same amount, customer and reference was recorded a moment ago. Check first. If the customer really did pay twice, tick **It's a second payment**.\n- **Nothing owed.** If the page says **Nothing owed** with every issued invoice paid, that is good news.\n"}, {"id": "actual-costs", "n": 25, "title": "Actual costs", "md": "# 25. Actual costs\n\n## What it's for\n\nWhen you cost a job, the app uses estimates: a miles per gallon, a pay scheme, a maintenance pence per mile. **Actual costs** brings in what was really spent, from your fuel card, payroll, garage and tyre bills and subcontractors' invoices, and sets it beside the estimates, vehicle by vehicle, driver by driver and subcontractor by subcontractor. It also works out each vehicle's real miles per gallon. Nothing here is guessed. If a cost has not been imported, the screen says **not imported**; it never shows the estimate as if it were real.\n\n## Before you start\n\n- You need the **Money** section on your login (chapter 4).\n- Jobs should be on the Planning board with vehicles and drivers, so there is something to compare against.\n- Have your files ready as a spreadsheet: **.csv** or **.xlsx**. Most fuel card portals, payroll packages and accounts programs can export one.\n- Vehicles with the right registrations must be on file. Unknown ones are added for you (see below).\n\n## The screen\n\nOpen **Money > Actual costs**. Two tabs: **Estimated vs actual** (the report) and **Import costs**.\n\n## How to bring costs in\n\n1. Open **Import costs**. You are asked **What are you bringing in?** Choose one card:\n   - **Fuel**: your fuel card or bunker statement. Date, registration, litres, cost.\n   - **Payroll**: what each driver cost. Pay date, driver, hours, gross and employer's costs (or the total).\n   - **Subcontractor invoices**: what subcontractors billed you. Quote your order number and each is matched to its load.\n   - **Maintenance**: garage and parts invoices. Date, vehicle or trailer, cost.\n   - **Tyres**: tyres fitted. Date, vehicle or trailer, position, cost.\n2. Press **Choose a file…**, or drag the file onto the box. The app reads it.\n3. **Match the columns.** For each field the app needs (a star means required) it has picked the column it thinks fits. Check each one, and change any that are wrong. A box left at **not in this file** means that field is not supplied.\n4. If you will import this layout again, type a name in **Remember this layout as (optional)**, for example \"Keyfuels statement\". Next time the app says **layout recognised**.\n5. Press **Check the rows**. The result shows **Will import**, **Already imported** (skipped, never doubled) and **Refused** (listed with the reason).\n6. Read the notes. Rows are listed as **refused** or **note**.\n7. Press **Import n rows**. A bar shows **Saving**. **Stop** halts it; what was saved stays, and importing the file again carries on.\n8. The result says **Imported n cost lines**. Press **Import another file** or **Done**.\n\nPress **‹ Choose a different kind** at any time to go back.\n\n### What the check tells you\n\n- **Vehicles not on file** are added as provisional vehicles on fleet-average costs. They are marked **check details** so you can fix them later. A trailer's number is recognised on maintenance and tyres files.\n- **New suppliers** to be added are listed.\n- **Drivers not on file**: for each name you choose **Add as a new driver (to check)** or **Same person as Danny Driver (92% match)**. Nothing is merged unless you say so. A match is remembered for next time.\n- Rows are refused for plain reasons, such as a bad date, no registration, a £0 amount, or payroll gross plus employer's costs that do not add up to the total.\n\n### Importing the same file twice\n\nThe same file imported twice doubles nothing. Rows already imported are skipped and counted under **Already imported**. The same line appearing twice in one file is treated as two real purchases.\n\n### After a fuel import\n\nIf the fuel card paid a different price from the one your quotes use, a blue box says **Your fuel card paid 142.3p a litre on average over the fortnight to (date). Quotes use 139.0p.** Press **Use 142.3p from today** to set the diesel price. It is the same price you can set on **Costs & rates**.\n\n### Mileage from fuel and garage lines\n\nA fuel, garage or tyre line with a mileage on it also records an odometer reading for the vehicle.\n\n### Undoing an import\n\nEarlier imports are listed on the **Import costs** tab under **Past cost imports** (choose a kind first, or press **‹ Choose a different kind**). Click one and press **Undo this import**. You are asked **Yes - take out n cost lines**. The lines are taken out and can be imported again.\n\n## How to read the report\n\nOn **Estimated vs actual**, pick **Last month**, **This month** or **Last week**, or choose **From** and **to** dates. **Download (CSV - opens in Excel)** saves the report as a spreadsheet.\n\nA strip of badges under the dates shows what has been imported for the period, for example **Fuel 148 lines · £21,430 · 01/10/2026 – 31/10/2026**. A badge reading **not imported for this period** tells you why a figure below is missing. **Own workshop** shows finished job cards and their cost. **Outside firms** shows jobs done by garages and tyre firms. **Import costs…** jumps to the import tab.\n\nFour figures sit above the tables: **Fuel (diesel)**, **Driver pay**, **Subcontractors** and **Real MPG (fleet)**. Each shows the actual, and under it the estimate (**estimated £x**). Real MPG is the miles run divided by the diesel bought.\n\n### Vehicles\n\nOne row per vehicle with **Jobs**, **Miles**, **Fuel**, **Real MPG**, **Maintenance** and **Tyres**.\n\n- Each cost shows the actual, a plus or minus difference against the estimate when it is £1 or more apart, and the estimate beneath.\n- AdBlue is shown separately as **+ AdBlue**.\n- **Real MPG** shows against the target, for example **vs 8.4**. It uses real distance (tracker or odometer) where there is some. When it can only use the miles on the jobs it is marked **rough**, because driving that is not on a job also burns fuel.\n- Under maintenance, **workshop £x · garage £y** shows the split between your own workshop and outside bills. The app never counts the same repair twice. A job card with a part that has no price is flagged, never guessed. The real pence per mile is shown, for example **7.2p/mile real · quotes use 6.0p**.\n\nTwo buttons let you correct your costing from the real figures:\n\n- **Use the real MPG** puts the vehicle's real MPG into its costing, so quotes use it from then on. It shows only with 1,000 or more miles of real distance behind it, and only when the figure is believable.\n- **Use the real figure** does the same for maintenance pence per mile (also from 1,000 miles).\n\n### Trailers - maintenance\n\nEach trailer's own-workshop cost, garage bills and total.\n\n### Drivers\n\n**Jobs**, **Hours (jobs / paid)** and **Pay**. Hours on the left are what the jobs needed; hours on the right are what payroll paid. **Pay** shows the actual beside the estimate.\n\n### Subcontractors\n\n**Loads**, **Invoices** and **Billed**, beside what was agreed. **n not matched to a load** means a subcontractor invoice did not match one of your orders. Under it, **Given to a subcontractor - their invoice hasn't come in yet** lists loads you gave out with the agreed price, so you know what to expect.\n\n### Outside firms' bills to match\n\nIf a garage's bill arrives for a repair you already priced by hand on a job card, an orange box titled **Outside firms' bills to match** lists each look-alike: the firm, the amount and date, and the card it probably belongs to. Until it is matched, both the typed price and the bill count, so costs read high. Press **Match** beside each to confirm. The bill then becomes the card's price, counted once.\n\n## Good to know\n\n- **Missing means not imported.** A figure that has not been imported shows **not imported** or **—**, never the estimate.\n- **The diesel figure leaves out AdBlue.** It is shown on the vehicle's row.\n- **A subcontractor invoice that quotes your order number** (for example PO-14) or the job number is matched to its job for you.\n- **An unknown vehicle becomes provisional.** It is on fleet-average costs until you fill in its details (chapter 13).\n- **Payroll** counts against the driver's estimated pay for the period. A driver who is not on file is offered a close match, and you decide.\n- **Maintenance** counts your own workshop's finished job cards and outside garage bills together, without counting a repair twice.\n- **Insights uses these figures.** The more you import, the more of Insights' findings are worked out from real costs (chapter 26).\n\n## When s
